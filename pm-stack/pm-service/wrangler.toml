# pm-service Worker (CF-5c, #14969): the hosted edition of the PM
# service's read API (#12828), served from the tenant plane's
# Turso/libSQL DB through the async store layer.
#
# Worker secrets are managed separately; values never belong in
# this file. Set with `wrangler secret put`:
#   PM_TENANT_DB_URL    tenant DB base URL (libsql:// or https://)
#   PM_TENANT_DB_TOKEN  tenant DB auth token
# VERSION is a plain var stamped by the deploy workflow with the
# full commit SHA on every versions upload (design §4); /health
# reports it and the deploy's health gate requires the match.
name = "pm-service"
main = "src/worker.ts"
compatibility_date = "2025-09-15"
workers_dev = true

[[durable_objects.bindings]]
name = "BOARD_DO"
class_name = "BoardDO"

[[migrations]]
tag = "v1-board-do"
new_sqlite_classes = ["BoardDO"]
