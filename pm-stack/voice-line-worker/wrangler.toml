name = "voice-line"
main = "src/index.ts"
compatibility_date = "2025-09-15"
workers_dev = true

# Workers AI: Whisper (speech-to-text) + MeloTTS (speech out), called
# directly per #9800 — the pooled/failover speech route is #9801.
[ai]
binding = "AI"

[durable_objects]
bindings = [{ name = "VOICE_SESSIONS", class_name = "VoiceSession" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceSession"]

# Turso session ledger (#9800). TURSO_TOKEN and STATUS_INGEST_TOKEN are
# secrets (wrangler secret put), never vars in this file.
[vars]
TURSO_URL = "https://voice-line-ledger-dezren39.aws-us-east-1.turso.io"
