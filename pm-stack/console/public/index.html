<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12151a" />
    <title>Console · PM stack</title>
    <link rel="icon" href="/console/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/console/app.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/console/">Console</a>
      <a class="quiet" href="/">Dashboard</a>
      <a id="apk" class="quiet" href="/console/pm-console.apk" hidden
        >Android app</a
      >
      <span class="grow"></span>
      <span id="who" class="quiet"></span>
    </header>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <main id="view" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="ask">
      <form method="dialog" id="ask-form">
        <h2 id="ask-title"></h2>
        <p id="ask-text"></p>
        <label id="ask-label" for="ask-input"></label>
        <textarea id="ask-input" rows="3"></textarea>
        <div class="row end">
          <button value="cancel" class="ghost" type="submit" formnovalidate>
            Cancel
          </button>
          <button value="ok" id="ask-ok" type="submit">Confirm</button>
        </div>
      </form>
    </dialog>
    <script src="/console/app.js" type="module"></script>
  </body>
</html>
