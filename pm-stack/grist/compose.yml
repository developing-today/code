# Project-management stack — Phase 2: Grist (roadmap/table layer).
#
# Grist (github.com/gristlabs/grist-core, Apache-2.0) — chosen over
# Baserow in Phase 2; the evaluation is recorded in the design
# record. The image is gristlabs/grist-oss: the pure Apache-2.0
# build. (The main gristlabs/grist image toggles in a proprietary
# "full" edition — we do not use it.) Upstream publishes floating
# tags only, so the image is pinned BY DIGEST (the digest is the
# pin; the comment records the release it was at pin time).
#
# Local changes vs the upstream one-liner:
#   - the web port binds to host loopback and the host's tailnet
#     address only — no public endpoint (Grist needs no inbound
#     webhooks; the aggregator reaches it over the tailnet);
#   - state lives in a named volume at /persist (Grist's own path
#     for its SQLite-backed documents);
#   - configuration comes from ./.env, rendered by deploy.sh from
#     ../../secrets/pm-stack.sops.yaml. Never hand-edit .env on a
#     host and never commit it.
services:
  grist:
    # Grist OSS v1.7.21, image pulled 2026-10-24. Pinned by digest.
    image: gristlabs/grist-oss@sha256:d761de16871ad0022c0ff966b46a92360c23073db8414ebb356cf879f510b1c4
    ports:
      - "127.0.0.1:8484:8484"
      - "100.99.113.103:8484:8484"
    env_file:
      - .env
    environment:
      GRIST_DEFAULT_EMAIL: drewrypope@gmail.com
    volumes:
      - grist_data:/persist
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://127.0.0.1:8484/api/session/access/active"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  grist_data:
