name: pm-dispatch-start
description: >-
  Launch a tracked OpenCode session via pm-dispatch (POST /v1/sessions).
  The calling job MUST grant `permissions: id-token: write` — this action
  mints a GitHub Actions OIDC token (audience pm-dispatch) to authenticate.
inputs:
  repo:
    description: "Target repo (owner/name). Any allowlisted repo may target any allowlisted repo."
    required: false
    default: ${{ github.repository }}
  title:
    description: "Session / tracking-issue title."
    required: true
  prompt:
    description: "Work for the OpenCode session."
    required: true
  model:
    description: 'Optional model hint, "provider/model".'
    required: false
    default: ""
  priority:
    description: "Optional priority: 10-90 or critical|high|normal|low."
    required: false
    default: ""
  kind:
    description: "Optional task kind hint (passed through to pm-dispatch)."
    required: false
    default: ""
  wait:
    description: '"true" to wait for the launch, "false" to return after the enqueue.'
    required: false
    default: "true"
outputs:
  task_id:
    description: "pm-dispatch queue task id."
    value: ${{ steps.dispatch.outputs.task_id }}
  session_id:
    description: "OpenCode session id (empty when wait is false)."
    value: ${{ steps.dispatch.outputs.session_id }}
  issue_number:
    description: "Tracking issue number (empty when no issue was created)."
    value: ${{ steps.dispatch.outputs.issue_number }}
  issue_url:
    description: "Tracking issue URL (empty when no issue was created)."
    value: ${{ steps.dispatch.outputs.issue_url }}
runs:
  using: composite
  steps:
    - name: Launch a tracked OpenCode session via pm-dispatch
      id: dispatch
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PRIORITY: ${{ inputs.priority }}
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_WAIT: ${{ inputs.wait }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::pm-dispatch-start: ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN are not set. The calling job must grant 'permissions: id-token: write' so this action can mint an OIDC token." >&2
          exit 1
        fi
        case "$INPUT_WAIT" in
          true|false) ;;
          *) echo "::error::pm-dispatch-start: wait must be \"true\" or \"false\", got: $INPUT_WAIT" >&2; exit 1 ;;
        esac
        oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pm-dispatch" | jq -r '.value // empty')"
        if [ -z "$oidc_token" ]; then
          echo "::error::pm-dispatch-start: failed to mint a GitHub Actions OIDC token (audience pm-dispatch)." >&2
          exit 1
        fi
        payload="$(jq -n \
          --arg repo "$INPUT_REPO" \
          --arg title "$INPUT_TITLE" \
          --arg prompt "$INPUT_PROMPT" \
          --arg model "$INPUT_MODEL" \
          --arg priority "$INPUT_PRIORITY" \
          --arg kind "$INPUT_KIND" \
          --argjson wait "$INPUT_WAIT" \
          '{repo: $repo, title: $title, prompt: $prompt, wait: $wait}
           + (if $model != "" then {model: $model} else {} end)
           + (if $priority != "" then {priority: $priority} else {} end)
           + (if $kind != "" then {kind: $kind} else {} end)')"
        response="$(curl -sS -w $'\n%{http_code}' -X POST "https://dispatch.security.cab/v1/sessions" \
          -H "Authorization: Bearer $oidc_token" \
          -H "Content-Type: application/json" \
          -d "$payload")"
        http_code="${response##*$'\n'}"
        body="${response%$'\n'*}"
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "::error::pm-dispatch-start: pm-dispatch POST /v1/sessions failed (HTTP $http_code):" >&2
          echo "$body" >&2
          exit 1
        fi
        echo "$body"
        task_id="$(printf '%s' "$body" | jq -r '.task_id // empty')"
        session_id="$(printf '%s' "$body" | jq -r '.session_id // empty')"
        issue_number="$(printf '%s' "$body" | jq -r '.issue_number // empty')"
        issue_url=""
        if [ -n "$issue_number" ]; then
          issue_url="https://github.com/${INPUT_REPO}/issues/${issue_number}"
        fi
        {
          echo "task_id=$task_id"
          echo "session_id=$session_id"
          echo "issue_number=$issue_number"
          echo "issue_url=$issue_url"
        } >> "$GITHUB_OUTPUT"
