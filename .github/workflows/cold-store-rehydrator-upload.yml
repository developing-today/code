name: cold-store-rehydrator upload

# Upload an immutable version only. Durable Object Workers do not receive
# Version URLs, so this workflow performs no preview or live endpoint checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-store-rehydrator-cloudflare
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cold-store-rehydrator-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install zstd for local Worker proofs
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.0"

      - name: Run Worker tests
        working-directory: pkgs/cold-store-reaper/worker
        run: |
          npm ci
          npm test

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build the pinned bundle, cf CLI, and deploy app
        run: nix build --impure .#coldStoreRehydrator .#coldStoreRehydratorDeploy --print-build-logs

      - name: Upload immutable Worker version
        id: upload
        env:
          COLD_STORE_REHYDRATOR_CF_API_TOKEN: ${{ secrets.COLD_STORE_REHYDRATOR_CF_API_TOKEN }}
          COLD_STORE_REHYDRATOR_CF_ACCOUNT_ID: ${{ vars.COLD_STORE_REHYDRATOR_CF_ACCOUNT_ID }}
        run: nix run --impure .#coldStoreRehydratorDeploy

      - name: Save the version and serving baseline
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          WORKER_SHA: ${{ steps.upload.outputs.worker_sha }}
          BASELINE_SHA256: ${{ steps.upload.outputs.baseline_sha256 }}
          UPLOAD_RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$WORKER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg version_id "$VERSION_ID" --arg worker_sha "$WORKER_SHA" \
            --arg baseline_sha256 "$BASELINE_SHA256" --arg upload_run_id "$UPLOAD_RUN_ID" \
            '{version_id:$version_id, worker_sha:$worker_sha, baseline_sha256:$baseline_sha256, upload_run_id:$upload_run_id}' \
            > "$RUNNER_TEMP/cold-store-rehydrator-version.json"
          cat "$RUNNER_TEMP/cold-store-rehydrator-version.json" >> "$GITHUB_STEP_SUMMARY"
          echo "This upload changed no traffic. Promotion remains blocked until supported isolated private staging evidence exists." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload version reference artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cold-store-rehydrator-version
          path: ${{ runner.temp }}/cold-store-rehydrator-version.json
          if-no-files-found: error
          retention-days: 30
