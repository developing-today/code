name: Upload private laptop bridge smoke version

on:
  workflow_dispatch:
    inputs:
      init_run_id:
        description: Successful private-laptop-bridge-smoke-init run on this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-laptop-bridge-smoke-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    # Configure required reviewers and main-only rules outside the repository.
    environment: cloudflare-smoke-upload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INIT_RUN_ID: ${{ inputs.init_run_id }}
    steps:
      - name: Validate fixed repository, ref, and init run identifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == developing-today/code ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$INIT_RUN_ID" =~ ^[0-9]{1,20}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: pm-stack/private-laptop-bridge/package-lock.json

      - name: Reject inherited Worker target and mode overrides
        working-directory: pm-stack/private-laptop-bridge
        env:
          CLOUDFLARE_CI_OVERRIDE_WORKER_NAME: ${{ vars.CLOUDFLARE_CI_OVERRIDE_WORKER_NAME }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WRANGLER_WORKER_NAME: ${{ vars.WRANGLER_WORKER_NAME }}
          CF_MODE: ${{ vars.CF_MODE }}
          CLOUDFLARE_ENV: ${{ vars.CLOUDFLARE_ENV }}
          WRANGLER_ENV: ${{ vars.WRANGLER_ENV }}
        run: node smoke-upload.mjs guard-target-env

      - name: Install the exact pinned cf toolchain
        working-directory: pm-stack/private-laptop-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run offline smoke and provenance contracts
        working-directory: pm-stack/private-laptop-bridge
        run: node --test --test-reporter=spec bootstrap-smoke.test.mjs smoke-upload.test.mjs

      - name: Build the fixed disabled smoke artifact
        working-directory: pm-stack/private-laptop-bridge
        env:
          CLOUDFLARE_CI_OVERRIDE_WORKER_NAME: ""
          CF_WORKER_NAME: ""
          CLOUDFLARE_WORKER_NAME: ""
          WRANGLER_WORKER_NAME: ""
          CF_MODE: ""
          CLOUDFLARE_ENV: ""
          WRANGLER_ENV: ""
        run: npx --no-install cf build

      - name: Verify the effective Build Output is the fixed private smoke config
        working-directory: pm-stack/private-laptop-bridge
        run: node smoke-upload.mjs validate-payload .cloudflare/output/v1

      - name: Verify the effective prebuilt payload with cf dry-run
        working-directory: pm-stack/private-laptop-bridge
        env:
          DRY_RUN_OUTPUT: ${{ runner.temp }}/cf-version-dry-run.txt
          CLOUDFLARE_CI_OVERRIDE_WORKER_NAME: ""
          CF_WORKER_NAME: ""
          CLOUDFLARE_WORKER_NAME: ""
          WRANGLER_WORKER_NAME: ""
          CF_MODE: ""
          CLOUDFLARE_ENV: ""
          WRANGLER_ENV: ""
        run: |
          set -euo pipefail
          args=(workers versions create --worker private-laptop-bridge-smoke --tag "$GITHUB_SHA" --message "offline smoke validation" --prebuilt --dry-run)
          npx --no-install cf -q "${args[@]}" 2>&1 | tee "$DRY_RUN_OUTPUT"
          node smoke-upload.mjs dry-run "$DRY_RUN_OUTPUT"

      - name: Download the receipt from the selected init run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: private-laptop-smoke-init-${{ inputs.init_run_id }}
          path: ${{ runner.temp }}/init
          repository: developing-today/code
          run-id: ${{ inputs.init_run_id }}
          github-token: ${{ github.token }}

      - name: Fetch exact init run and attempt evidence
        working-directory: pm-stack/private-laptop-bridge
        env:
          INIT_RECEIPT: ${{ runner.temp }}/init/smoke-init-receipt.json
          INIT_RUN_JSON: ${{ runner.temp }}/init-run.json
          INIT_JOBS_JSON: ${{ runner.temp }}/init-jobs.json
          INIT_COMPAT_JSON: ${{ runner.temp }}/init-compatibility.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node smoke-upload.mjs fetch-init "$INIT_RECEIPT" "$INIT_RUN_JSON" "$INIT_JOBS_JSON" "$INIT_COMPAT_JSON"

      - name: Validate init receipt and trusted workflow provenance
        id: init
        working-directory: pm-stack/private-laptop-bridge
        env:
          INIT_RECEIPT: ${{ runner.temp }}/init/smoke-init-receipt.json
          INIT_RUN_JSON: ${{ runner.temp }}/init-run.json
          INIT_JOBS_JSON: ${{ runner.temp }}/init-jobs.json
          INIT_COMPAT_JSON: ${{ runner.temp }}/init-compatibility.json
          CF_SMOKE_UPLOAD_ACCOUNT_ID: ${{ secrets.CF_SMOKE_UPLOAD_ACCOUNT_ID }}
          CF_SMOKE_UPLOAD_API_TOKEN: ${{ secrets.CF_SMOKE_UPLOAD_API_TOKEN }}
          CF_SMOKE_UPLOAD_READ_TOKEN: ${{ secrets.CF_SMOKE_UPLOAD_READ_TOKEN }}
        run: node smoke-upload.mjs validate-init "$INIT_RECEIPT" "$INIT_RUN_JSON" "$INIT_JOBS_JSON" "$INIT_COMPAT_JSON"

      - name: Verify the initialized smoke target and exposure state read-only
        working-directory: pm-stack/private-laptop-bridge
        env:
          INIT_RECEIPT: ${{ runner.temp }}/init/smoke-init-receipt.json
          INIT_RECEIPT_DIGEST: ${{ steps.init.outputs.receipt_digest }}
          CF_SMOKE_UPLOAD_ACCOUNT_ID: ${{ secrets.CF_SMOKE_UPLOAD_ACCOUNT_ID }}
          CF_SMOKE_UPLOAD_READ_TOKEN: ${{ secrets.CF_SMOKE_UPLOAD_READ_TOKEN }}
          CF_SMOKE_UPLOAD_EXPECTED_ZONE_IDS: ${{ secrets.CF_SMOKE_UPLOAD_EXPECTED_ZONE_IDS }}
        run: node smoke-upload.mjs preflight "$INIT_RECEIPT"

      - name: Upload one immutable version to the fixed smoke Worker
        working-directory: pm-stack/private-laptop-bridge
        env:
          VERSION_RESPONSE: ${{ runner.temp }}/cf-version-response.json
          CF_ACCOUNT_ID: ${{ secrets.CF_SMOKE_UPLOAD_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_SMOKE_UPLOAD_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_SMOKE_UPLOAD_API_TOKEN }}
          CLOUDFLARE_CI_OVERRIDE_WORKER_NAME: ""
          CF_WORKER_NAME: ""
          CLOUDFLARE_WORKER_NAME: ""
          WRANGLER_WORKER_NAME: ""
          CF_MODE: ""
          CLOUDFLARE_ENV: ""
          WRANGLER_ENV: ""
          INIT_RECEIPT_DIGEST: ${{ steps.init.outputs.receipt_digest }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/cf-version-response.json
        run: |
          set -euo pipefail
          rm -f "$VERSION_RESPONSE"
          message="init_receipt_sha256=${INIT_RECEIPT_DIGEST}"
          npx --no-install cf -q workers versions create \
            --worker private-laptop-bridge-smoke \
            --tag "$GITHUB_SHA" \
            --message "$message" \
            --prebuilt
          test -s "$VERSION_RESPONSE"

      - name: Read back exact version and prove no serving state changed
        working-directory: pm-stack/private-laptop-bridge
        env:
          VERSION_RESPONSE: ${{ runner.temp }}/cf-version-response.json
          CF_SMOKE_UPLOAD_ACCOUNT_ID: ${{ secrets.CF_SMOKE_UPLOAD_ACCOUNT_ID }}
          CF_SMOKE_UPLOAD_READ_TOKEN: ${{ secrets.CF_SMOKE_UPLOAD_READ_TOKEN }}
          CF_SMOKE_UPLOAD_EXPECTED_ZONE_IDS: ${{ secrets.CF_SMOKE_UPLOAD_EXPECTED_ZONE_IDS }}
          INIT_WORKER_ID: ${{ steps.init.outputs.worker_id }}
          INIT_RECEIPT_DIGEST: ${{ steps.init.outputs.receipt_digest }}
        run: node smoke-upload.mjs verify-upload "$VERSION_RESPONSE"
