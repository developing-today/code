name: Branch cleanup

"on":
  schedule:
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; delete nothing"
        required: false
        default: true
        type: boolean
      inactive_days:
        description: "Days a branch's newest commit must exceed before it is eligible"
        required: false
        default: 14
        type: number

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: Remove stale merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete stale merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          LIVE_VAR: ${{ vars.BRANCH_CLEANUP_LIVE }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          INACTIVE_DAYS_INPUT: ${{ inputs.inactive_days }}
        run: |
          set -euo pipefail

          # Safety latch: scheduled runs stay in dry-run unless the repo
          # variable BRANCH_CLEANUP_LIVE is set to "true". Manual runs use
          # the dry_run input instead.
          dry_run="true"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$LIVE_VAR" == "true" ]]; then
              dry_run="false"
            fi
          elif [[ "$DRY_RUN_INPUT" == "false" ]]; then
            dry_run="false"
          fi

          inactive_days="${INACTIVE_DAYS_INPUT:-14}"
          max_deletions=50
          cutoff=$(( $(date +%s) - inactive_days * 86400 ))

          if [[ "$dry_run" == "true" ]]; then
            mode="dry-run"
          else
            mode="LIVE"
          fi
          echo "Branch cleanup: mode=$mode inactive_days=$inactive_days default_branch=$DEFAULT_BRANCH"

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

          # Fail the run (before any deletion) if the open-PR list cannot
          # be read: those heads and bases are part of the protected set.
          # Bases are protected because GitHub closes an open PR whose
          # base branch is deleted (stacked PRs, developing-today/openchamber#629).
          gh pr list --state open --limit 1000 --json headRefName,baseRefName --jq ".[].headRefName" > open-pr-heads.txt
          mapfile -t open_pr_heads < open-pr-heads.txt
          rm -f open-pr-heads.txt
          gh pr list --state open --limit 1000 --json headRefName,baseRefName --jq ".[].baseRefName" > open-pr-bases.txt
          mapfile -t open_pr_bases < open-pr-bases.txt
          rm -f open-pr-bases.txt
          # Merged-PR evidence (code#7094): a branch whose PR has merged is
          # a cleanup candidate on the MERGE date, even when its tip is not
          # an ancestor of the default branch (squash/rebase merges leave
          # tips unmerged by SHA) and even when later fleet merges topped
          # its tree up after the merge. Fail closed, exactly like the
          # open-PR read above: no merged list, no deletions.
          # Limit 10000, not 1000: at fleet merge velocity the 1000 most
          # recent merged PRs reach back only ~3 days (measured
          # 2026-11-10), shorter than the inactivity window, so a smaller
          # limit would make the merged evidence unreachable in practice.
          # The full list takes ~15s.
          gh pr list --state merged --limit 10000 --json headRefName,mergedAt --jq ".[] | [.headRefName, .mergedAt] | @tsv" > merged-prs.txt
          declare -A merged_at=()
          while IFS=$'\t' read -r m_branch m_at; do
            [[ -n "$m_branch" && -n "$m_at" ]] || continue
            merged_at["$m_branch"]="$(date -d "$m_at" +%s)"
          done < merged-prs.txt
          rm -f merged-prs.txt

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${open_pr_heads[@]:-}"; do
              if [[ "$head" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }
          is_open_pr_base() {
            local candidate="$1"
            local base
            for base in "${open_pr_bases[@]:-}"; do
              if [[ "$base" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          candidates=()
          while IFS= read -r ref; do
            # Full refname, not %(refname:short): the short name of
            # refs/remotes/origin/HEAD renders as plain "origin", which
            # turned branch into "origin" and killed the scan on
            # git log origin/origin (code#7094).
            branch="${ref#refs/remotes/origin/}"
            if [[ "$branch" == "$DEFAULT_BRANCH" || "$branch" == "HEAD" ]]; then
              continue
            fi
            if is_open_pr_head "$branch"; then
              echo "SKIP open-pr-head: $branch"
              continue
            fi
            if is_open_pr_base "$branch"; then
              echo "SKIP open-pr-base: $branch"
              continue
            fi
            if [[ -n "${merged_at[$branch]:-}" ]]; then
              # PR-verified merged branch: the inactivity clock runs from
              # the merge date, not the newest commit date (code#7094).
              if (( merged_at[$branch] >= cutoff )); then
                echo "SKIP recently-merged: $branch"
                continue
              fi
              candidates+=("$branch")
              continue
            fi
            newest="$(git log -1 --format=%ct "origin/$branch")"
            if (( newest >= cutoff )); then
              echo "SKIP active: $branch"
              continue
            fi
            if git merge-base --is-ancestor "origin/$branch" "origin/$DEFAULT_BRANCH"; then
              candidates+=("$branch")
            else
              echo "SKIP unique-commits: $branch"
            fi
          done < <(git for-each-ref --format="%(refname)" "refs/remotes/origin")

          count="${#candidates[@]}"
          echo "Stale branches solely behind $DEFAULT_BRANCH and inactive for ${inactive_days}d: $count"

          {
            echo "## Branch cleanup ($mode)"
            echo ""
            echo "Default branch: \`$DEFAULT_BRANCH\`; inactivity window: ${inactive_days} days; candidates: $count."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if (( count > max_deletions )); then
            echo "Candidate count $count exceeds the per-run cap of $max_deletions; deleting the first $max_deletions and deferring the rest to the next run."
            echo "Candidate count $count exceeds the per-run cap of $max_deletions; deleting the first $max_deletions, deferring $((count - max_deletions)) to the next run." >> "$GITHUB_STEP_SUMMARY"
            for branch in "${candidates[@]:$max_deletions}"; do
              echo "DEFERRED: $branch"
              echo "- deferred \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            done
            candidates=("${candidates[@]:0:$max_deletions}")
          fi

          deleted=0
          failed=()
          for branch in "${candidates[@]}"; do
            if [[ "$dry_run" == "true" ]]; then
              echo "WOULD-DELETE: $branch"
              echo "- would delete \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            elif git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
              echo "DELETED: $branch"
              echo "- deleted \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            else
              # One failed deletion must not abort the run
              # (developing-today/code#1615; shape ported from the
              # dezren39/nix fix, nix#1004): record it, keep going,
              # and fail visibly at the end.
              failed+=("$branch")
              echo "FAILED: $branch"
              echo "- FAILED to delete \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [[ "$dry_run" != "true" ]]; then
            echo "Deleted: $deleted; failed: ${#failed[@]}." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Branch cleanup finished: $count candidate(s), mode=$mode."

          if (( ${#failed[@]} > 0 )); then
            echo "Branch cleanup: ${#failed[@]} deletion(s) failed: ${failed[*]}"
            exit 1
          fi
