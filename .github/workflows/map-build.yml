name: map build

# CI tier policy: see .github/ci-policy.md

# Build verification for the small pkgs/map Go module (#338).
#
# Nothing built pkgs/map in CI at all, so it rotted silently: its
# charm -> keygen v0.4.2 -> caarlos0/sshmarshal chain stopped compiling
# against golang.org/x/crypto v0.16.0 and nobody noticed. This workflow
# builds and vets the module whenever it changes so that cannot recur.
# (pkgs/graph had the same class of break under #166; it is covered by
# go-modules-build.yml since that fix landed, so it is not added here.)

on:
  pull_request:
    # PR tier (Phase 2, #1781): builds fire on PRs only for class-3
    # changes (lockfiles, module roots, flake files, build definitions,
    # workflow files, shared libs); on push to main they always run.
    paths:
      - "pkgs/map/go.mod"
      - "pkgs/map/go.sum"
      - "pkgs/map/package.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "basic: go build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/map/go.mod
          cache-dependency-path: pkgs/map/go.sum

      - name: Verify go.mod and go.sum are tidy
        working-directory: pkgs/map
        # Every sibling module already has this guard (go-modules-build
        # for #347, mcpx.yml for nix#436, mod-tidy.yml for graph); map and
        # identity were the last two without one, and build/vet pass on
        # an untidy module, so drift here would be silent (#349).
        # Pattern copied from go-modules-build.yml: these modules pin
        # Go 1.21/1.22, whose `go mod tidy` has no -diff flag (added in
        # Go 1.24; mcpx.yml can use it only because mcpx pins Go 1.27),
        # so run tidy and fail if it changed anything.
        run: |
          go mod tidy
          if [[ -n "$(git status --short -- go.mod go.sum)" ]]; then
            echo "go mod tidy changed go.mod or go.sum; commit the tidy changes."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        working-directory: pkgs/map
        run: go build ./...

      - name: Vet
        working-directory: pkgs/map
        run: go vet ./...
