# Keeps the flake's openchamber and opencode inputs current with
# developing-today/openchamber and developing-today/opencode. The openchamber
# input keeps its `inputs.opencode.follows = "opencode"`, so the two pins
# always move together against the same opencode rev.
#
# Daily (and on demand): update only those two inputs, then validate the
# flake by evaluating the outputs that consume them (plus the dev shell the
# repo's own nix-ci evaluates). This repo has no OpenChamber-specific test
# suite, so evaluation is the check — no full test run. If validation passes
# and flake.lock moved, the change lands as a pull request that this
# workflow merges itself. This repository protects main against the
# workflow token, so the merge normally lands through auto-merge (a merge
# commit, enabled repository-wide): the workflow sets it and GitHub merges
# once checks pass. Only if both the direct and the auto-merge attempts
# are refused is the PR commented as validated and left for a privileged
# merge.
#
# Failures are tracked in ONE issue (title in FAILURE_ISSUE_TITLE below):
# the first failure opens it (created by the pm-dispatch starter when the
# failure is dispatched, below), later failures edit it in place (attempt count,
# first/last failure times, one history entry per attempt), and the next
# success closes it — the successful update PR carries a "Fixes #<n>" line,
# and the merge step comments the passing revs before closing. A failed run
# never disables later runs: every scheduled run retries with the newest
# revs, and while a failure issue is open validation runs even when the
# lockfile did not move, so a manual fix is picked up too.
#
# Escalation (Drew, 2026-10-28; migrated to pm-dispatch for #2672):
# every recorded failure is dispatched via pm-dispatch (see the dispatch
# steps below). If no tracking issue is open yet, the pm-dispatch starter
# creates the one tracking issue for this incident and launches an
# OpenCode session to fix it; if a tracking issue is already open, the
# pm-dispatch queuer attaches a fresh fix task to that issue instead of
# creating a second one. Dispatch assigns the work immediately, so there
# is no separate hand-off chain.
name: flake-inputs-update

on:
  schedule:
    # Daily at 07:23 UTC, an hour after openchamber's own opencode-update
    # run, so this picks up the openchamber rev that run just merged.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: flake-inputs-update
  cancel-in-progress: true

env:
  FAILURE_ISSUE_TITLE: "chore(deps): automated openchamber+opencode input update failing"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Find an open failure issue
        id: failure-issue
        run: |
          gh issue list --state open --limit 100 --json number,title > "$RUNNER_TEMP/issues.json"
          number=$(jq -r --arg title "$FAILURE_ISSUE_TITLE" \
            '.[] | select(.title == $title) | .number' "$RUNNER_TEMP/issues.json" | head -n 1)
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -n "${number}" ]; then
            echo "An open failure issue already exists: #${number}"
          else
            echo "No open failure issue."
          fi

      - name: Record the currently pinned revs
        id: before
        run: |
          echo "openchamber_rev=$(jq -r '.nodes.openchamber.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
          echo "opencode_rev=$(jq -r '.nodes.opencode.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"

      - name: Update the openchamber and opencode inputs
        id: update
        continue-on-error: true
        run: |
          set -o pipefail
          nix flake update openchamber opencode 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Plan verification
        id: plan
        run: |
          echo "openchamber_rev=$(jq -r '.nodes.openchamber.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
          echo "opencode_rev=$(jq -r '.nodes.opencode.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Verify when the pins moved, and also while a failure issue is open
          # (a manual fix elsewhere can make the same revs pass again).
          if [ "${{ steps.update.outcome }}" != "success" ]; then
            echo "verify=false" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet -- flake.lock || [ -n "${{ steps.failure-issue.outputs.number }}" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the flake
        id: validate
        if: steps.plan.outputs.verify == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            nix eval .#devShells.x86_64-linux.default.drvPath
            nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.openchamber.packages.x86_64-linux.openchamber.drvPath'
            nix eval --raw --impure --expr 'let f = builtins.getFlake (toString ./.); in f.inputs.opencode.packages.x86_64-linux.opencode.drvPath'
          } 2>&1 | tee "$RUNNER_TEMP/validate.log"

      - name: Decide the outcome
        id: outcome
        if: always()
        run: |
          failed_step=""
          error_log=""
          if [ "${{ steps.update.outcome }}" = "failure" ]; then
            failed_step="nix flake update openchamber opencode"
            error_log="$RUNNER_TEMP/update.log"
          elif [ "${{ steps.plan.outputs.verify }}" = "true" ] && [ "${{ steps.validate.outcome }}" = "failure" ]; then
            failed_step="flake validation (nix eval of the openchamber/opencode outputs)"
            error_log="$RUNNER_TEMP/validate.log"
          fi
          if [ -n "${failed_step}" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "failed_step=${failed_step}" >> "$GITHUB_OUTPUT"
            echo "error_log=${error_log}" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the failure on the tracking issue
        id: record-failure
        if: steps.outcome.outputs.result == 'failure'
        env:
          FAILED_STEP: ${{ steps.outcome.outputs.failed_step }}
          ERROR_LOG: ${{ steps.outcome.outputs.error_log }}
          EXISTING_NUMBER: ${{ steps.failure-issue.outputs.number }}
          NEW_OC_REV: ${{ steps.plan.outputs.openchamber_rev }}
          NEW_OPENCODE_REV: ${{ steps.plan.outputs.opencode_rev }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          attempts=1
          first_failure="${now}"
          history_file="$RUNNER_TEMP/history.md"
          : > "${history_file}"
          if [ -n "${EXISTING_NUMBER}" ]; then
            gh issue view "${EXISTING_NUMBER}" --json body --jq .body > "$RUNNER_TEMP/old-body.md"
            previous=$(grep -E '^Attempts: ' "$RUNNER_TEMP/old-body.md" | head -n 1 | grep -oE '[0-9]+' || true)
            if [ -n "${previous}" ]; then
              attempts=$((previous + 1))
            fi
            previous_first=$(sed -n 's/^First failure: //p' "$RUNNER_TEMP/old-body.md" | head -n 1)
            if [ -n "${previous_first}" ]; then
              first_failure="${previous_first}"
            fi
            awk '/^## Failure history/{found=1; next} found' "$RUNNER_TEMP/old-body.md" > "${history_file}"
          fi
          # Error excerpt: last lines of the failing step's log with nix's
          # "copying path" noise removed, capped, and code fences neutralized
          # so the issue body stays valid Markdown.
          grep -v "copying path" "${ERROR_LOG}" | tail -n 80 | sed 's/~~~/---/g' | tail -c 5000 > "$RUNNER_TEMP/excerpt.txt" || true
          entry_file="$RUNNER_TEMP/entry.md"
          {
            echo "### Attempt ${attempts} — ${now} — openchamber \`${NEW_OC_REV}\`, opencode \`${NEW_OPENCODE_REV}\`"
            echo "- Failed step: ${FAILED_STEP}"
            echo "- Run: ${RUN_URL}"
            echo "- Error excerpt (full log in the run linked above):"
            echo
            echo '~~~'
            cat "$RUNNER_TEMP/excerpt.txt"
            echo
            echo '~~~'
            echo
          } > "${entry_file}"
          # Bound the carried-over history (#947): keep only the newest
          # entries that fit within 10 entries AND 30,000 chars, dropping
          # the oldest first. Without this the body grows ~5,300 chars per
          # failed attempt and passes GitHub's 65,536-char issue-body
          # limit after roughly a dozen attempts, after which
          # `gh issue edit` is rejected and this issue silently freezes.
          # Attempts / First failure above are parsed from the header
          # block, not the history, so trimming cannot corrupt them.
          previously_trimmed=$(sed -n 's/^_\([0-9][0-9]*\) earlier attempt.*/\1/p' "${history_file}" | head -n 1)
          previously_trimmed=${previously_trimmed:-0}
          combined_file="$RUNNER_TEMP/history-combined.md"
          cat "${history_file}" "${entry_file}" > "${combined_file}"
          entries_dir="$RUNNER_TEMP/history-entries"
          mkdir -p "${entries_dir}"
          (cd "${entries_dir}" && csplit -s -f entry- -b '%04d.md' "${combined_file}" '/^### Attempt /' '{*}' || true)
          entry_files=()
          for f in "${entries_dir}"/entry-*.md; do
            [ -f "$f" ] || continue
            if head -n 1 "$f" | grep -q '^### Attempt '; then
              entry_files+=("$f")
            fi
          done
          total_entries=${#entry_files[@]}
          # Select the newest contiguous entries within both bounds; the
          # newest entry is always kept.
          kept_start=$total_entries
          kept_chars=0
          kept_count=0
          i=$((total_entries - 1))
          while [ "$i" -ge 0 ]; do
            entry_size=$(wc -c < "${entry_files[$i]}")
            if [ "$kept_count" -gt 0 ]; then
              if [ $((kept_count + 1)) -gt 10 ]; then break; fi
              if [ $((kept_chars + entry_size)) -gt 30000 ]; then break; fi
            fi
            kept_chars=$((kept_chars + entry_size))
            kept_count=$((kept_count + 1))
            kept_start=$i
            i=$((i - 1))
          done
          trimmed_count=$((previously_trimmed + kept_start))
          header_file="$RUNNER_TEMP/issue-header.md"
          {
            echo "<!-- automated-failure-issue: flake-inputs-update -->"
            echo "Automated openchamber+opencode input updates are currently failing. This issue is maintained by the \`flake-inputs-update\` workflow: one issue per workflow, edited in place on every failed attempt, and closed by the next successful update."
            echo
            echo "Attempts: ${attempts}"
            echo "First failure: ${first_failure}"
            echo "Last failure: ${now}"
            echo "Latest attempted: openchamber \`${NEW_OC_REV}\`, opencode \`${NEW_OPENCODE_REV}\`"
            echo "Latest run: ${RUN_URL}"
            echo
            echo "## Failure history"
          } > "${header_file}"
          body_file="$RUNNER_TEMP/issue-body.md"
          assemble_body() {
            {
              cat "${header_file}"
              if [ "${trimmed_count}" -gt 0 ]; then
                echo "_${trimmed_count} earlier attempt(s) trimmed to keep this issue under GitHub's body limit._"
                echo
              fi
              j=$kept_start
              while [ "$j" -lt "$total_entries" ]; do
                cat "${entry_files[$j]}"
                j=$((j + 1))
              done
            } > "${body_file}"
          }
          assemble_body
          # Final safety net: if the assembled body still exceeds 60,000
          # chars, drop the oldest remaining history entries until it fits
          # (always keeping the newest entry).
          while [ "$(wc -c < "${body_file}")" -gt 60000 ] && [ $((total_entries - kept_start)) -gt 1 ]; do
            kept_start=$((kept_start + 1))
            trimmed_count=$((trimmed_count + 1))
            assemble_body
          done
          echo "attempts=${attempts}" >> "$GITHUB_OUTPUT"
          if [ -n "${EXISTING_NUMBER}" ]; then
            gh issue edit "${EXISTING_NUMBER}" --body-file "${body_file}"
            echo "Updated failure issue #${EXISTING_NUMBER} (attempt ${attempts})."
          else
            # No open tracking issue: do NOT create one here. The
            # pm-dispatch starter step below creates the one tracking
            # issue for this incident (title = FAILURE_ISSUE_TITLE) and
            # launches the fix session. The body assembled above is not
            # lost: $RUNNER_TEMP files persist across steps in this job,
            # and the dispatch-prompt step carries its latest entry into
            # the starter prompt.
            echo "No open failure issue; the pm-dispatch starter will create it (attempt ${attempts})."
          fi
          exit 1

      - name: Prepare the dispatch prompt
        id: dispatch-prompt
        if: always() && steps.outcome.outputs.result == 'failure'
        env:
          EXISTING_NUMBER: ${{ steps.failure-issue.outputs.number }}
          ATTEMPTS: ${{ steps.record-failure.outputs.attempts }}
          FAILED_STEP: ${{ steps.outcome.outputs.failed_step }}
          NEW_OC_REV: ${{ steps.plan.outputs.openchamber_rev }}
          NEW_OPENCODE_REV: ${{ steps.plan.outputs.opencode_rev }}
        run: |
          attempts=${ATTEMPTS:-1}
          if [ -n "${EXISTING_NUMBER}" ]; then
            title="Fix #${EXISTING_NUMBER}: automated update failing"
          else
            title="${FAILURE_ISSUE_TITLE}"
          fi
          prompt_file="$RUNNER_TEMP/dispatch-prompt.md"
          {
            if [ -n "${EXISTING_NUMBER}" ]; then
              printf 'Fix GitHub issue #%s in %s.\n\n' "${EXISTING_NUMBER}" "${{ github.repository }}"
            else
              printf 'Fix the automated dependency-update failure tracked as "%s" in %s.\n\n' "${FAILURE_ISSUE_TITLE}" "${{ github.repository }}"
              echo "pm-dispatch creates the tracking issue for this incident, with that title, as part of this dispatch. The fix pull request must reference that tracking issue with a \"Fixes #<number>\" line (using the number of the issue this dispatch created) so it closes when the fix lands."
              echo
            fi
            echo "The automated dependency-update workflow in this repository is failing (attempt ${attempts}). Failed step: ${FAILED_STEP}. Run: ${RUN_URL}. Attempted revs: openchamber \`${NEW_OC_REV}\`, opencode \`${NEW_OPENCODE_REV}\`."
            echo
            if [ -f "$RUNNER_TEMP/entry.md" ]; then
              echo "Latest failure entry (the tracking issue body carries the full failure history and error excerpts):"
              echo
              cat "$RUNNER_TEMP/entry.md"
            elif [ -f "$RUNNER_TEMP/issue-body.md" ]; then
              echo "Failure context (from the tracking issue body):"
              echo
              cat "$RUNNER_TEMP/issue-body.md"
            fi
            echo
            echo "The workflow file under .github/workflows/ (flake-inputs-update.yml) is where to reproduce it. Diagnose the failure, fix the root cause, and deliver the fix as a pull request whose description contains \"Fixes #<tracking issue number>\", so the tracking issue closes when the fix lands and a later successful update run confirms it. Run the relevant checks before opening the PR. Merge only if you are reasonably certain the PR is correct; otherwise leave it open and state your confidence and what a human should check. If the root cause belongs to a different repository (for example the upstream project this update pulls in), say exactly that on the tracking issue instead of opening a PR here."
          } > "${prompt_file}"
          {
            echo "title=${title}"
            echo "prompt<<PM_DISPATCH_PROMPT_EOF"
            cat "${prompt_file}"
            echo "PM_DISPATCH_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # No open tracking issue: the starter creates the one tracking
      # issue for this incident AND launches the fix session.
      - name: Dispatch the fix via pm-dispatch (new tracking issue)
        id: dispatch-start
        if: always() && steps.outcome.outputs.result == 'failure' && steps.failure-issue.outputs.number == ''
        uses: developing-today/code/.github/actions/pm-dispatch-start@main
        with:
          title: ${{ steps.dispatch-prompt.outputs.title }}
          prompt: ${{ steps.dispatch-prompt.outputs.prompt }}

      # Tracking issue already open: the queuer attaches a fresh fix
      # task to it -- no second issue is created.
      - name: Queue a fresh fix task via pm-dispatch (existing tracking issue)
        id: dispatch-queue
        if: always() && steps.outcome.outputs.result == 'failure' && steps.failure-issue.outputs.number != ''
        uses: developing-today/code/.github/actions/pm-dispatch-queue@main
        with:
          title: ${{ steps.dispatch-prompt.outputs.title }}
          prompt: ${{ steps.dispatch-prompt.outputs.prompt }}
          issue_number: ${{ steps.failure-issue.outputs.number }}

      - name: Publish and merge the update
        if: steps.outcome.outputs.result == 'success' && steps.plan.outputs.changed == 'true'
        env:
          OLD_OC_REV: ${{ steps.before.outputs.openchamber_rev }}
          OLD_OPENCODE_REV: ${{ steps.before.outputs.opencode_rev }}
          NEW_OC_REV: ${{ steps.plan.outputs.openchamber_rev }}
          NEW_OPENCODE_REV: ${{ steps.plan.outputs.opencode_rev }}
          EXISTING_NUMBER: ${{ steps.failure-issue.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_title="chore(deps): update openchamber to ${NEW_OC_REV:0:12} and opencode to ${NEW_OPENCODE_REV:0:12}"
          # Preserve this run's computed lock before any branch switching:
          # the in-place update and the fallback below both restore from it.
          cp flake.lock "$RUNNER_TEMP/new-flake.lock"
          pr_body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated update of the \`openchamber\` and \`opencode\` flake inputs, produced by the \`flake-inputs-update\` workflow. The openchamber input's \`inputs.opencode.follows = \"opencode\"\` is unchanged, so OpenChamber is evaluated against this same opencode pin."
            echo
            echo "- openchamber: \`${OLD_OC_REV}\` → \`${NEW_OC_REV}\`"
            echo "- opencode: \`${OLD_OPENCODE_REV}\` → \`${NEW_OPENCODE_REV}\`"
            echo "- Validation in this run: the flake evaluates, including the openchamber and opencode package outputs and the default dev shell. This repo has no OpenChamber-specific test suite, so no tests were run."
            echo "- Run: ${RUN_URL}"
            if [ -n "${EXISTING_NUMBER}" ]; then
              echo
              echo "Fixes #${EXISTING_NUMBER}"
            fi
          } > "${pr_body}"
          # #946: an automation update PR left open (e.g. a validated
          # handoff PR waiting for a privileged merge) must be superseded
          # IN PLACE, never stacked with a second PR for newer pins.
          existing_number=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/flake-inputs-update-"))] | .[0].number // empty')
          pr_number=""
          pr_url=""
          if [ -n "${existing_number}" ]; then
            existing_branch=$(gh pr view "${existing_number}" --json headRefName --jq .headRefName)
            existing_title=$(gh pr view "${existing_number}" --json title --jq .title)
            existing_url=$(gh pr view "${existing_number}" --json url --jq .url)
            if [ "${existing_title}" = "${pr_title}" ]; then
              # Same revs: the open PR already carries exactly this
              # update, so publishing again would only duplicate it.
              echo "Open automation PR #${existing_number} already carries these exact revs (${pr_title}); reusing it and skipping publish."
              pr_number="${existing_number}"
              pr_url="${existing_url}"
            elif git fetch origin "${existing_branch}" \
              && git checkout -f -B "${existing_branch}" "origin/${existing_branch}" \
              && cp "$RUNNER_TEMP/new-flake.lock" flake.lock \
              && git add flake.lock \
              && git commit -m "${pr_title}" \
              && git push origin "${existing_branch}" \
              && gh pr edit "${existing_number}" --title "${pr_title}" --body-file "${pr_body}"; then
              echo "Updated open automation PR #${existing_number} in place on branch ${existing_branch} with the new pins."
              pr_number="${existing_number}"
              pr_url="${existing_url}"
            else
              # In-place update is impossible (e.g. the branch was
              # deleted): close the stale PR naming its replacement
              # BEFORE creating the replacement, so two open automation
              # update PRs never linger at once.
              echo "::warning::In-place update of PR #${existing_number} failed; closing it and publishing a replacement."
              branch="automation/flake-inputs-update-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
              gh pr comment "${existing_number}" --body "Superseded by a replacement update PR from this \`flake-inputs-update\` run (${RUN_URL}) on branch \`${branch}\`: this PR's pins are stale and its branch could not be updated in place, so it is being closed to avoid stacked duplicate update PRs (#946)."
              gh pr close "${existing_number}"
              git checkout -f main
              cp "$RUNNER_TEMP/new-flake.lock" flake.lock
            fi
          fi
          if [ -z "${pr_number}" ]; then
            branch="automation/flake-inputs-update-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
            git checkout -b "${branch}"
            git add flake.lock
            git commit -m "${pr_title}"
            git push origin "${branch}"
            pr_url=$(gh pr create --base main --head "${branch}" \
              --title "${pr_title}" \
              --body-file "${pr_body}")
            pr_number="${pr_url##*/}"
            echo "Opened PR #${pr_number}: ${pr_url}"
          fi
          merged="false"
          handoff="false"
          if merge_out=$(gh pr merge "${pr_number}" --merge 2>&1); then
            merged="true"
            echo "PR #${pr_number} merged directly."
          elif auto_out=$(gh pr merge "${pr_number}" --auto --merge 2>&1); then
            echo "Direct merge was refused; auto-merge enabled for PR #${pr_number}."
          else
            # This repository protects main against the workflow token, and
            # both the direct merge and the auto-merge attempt were refused,
            # so a validated update PR waits for a privileged merge here.
            # Hand it over visibly instead of failing the run: the
            # update itself succeeded. Any other publish error still fails.
            echo "${merge_out}"
            echo "${auto_out}"
            if echo "${merge_out}${auto_out}" | grep -qiE "not authorized|not allowed|protected|permission"; then
              handoff="true"
              gh pr comment "${pr_number}" --body "Validated by the \`flake-inputs-update\` workflow (run: ${RUN_URL}): the flake evaluates with these pins, including the openchamber and opencode package outputs. The workflow's token cannot merge into protected \`main\` and the auto-merge attempt was also refused, so this PR is ready for a privileged merge."
              echo "::warning::PR #${pr_number} is validated and ready, but the workflow token cannot merge it (protected main; direct and auto-merge refused). Left open for a privileged merge."
            else
              exit 1
            fi
          fi
          if [ -n "${EXISTING_NUMBER}" ]; then
            if [ "${merged}" = "true" ]; then
              merge_commit=$(gh pr view "${pr_number}" --json mergeCommit --jq .mergeCommit.oid)
              state=$(gh issue view "${EXISTING_NUMBER}" --json state --jq .state)
              if [ "${state}" = "OPEN" ]; then
                gh issue comment "${EXISTING_NUMBER}" --body "Resolved: openchamber \`${NEW_OC_REV}\` and opencode \`${NEW_OPENCODE_REV}\` validate against this flake. Merged in #${pr_number} (merge commit \`${merge_commit}\`). Run: ${RUN_URL}"
                gh issue close "${EXISTING_NUMBER}" --reason completed
              fi
              echo "Failure issue #${EXISTING_NUMBER} closed."
            elif [ "${handoff}" = "true" ]; then
              gh issue comment "${EXISTING_NUMBER}" --body "Fixed by PR #${pr_number}: openchamber \`${NEW_OC_REV}\` and opencode \`${NEW_OPENCODE_REV}\` validate against this flake (run: ${RUN_URL}). The workflow token cannot merge into protected \`main\`, so the PR is waiting for a privileged merge; its \`Fixes #${EXISTING_NUMBER}\` line closes this issue when it lands."
              echo "Failure issue #${EXISTING_NUMBER} will close when PR #${pr_number} merges."
            else
              gh issue comment "${EXISTING_NUMBER}" --body "Fixed by PR #${pr_number}: openchamber \`${NEW_OC_REV}\` and opencode \`${NEW_OPENCODE_REV}\` validate against this flake (run: ${RUN_URL}). The PR carries a \`Fixes #${EXISTING_NUMBER}\` line and is set to auto-merge; this issue closes when it lands."
              echo "Failure issue #${EXISTING_NUMBER} will close when PR #${pr_number} merges."
            fi
          fi

      - name: Close the failure issue (pins already current)
        if: steps.outcome.outputs.result == 'success' && steps.plan.outputs.changed == 'false' && steps.failure-issue.outputs.number != ''
        env:
          EXISTING_NUMBER: ${{ steps.failure-issue.outputs.number }}
          NEW_OC_REV: ${{ steps.plan.outputs.openchamber_rev }}
          NEW_OPENCODE_REV: ${{ steps.plan.outputs.opencode_rev }}
        run: |
          gh issue comment "${EXISTING_NUMBER}" --body "Resolved without a new PR: main already pins openchamber \`${NEW_OC_REV}\` and opencode \`${NEW_OPENCODE_REV}\`, and this run verified the flake evaluates with them, including the openchamber and opencode package outputs. Run: ${RUN_URL}"
          gh issue close "${EXISTING_NUMBER}" --reason completed
          echo "Failure issue #${EXISTING_NUMBER} closed."
