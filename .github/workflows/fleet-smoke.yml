name: fleet-smoke

# CI tier policy: see .github/ci-policy.md
#
# Runs the pkgs/fleet per-variant smoke suite (#6400; test-suite
# registry row fleet.smoke). pkgs/fleet/smoke.sh is the only
# end-to-end check of the fleet variant contract — capability
# narrowing per variant, exit-69 stub wording, the config-disabled
# path, the D7 size gate, and the proxy domain end to end — and
# before this workflow it ran in no CI venue: the README invoked it
# by hand, so a variant-surface regression could merge unrun.
#
# The suite needs built artifacts, so this venue builds the four
# root flake outputs (fleet, fleet-serve, fleet-connect,
# fleet-connect-static) with Nix and runs the suite against them.
# The run step asserts the suite's own summary line reports
# "0 failed", so a silently skipped suite cannot report green.

on:
  push:
    branches: [main]
    paths:
      - "pkgs/fleet/**"
      # fleet-search builds atlas-search crates by path, so an atlas
      # manifest change can break the fleet lock and build (#10363).
      - "pkgs/atlas-search/Cargo.toml"
      - "pkgs/atlas-search/crates/**"
      - ".github/workflows/fleet-smoke.yml"
      - ".github/scripts/check-fleet-smoke.sh"
      - ".github/scripts/check-fleet-smoke.test.sh"
      - ".github/scripts/check-fleet-lock.sh"
      - ".github/scripts/check-fleet-lock.test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push-to-main runs are keyed by run_id so every merged tree gets
  # its own completed run (the scripts-test/nix-ci contract); manual
  # dispatch runs share a per-ref group so a new dispatch supersedes
  # the stale one. (Main-only CI policy: no PR runs exist.)
  group: fleet-smoke-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  fleet-smoke:
    name: "basic: fleet per-variant smoke suite"
    runs-on: ubuntu-latest
    # A cold Nix cache compiles onnxruntime from source (#12247), which
    # alone runs past an hour on a hosted runner; warm runs take ~40m.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Contract — wiring matches registry and policy (#6400)
        run: |
          bash .github/scripts/check-fleet-smoke.sh
          bash .github/scripts/check-fleet-smoke.test.sh

      # Before the nix build, so a stale lock fails here by name
      # instead of as "no matching package" deep in fleet-0.1.0.drv.
      - name: Fleet Cargo.lock matches the atlas manifests (#10363)
        run: |
          bash .github/scripts/check-fleet-lock.test.sh
          bash .github/scripts/check-fleet-lock.sh

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          # FlakeHub Cache off (#2120): no id-token is granted and the
          # developing-today org is not registered, so the action's
          # opportunistic FlakeHub enable hard-failed jobs on an auth
          # error. The GitHub Actions cache is the cache.
          use-flakehub: false
          use-gha-cache: true

      - name: Build the four fleet variant outputs
        id: build
        run: |
          # Bounded retry (#14859): a GitHub Actions cache rate limit
          # disables the magic-nix-cache substituter mid-build, and
          # that attempt falls back to source builds. A fresh attempt
          # re-queries the substituter once the short rate-limit
          # window passes and reuses whatever the failed attempt
          # already fetched or built into the local store. Three
          # attempts bound the cost of a genuinely broken build.
          outs=()
          for attempt in 1 2 3; do
            mapfile -t outs < <(nix build --no-link --print-out-paths \
              .#fleet .#fleet-serve .#fleet-connect .#fleet-connect-static)
            if [ "${#outs[@]}" -eq 4 ]; then
              break
            fi
            echo "::warning::build attempt ${attempt}: got ${#outs[@]} of 4 variant outputs"
            outs=()
            if [ "${attempt}" -lt 3 ]; then
              sleep 60
            fi
          done
          if [ "${#outs[@]}" -ne 4 ]; then
            echo "::error::expected 4 variant outputs, got ${#outs[@]}"
            exit 1
          fi
          {
            echo "fleet=${outs[0]}"
            echo "fleet_serve=${outs[1]}"
            echo "fleet_connect=${outs[2]}"
            echo "fleet_connect_static=${outs[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the per-variant smoke suite
        run: |
          set -o pipefail
          bash pkgs/fleet/smoke.sh \
            "${{ steps.build.outputs.fleet }}" \
            "${{ steps.build.outputs.fleet_serve }}" \
            "${{ steps.build.outputs.fleet_connect }}" \
            "${{ steps.build.outputs.fleet_connect_static }}" \
            | tee smoke.log
          grep -qE '^smoke: [1-9][0-9]* passed, 0 failed$' smoke.log
