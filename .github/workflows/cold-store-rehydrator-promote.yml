name: cold-store-rehydrator promote

# Production promotion is a separate, explicit action. It can consume only
# a successful main-branch upload run that passed the staged preview checks.
on:
  workflow_dispatch:
    inputs:
      upload_run_id:
        description: "Successful cold-store-rehydrator-upload run ID"
        required: true
        type: string
      staged_parity_reviewed:
        description: "Confirm the upload run's staged preview was reviewed"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read
  actions: read

concurrency:
  group: cold-store-rehydrator-cloudflare
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cold-store-rehydrator-production
    steps:
      - name: Require explicit staged review
        env:
          REVIEWED: ${{ inputs.staged_parity_reviewed }}
        run: test "$REVIEWED" = yes

      - name: Validate the upload run
        id: upload-run
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
        run: |
          [[ "$UPLOAD_RUN_ID" =~ ^[0-9]+$ ]]
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$UPLOAD_RUN_ID" \
            > "$RUNNER_TEMP/upload-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .event == "workflow_dispatch" and .head_branch == "main" and
            .head_repository.full_name == $repo and
            (.path | endswith(".github/workflows/cold-store-rehydrator-upload.yml"))
          ' "$RUNNER_TEMP/upload-run.json" > /dev/null
          echo "head_sha=$(jq -r .head_sha "$RUNNER_TEMP/upload-run.json")" >> "$GITHUB_OUTPUT"

      - name: Download the staged version reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cold-store-rehydrator-version
          run-id: ${{ inputs.upload_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cold-store-rehydrator-version

      - name: Validate the staged version reference
        id: version
        env:
          UPLOAD_SHA: ${{ steps.upload-run.outputs.head_sha }}
        run: |
          reference="$RUNNER_TEMP/cold-store-rehydrator-version/cold-store-rehydrator-version.json"
          jq -e --arg sha "$UPLOAD_SHA" '
            .worker_sha == $sha and
            (.version_id | test("^[0-9a-fA-F-]{36}$")) and
            (.preview_url | test("^https://ci-[0-9a-f]+-cold-store-rehydrator\\.developing-today\\.workers\\.dev$"))
          ' "$reference" > /dev/null
          echo "version_id=$(jq -r .version_id "$reference")" >> "$GITHUB_OUTPUT"
          echo "worker_sha=$UPLOAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build the pinned cf CLI and deploy app
        run: nix build --impure .#coldStoreRehydratorDeploy --print-build-logs

      - name: Promote the staged version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.version.outputs.version_id }}
          WORKER_SHA: ${{ steps.version.outputs.worker_sha }}
        run: |
          nix run --impure .#coldStoreRehydratorDeploy -- --deploy-version "$VERSION_ID"
          echo "Promoted version ${VERSION_ID}; staged source ${WORKER_SHA}." >> "$GITHUB_STEP_SUMMARY"
