# CI for pkgs/id — P2P file sharing CLI
#
# Runs on push to main and PRs that touch pkgs/id/ files.
# Uses nix flake checks to run all sandboxed CI checks:
#   - Rust: fmt, clippy, cargo-check, unit tests, integration tests, doc
#   - Web: biome fmt, biome lint, bun unit tests, TypeScript typecheck
#   - Build: debug + release (web variant with embedded assets)
#   - NixOS VM: serve integration tests, E2E browser tests (require KVM)
#
# All checks run in the nix sandbox — no ambient tool installation needed.
# See pkgs/id/flake.nix checks section for the full list.
#
# Shape (2026-10, #292): this gate used to run the FULL flake check on every
# PR and averaged ~116 minutes — most of it the Playwright browser E2E and
# NixOS VM checks. Those now live in id-e2e-nightly.yml (nightly + manual).
# This workflow builds the fast checks explicitly: unit + integration tests,
# lint, format and type checks. The nix store is cached between runs
# (magic-nix-cache) so unchanged derivations are not rebuilt from cold.
#
# Shape (2026-10, #869): the fast checks used to run as ONE job building all
# 22 derivations serially — ~51 minutes when it passed, and cancelled at the
# 60-minute job cap roughly as often. They now run as a matrix: one parallel
# job per check from .github/scripts/id-pr-checks.txt, so wall time is the
# slowest single check plus setup, not the sum. A lightweight guard job runs
# the flake-drift guard once and emits the matrix; the `check` job below
# aggregates the matrix result and keeps the historical required status
# name "nix flake check". The integration suite itself is sharded too:
# the old `test`/`test-web` checks each re-ran the whole cargo suite in
# one derivation (~25 minutes); test-shard-0/1/2/3 split its targets
# four ways (see the justfile's test-shard-sandbox) and, with test-unit
# and the web checks, cover the same tests by composition.
#
# Shape (2026-10, #551): crash-gate was the slowest single PR check
# (~15 min) because it ran every heavy crash sweep serially in one
# derivation. It is now split by test-name filter into four parallel
# checks (crash-gate-sampled/-sweep/-control/-ingest in
# id-pr-checks.txt); the aggregate still runs nightly via the full
# flake check.

name: id

# CI tier policy: see .github/ci-policy.md

on:
  push:
    branches: [main]
    paths:
      - "pkgs/id/**"
      - ".github/workflows/id-check.yml"
      - ".github/scripts/id-pr-checks.txt"
      - ".github/scripts/check-id-pr-checks.sh"
      - ".github/scripts/check-crash-gate-coverage.sh"
  pull_request:
    paths:
      - "pkgs/id/**"
      - ".github/workflows/id-check.yml"
      - ".github/scripts/id-pr-checks.txt"
      - ".github/scripts/check-id-pr-checks.sh"
      - ".github/scripts/check-crash-gate-coverage.sh"
  schedule:
    # Nightly backstop for the full flake check (main tier, #1781).
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the flake-drift guard once and emits the PR check list as a
  # JSON array for the matrix. The list file stays the single source of
  # truth: adding a check to id-pr-checks.txt adds a parallel job.
  guard:
    name: guard PR check list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      # The PR list is enumerated, so guard it against the flake (#300):
      # a new flake check that is neither listed nor excluded fails here
      # by name instead of silently getting no PR coverage.
      - name: Guard PR check list against flake drift
        run: .github/scripts/check-id-pr-checks.sh

      # The crash-gate composition asserted in check-id-pr-checks.sh is
      # itself checked (#1635): an #[ignore]d crash test matching none
      # of the PR split filters fails here by name.
      - name: Guard crash-gate PR partition coverage
        run: .github/scripts/check-crash-gate-coverage.sh

      - name: Emit PR check list for the matrix
        id: list
        run: |
          checks=$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' .github/scripts/id-pr-checks.txt | jq -R . | jq -cs .)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "PR checks: $checks"

  # One parallel job per PR check. Fast PR set: unit + integration
  # tests, lint, format, typecheck, doc and the crash gates, listed in
  # id-pr-checks.txt. The heavy remainder — test-e2e (Playwright),
  # nixos-serve, nixos-e2e, nixos-integration and nixos-playwright-e2e —
  # runs nightly in id-e2e-nightly.yml, which also runs the full
  # `nix flake check` as a safety net. The aggregate `default` check is
  # intentionally not listed: it re-runs this same set inside a single
  # derivation. check-id-pr-checks.sh holds the exclusion list and keeps
  # this list in sync with pkgs/id/flake.nix.
  check_each:
    name: nix flake check (${{ matrix.check }})
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.guard.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      # Cache the nix store on GitHub's cache so PRs do not rebuild
      # unchanged derivations from a cold store every run (#288).
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Enable KVM for NixOS VM integration tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run PR check
        run: nix build -L --no-link "./pkgs/id#checks.x86_64-linux.${{ matrix.check }}"

  # Aggregator: preserves the historical required status context
  # "nix flake check" so branch protection keeps working unchanged,
  # while the matrix above does the real work in parallel.
  check:
    name: nix flake check
    needs: check_each
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every PR check job to succeed
        run: |
          result="${{ needs.check_each.result }}"
          echo "matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::one or more PR check jobs did not succeed (result: $result) — see the per-check jobs above."
            exit 1
          fi

  # Main tier (Phase 2, #1781): the FULL flake check for pkgs/id. The PR
  # tier above keeps guard + the affected-crate matrix from
  # id-pr-checks.txt; the full check (including the heavy checks the PR
  # list excludes) runs once per merge on main, plus the nightly
  # schedule above -- and nightly in id-e2e-nightly.yml as a second
  # backstop. Nothing from the old PR matrix is lost: the union of this
  # job, id-e2e-nightly, and the PR matrix covers it.
  full-flake-check:
    name: nix flake check (full, main tier)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run full nix flake check
        run: nix flake check ./pkgs/id/ -L --keep-going
