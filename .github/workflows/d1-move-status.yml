name: d1-move status (temporary)

# Read-only look at the D1 copies during the Turso -> D1 move, run from
# GitHub's network while the laptop is unreachable. Removed before merge.

on:
  push:
    branches: [claude/project-thread-72zesl]
    paths: [.github/workflows/d1-move-status.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: fleet-queue
        run: |
          npx -y wrangler@4 d1 execute fleet-queue --remote --json --command "SELECT (SELECT seq FROM sqlite_sequence WHERE name='events') AS seq, (SELECT max(id) FROM events) AS max_event, (SELECT count(*) FROM events WHERE id > 430000) AS post_cutover_events, (SELECT max(created_at) FROM events) AS last_event_at, (SELECT max(id) FROM events WHERE id < 430000) AS max_pre, (SELECT count(*) FROM tasks) AS tasks" || true
          npx -y wrangler@4 d1 execute fleet-queue --remote --json --command "SELECT kind, count(*) n, max(created_at) last FROM events WHERE id > 430000 GROUP BY kind ORDER BY n DESC LIMIT 12" || true
      - name: fleet-platform
        run: |
          npx -y wrangler@4 d1 execute fleet-platform --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" | head -c 3000 || true
          npx -y wrangler@4 d1 execute fleet-platform --remote --json --command "SELECT * FROM _fleet_queue_backup_meta" | head -c 4000 || true
      - name: fleet-dispatch-jobs
        run: npx -y wrangler@4 d1 execute fleet-dispatch-jobs --remote --json --command "SELECT count(*) n, max(updated_at) last FROM jobs" || true
