name: fleet-rust-tests

# CI tier policy: see .github/ci-policy.md
#
# Runs the pkgs/fleet Rust workspace unit and integration tests
# (#8941; test-suite registry row fleet.rust). Before this workflow
# the workspace's tests ran in no CI venue, so regressions in the
# queue, dispatch, proxy, config, and registry crates could merge
# without their Rust tests running — the #8941 baseline run on main
# found exactly that (a stale dep-wiring oracle and a parallel-spawn
# flake in fleet-queue, both fixed in the same PR).
#
# No `cargo fmt --check` step: formatting is not a merge gate
# (auto-fixed on main by auto-format.yml), so this basic-tier job
# runs tests only. #6400's per-variant smoke suite
# (pkgs/fleet/smoke.sh) is a separate venue and is NOT part of
# this job.

on:
  push:
    branches: [main]
    paths:
      - "pkgs/fleet/**"
      - ".github/workflows/fleet-rust-tests.yml"
      - ".github/scripts/check-fleet-rust-tests.sh"
      - ".github/scripts/check-fleet-rust-tests.test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push-to-main runs are keyed by run_id so every merged tree gets
  # its own completed run (the scripts-test/nix-ci contract); manual
  # dispatch runs share a per-ref group so a new dispatch supersedes
  # the stale one. (Main-only CI policy: no PR runs exist.)
  group: fleet-rust-tests-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  fleet-rust-tests:
    name: "basic: fleet Rust workspace tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Contract — wiring matches registry, policy, and toolchain pin (#8941)
        run: |
          bash .github/scripts/check-fleet-rust-tests.sh
          bash .github/scripts/check-fleet-rust-tests.test.sh

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Test the fleet Rust workspace
        run: cargo +1.99.1 test --manifest-path pkgs/fleet/Cargo.toml --workspace --all-targets --locked
