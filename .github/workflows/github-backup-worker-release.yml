name: github-backup Worker release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Upload an inactive version, or promote one exact uploaded version
        required: true
        type: choice
        options:
          - upload
          - promote
      version_id:
        description: Required for promote; the full UUID printed by an earlier upload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-backup-worker-release
  cancel-in-progress: false

jobs:
  request-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Restrict releases to main and validate the requested operation
        env:
          GH_REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          if [[ "$GH_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main (got $GH_REF)." >&2
            exit 1
          fi
          case "$OPERATION" in
            upload)
              if [[ -n "$VERSION_ID" ]]; then
                echo "Leave version_id blank for an upload." >&2
                exit 1
              fi
              ;;
            promote)
              if [[ ! "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
                echo "Promotion requires the full UUID printed by an earlier upload." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown operation: $OPERATION" >&2
              exit 1
              ;;
          esac

  upload:
    needs: request-check
    if: inputs.operation == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: developing-today-backup-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: infra/github-backup/worker/package-lock.json
      - name: Install the pinned cf and Wrangler toolchain
        working-directory: infra/github-backup/worker
        run: npm ci --no-audit --no-fund
      - name: Check pinned toolchain versions
        working-directory: infra/github-backup/worker
        env:
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          test "$(./node_modules/.bin/cf --version)" = "1.0.0-rc.1"
          test "$(./node_modules/.bin/wrangler --version)" = "4.163.0"
      - name: Upload a version without changing traffic
        working-directory: infra/github-backup/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_WORKER_BEARER: ${{ secrets.BACKUP_WORKER_BEARER }}
          BACKUP_WEBHOOK_SECRET: ${{ secrets.BACKUP_WEBHOOK_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BACKUP_WORKER_BEARER"
          test -n "$BACKUP_WEBHOOK_SECRET"
          secret_file="$RUNNER_TEMP/backup-worker-secrets.json"
          response_file="$RUNNER_TEMP/backup-worker-version.json"
          trap 'rm -f "$secret_file" "$response_file"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const values = {
              DRAIN_BEARER: process.env.BACKUP_WORKER_BEARER,
              GITHUB_WEBHOOK_SECRET: process.env.BACKUP_WEBHOOK_SECRET,
            };
            writeFileSync(process.argv[1], JSON.stringify(values), { mode: 0o600 });
          ' "$secret_file"
          tag="gha-${GITHUB_SHA:0:12}"
          cf --quiet workers versions create \
            --worker developing-today-backup \
            --tag "$tag" \
            --message "GHA upload $GITHUB_SHA" \
            --secrets-file "$secret_file" > "$response_file"
          version_id=$(node release-version.mjs upload-result "$response_file")
          echo "Uploaded inactive version: $version_id" >> "$GITHUB_STEP_SUMMARY"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

  promote:
    needs: request-check
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: developing-today-backup-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: infra/github-backup/worker/package-lock.json
      - name: Install the pinned cf and Wrangler toolchain
        working-directory: infra/github-backup/worker
        run: npm ci --no-audit --no-fund
      - name: Check pinned toolchain versions
        working-directory: infra/github-backup/worker
        env:
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          test "$(./node_modules/.bin/cf --version)" = "1.0.0-rc.1"
          test "$(./node_modules/.bin/wrangler --version)" = "4.163.0"
      - name: Verify the exact version and promote it at 100 percent
        working-directory: infra/github-backup/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
          WRANGLER_WRITE_LOGS: "false"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          version_file="$RUNNER_TEMP/backup-worker-version.json"
          deployment_file="$RUNNER_TEMP/backup-worker-deployments.json"
          trap 'rm -f "$version_file" "$deployment_file"' EXIT
          cf --quiet workers versions get "$VERSION_ID" --worker developing-today-backup > "$version_file"
          node release-version.mjs verify-version "$version_file" "$VERSION_ID"
          versions=$(node --input-type=module -e '
            process.stdout.write(JSON.stringify([
              { version_id: process.env.VERSION_ID, percentage: 100 },
            ]));
          ')
          cf --quiet workers deployments create \
            --worker developing-today-backup \
            --strategy percentage \
            --versions "$versions"
          cf --quiet workers deployments list --worker developing-today-backup > "$deployment_file"
          node release-version.mjs verify-deployment "$deployment_file" "$VERSION_ID"
          health=$(curl --fail --silent --show-error --max-time 15 \
            https://developing-today-backup.developing-today.workers.dev/health)
          if [[ "$health" != "ok" ]]; then
            echo "Worker health endpoint returned an unexpected body after promotion." >&2
            exit 1
          fi
          echo "Health check passed for the promoted version." >> "$GITHUB_STEP_SUMMARY"
