name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize]
concurrency:
  # Keyed by the target, not github.ref: for issues and pull_request_target
  # events github.ref is always the default/base branch, so a ref-keyed group
  # is one repo-wide group and a burst of opened events silently replaces the
  # pending run (queue: single is the default), dropping its assignment (#302).
  # The group below is per-target, so cancel-in-progress only ever supersedes
  # a stale run for the SAME issue/PR; the assignment is idempotent and the
  # newest event wins (Phase 1, #1780). CI tier policy: see .github/ci-policy.md
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign to maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [[ "$GH_EVENT_NAME" == "pull_request_target" ]]; then
            gh pr edit "$GH_ISSUE_NUMBER" --add-assignee dezren39 --repo "$GH_REPO"
          else
            gh issue edit "$GH_ISSUE_NUMBER" --add-assignee dezren39 --repo "$GH_REPO"
          fi
