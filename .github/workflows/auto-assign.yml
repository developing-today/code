name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign to maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            gh pr edit "$GH_ISSUE_NUMBER" --add-assignee dezren39 --repo "$GH_REPO"
          else
            gh issue edit "$GH_ISSUE_NUMBER" --add-assignee dezren39 --repo "$GH_REPO"
          fi
