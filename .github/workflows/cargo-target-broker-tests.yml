name: cargo-target-broker-tests

# Test verification for infra/cargo-target-broker (#11417).
#
# The broker evicts whole cargo target dirs to hold the pool under its
# size cap. Its eviction accounting (a failed removal must keep the row
# and its bytes) is pinned by infra/cargo-target-broker/tests/. The
# suite is stdlib unittest against the real bin/cargo_target_broker.py:
# no network, no credentials, no external CLIs.

on:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: "python: cargo-target-broker suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assert the suite file exists
        run: test -f infra/cargo-target-broker/tests/test_cargo_target_broker.py

      - name: Run the cargo-target-broker suite
        run: python3 -m unittest discover -s infra/cargo-target-broker/tests -v
