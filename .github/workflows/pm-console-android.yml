name: pm-console android

# CI tier policy: see .github/ci-policy.md. This is a release, not CI,
# so it keeps a push trigger (restricted to main, and to the app's own
# files).
#
# Builds the PM console's Android app (pm-stack/console/android): a
# Trusted Web Activity over https://pm.security.cab, plus what only an
# installed app has. It runs on every push to main that touches the app,
# and by hand. Every build ends up signed and released with nobody
# involved; where the signing happens depends on where the key is.
#
# The version is the commit's (build.sh): a code that rises with the
# commit's time, so each build installs over the one before.
#
# The key is not here (how it starts): the build is unsigned and kept as
# the artifact pm-console-apk-unsigned, with the version it carries. The
# machine that holds the key looks for it every ten minutes
# (pm-console-android-release.timer, android/release-built.sh), signs it
# there, checks it against the certificate the site lists
# (signing-fingerprint.txt) and releases it. The key never leaves that
# machine.
#
# The key is here: as two secrets of the pm-console-android environment,
# PM_CONSOLE_ANDROID_KEYSTORE_B64 and PM_CONSOLE_ANDROID_KEYSTORE_PASSWORD
# (an environment, not the repository, so that it can be limited to runs
# on main). Then the APK is signed and released by this run, and the
# other machine finds nothing to do. Putting the key here is the
# owner's choice and the owner's to do; no script or agent holds or
# moves it (pm-stack/console/android/README.md).
#
# Either way it is released twice: as pm-console-android-v<code>, which
# is never changed again, and as pm-console-android, whose address stays
# the same and always holds the newest build. The site hands out the
# second.
on:
  push:
    branches: [main]
    paths:
      - "pm-stack/console/android/**"
      - ".github/workflows/pm-console-android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time, in order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: "build the APK, and sign and release it when the key is here"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pm-console-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build, and sign when this environment holds the key
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.PM_CONSOLE_ANDROID_KEYSTORE_B64 }}
          PM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PM_CONSOLE_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bash pm-stack/console/android/build.sh
          out=pm-stack/console/android/app/build/outputs/apk/release
          {
            echo "version_name=$(sed -n 1p "$out/version")"
            echo "version_code=$(sed -n 2p "$out/version")"
          } >>"$GITHUB_OUTPUT"
          if [ -f "$out/pm-console.apk" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Built unsigned: the signing key is not here. The machine that holds it signs and releases this build within about ten minutes (pm-console-android-release.timer)."
            echo "Built $(sed -n 1p "$out/version") unsigned: the signing key is not here. The machine that holds it signs and releases this build within about ten minutes; it will appear at https://github.com/$GITHUB_REPOSITORY/releases/tag/pm-console-android" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.signed == 'true' && 'pm-console-apk' || 'pm-console-apk-unsigned' }}
          # The version goes with the build: whoever signs it releases
          # it under the version it was built as.
          path: |
            pm-stack/console/android/app/build/outputs/apk/release/*.apk
            pm-stack/console/android/app/build/outputs/apk/release/version
          if-no-files-found: error
      - name: Release
        if: steps.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: bash pm-stack/console/android/release.sh pm-stack/console/android/app/build/outputs/apk/release/pm-console.apk
