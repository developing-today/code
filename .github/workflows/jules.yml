name: Jules

# google-labs-code/jules-action -- fires Jules (Google's async coding agent) from
# any GitHub event. All three of upstream's shipped example triggers are wired
# up here; each is independently disable-able by deleting its job.
#
# Requires repository secret JULES_API_KEY. Mint at
# https://jules.google.com/settings (max 3 keys per account), then:
#   gh secret set JULES_API_KEY
#
# Jules also needs its GitHub App authorised on this repository before any
# source is usable -- the API alone is not enough.
#
# NOTE: upstream's README still references `google-labs-code/jules-invoke@v1`.
# That repo was renamed to jules-action; the old path 301-redirects, but the
# current name is used here.
#
# Free tier is 15 tasks/day and 3 concurrent, so the cron schedules below are
# deliberately infrequent. Raising them can exhaust the daily quota and starve
# the interactive/CLI path.

on:
  schedule:
    # Weekly cleanup, Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  issues:
    types: [labeled]
  workflow_run:
    # Only the CI workflows ci-failure-fix can act on (#304). "*" created a
    # skipped no-op run for every workflow completion in the repo (48 of the
    # last 100 runs at filing time were exactly that).
    workflows: ["mcpx", "mcpx conformance", "mcpx nix build", "nix ci", "id"]
    types: [completed]
    # ci-failure-fix ignores main-branch failures, so main completions
    # should not create a run at all.
    branches-ignore: ["main"]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to Jules"
        required: true
        type: string

# No workflow-level concurrency group (#304): for workflow_run events
# github.ref is the default branch, so one shared group let any noise
# completion cancel a pending ci-failure-fix run (queue: single). Each job
# carries its own group below, keyed by its target, so a run whose jobs all
# skip can never displace a run that would act.

permissions:
  contents: read
  issues: read

jobs:
  weekly-cleanup:
    if: github.event_name == 'schedule'
    concurrency:
      group: ${{ github.workflow }}-weekly-cleanup
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_commit_log: true
          prompt: >-
            Review the repository for low-risk housekeeping: dead code,
            unused dependencies, stale TODOs and obvious documentation drift.
            Open a single pull request with the changes, and explain each one.
            Do not make behavioural changes. Batch every instance of the same
            problem into that one PR — update related dependencies together,
            never one PR per dependency. Merging is permitted but never
            required: merge only when checks pass and you are reasonably
            certain the PR is correct and low-risk; otherwise leave it open
            and state your confidence and what a human should check.

  # Triggered by applying the `jules` label to an issue. Note this is the same
  # convention the Jules GitHub App uses natively; keep one or the other to
  # avoid two agents racing on the same issue.
  issue-labeled:
    if: github.event_name == 'issues' && github.event.label.name == 'jules'
    concurrency:
      group: ${{ github.workflow }}-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: >-
            Address GitHub issue #${{ github.event.issue.number }}:
            "${{ github.event.issue.title }}".
            ${{ github.event.issue.body }}
            Open a pull request that fixes it. Put "Fixes #${{ github.event.issue.number }}"
            in the pull request description so the issue closes on merge, and
            cover any same-set instances of the problem (including related
            dependency updates) in the same PR rather than separately.

  ci-failure-fix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main'
    concurrency:
      group: >-
        ${{ github.workflow }}-ci-failure-fix-${{
        github.event.workflow_run.name }}-${{
        github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          include_last_commit: true
          prompt: >-
            The workflow "${{ github.event.workflow_run.name }}" failed on branch
            ${{ github.event.workflow_run.head_branch }}. Read the failing run at
            ${{ github.event.workflow_run.html_url }}, work out the cause, and
            push a fix to that branch.

  manual:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: ${{ github.workflow }}-manual
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: ${{ inputs.prompt }}
