# Nightly full check for pkgs/id — the heavy half of the old PR gate (#292).
#
# Runs the complete `nix flake check` for pkgs/id, including the checks that
# were moved out of id-check.yml: Playwright browser E2E (test-e2e) and the
# NixOS VM tests (nixos-serve, nixos-e2e, nixos-integration,
# nixos-playwright-e2e). Nightly on a schedule, and on demand via
# workflow_dispatch.
#
# The timeout is deliberately larger than the PR gate's 60 minutes: a full
# check including VM image builds legitimately takes longer. It runs off
# the PR path, so the cost lands on a schedule, not on a review.
#
# 2026-11-22: 90 minutes proved too small — every nightly run from
# 2026-11-16 through 2026-11-21 concluded "cancelled" with a job runtime
# of almost exactly 90 minutes (e.g. run 44919101712: 15:25:27Z to
# 16:55:51Z, 90m24s), i.e. this timeout killed the job mid-check, not a
# test failure and not a successor run. The suite budgets alone exceed
# 90 minutes serially (nixos-integration 3600s, nixos-playwright-e2e
# 1200s) before any build time, and a cold store cache pushes the total
# well past it. Raised to 300 minutes so the nightly can finish and
# report a real result; the schedule still bounds it to once a day.

name: id e2e nightly

on:
  schedule:
    # 07:23 UTC ≈ 01:23–02:23 local — off the hour, away from other dailies.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (full)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            # #774 recurrence (2026-11-12): when the Magic Nix Cache proxy
            # throttles (HTTP 418), fall back to building from source
            # instead of hard-failing the check on the narinfo fetch.
            fallback = true

      # Same store cache as the PR gate, so the nightly run starts warm
      # and unchanged derivations are not rebuilt from cold (#288).
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          # FlakeHub Cache off (#2120): no id-token is granted and the
          # developing-today org is not registered, so the action's
          # opportunistic FlakeHub enable hard-failed jobs on an auth
          # error. The GitHub Actions cache is the cache.
          use-flakehub: false
          use-gha-cache: true

      # Enable KVM for NixOS VM integration tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Disk telemetry + reclaim (#257, Option A): the full check
      # intermittently dies with "No space left on device" while the big
      # derivations build. Log free space before and after the reclaim and
      # before and after the check so a recurrence is diagnosable at a
      # glance, and drop preinstalled toolchains/SDKs this job never uses
      # (the standard free-disk-space recipe, ~20-30 GB on ubuntu-latest).
      - name: Disk space before reclaim
        run: df -h

      - name: Reclaim disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Disk space after reclaim (before check)
        run: df -h

      - name: Run full nix flake check
        run: nix flake check ./pkgs/id/ -L --keep-going

      - name: Disk space after check
        if: always()
        run: df -h
