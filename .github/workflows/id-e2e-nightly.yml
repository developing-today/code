# Nightly full check for pkgs/id — the heavy half of the old PR gate (#292).
#
# Runs the complete `nix flake check` for pkgs/id, including the checks that
# were moved out of id-check.yml: Playwright browser E2E (test-e2e) and the
# NixOS VM tests (nixos-serve, nixos-e2e, nixos-integration,
# nixos-playwright-e2e). Nightly on a schedule, and on demand via
# workflow_dispatch.
#
# The timeout is deliberately larger than the PR gate's 60 minutes: a full
# check including VM image builds legitimately takes longer. It runs off
# the PR path, so the cost lands on a schedule, not on a review.

name: id e2e nightly

on:
  schedule:
    # 07:23 UTC ≈ 01:23–02:23 local — off the hour, away from other dailies.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (full)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      # Same store cache as the PR gate, so the nightly run starts warm
      # and unchanged derivations are not rebuilt from cold (#288).
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Enable KVM for NixOS VM integration tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Disk telemetry + reclaim (#257, Option A): the full check
      # intermittently dies with "No space left on device" while the big
      # derivations build. Log free space before and after the reclaim and
      # before and after the check so a recurrence is diagnosable at a
      # glance, and drop preinstalled toolchains/SDKs this job never uses
      # (the standard free-disk-space recipe, ~20-30 GB on ubuntu-latest).
      - name: Disk space before reclaim
        run: df -h

      - name: Reclaim disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Disk space after reclaim (before check)
        run: df -h

      - name: Run full nix flake check
        run: nix flake check ./pkgs/id/ -L --keep-going

      - name: Disk space after check
        if: always()
        run: df -h
