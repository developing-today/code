# Nightly full check for pkgs/id — the heavy half of the old PR gate (#292).
#
# Runs the complete `nix flake check` for pkgs/id, including the checks that
# were moved out of id-check.yml: Playwright browser E2E (test-e2e) and the
# NixOS VM tests (nixos-serve, nixos-e2e, nixos-integration,
# nixos-playwright-e2e). Nightly on a schedule, and on demand via
# workflow_dispatch.
#
# The timeout is deliberately larger than the PR gate's 60 minutes: a full
# check including VM image builds legitimately takes longer. It runs off
# the PR path, so the cost lands on a schedule, not on a review.
#
# 2026-11-22: 90 minutes proved too small — every nightly run from
# 2026-11-16 through 2026-11-21 concluded "cancelled" with a job runtime
# of almost exactly 90 minutes (e.g. run 44919101712: 15:25:27Z to
# 16:55:51Z, 90m24s), i.e. this timeout killed the job mid-check, not a
# test failure and not a successor run. The suite budgets alone exceed
# 90 minutes serially (nixos-integration 3600s, nixos-playwright-e2e
# 1200s) before any build time, and a cold store cache pushes the total
# well past it. Raised to 300 minutes so the nightly can finish and
# report a real result; the schedule still bounds it to once a day.
#
# 2026-11-22 (#1372): a long job is not the same as a legible one. The
# first 300-minute run (45026136879) sat in the single check step for
# over an hour and a half with no per-check progress signal: the job
# log visible via the API lagged ~25 minutes behind the runner (last
# visible line 13:59:58Z in downloads at 14:19Z and 14:24Z, while the
# job was in fact still building), so slow and dead are
# indistinguishable from outside until the job timeout fires. The
# check step therefore runs under a watchdog: a heartbeat line every
# 5 minutes naming the current phase, all output tee'd to
# flake-check.log and uploaded as an artifact even on cancellation,
# and a step timeout (270) below the job timeout (300) so the
# always() steps still run. The workflow_dispatch input `only_checks`
# runs named checks individually under per-check budgets (GNU
# timeout), so a targeted verification — or a hang — names the check
# and fails that check instead of burning the whole night. Budgets
# bound build + test: a check derivation's build is its test, and on
# a cold store cache the shared workspace build alone takes ~1h on
# this runner (run 45033002221: nixos-serve was still compiling the
# `id` crate when a 1200s budget expired); the checks' own internal
# timeouts bound the test phase once built.

name: id e2e nightly

on:
  schedule:
    # 07:23 UTC ≈ 01:23–02:23 local — off the hour, away from other dailies.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      only_checks:
        description: "Space-separated check names to build individually under per-check budgets (targeted verification); empty = full flake check"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (full)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            # #774 recurrence (2026-11-12): when the Magic Nix Cache proxy
            # throttles (HTTP 418), fall back to building from source
            # instead of hard-failing the check on the narinfo fetch.
            fallback = true

      # Same store cache as the PR gate, so the nightly run starts warm
      # and unchanged derivations are not rebuilt from cold (#288).
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          # FlakeHub Cache off (#2120): no id-token is granted and the
          # developing-today org is not registered, so the action's
          # opportunistic FlakeHub enable hard-failed jobs on an auth
          # error. The GitHub Actions cache is the cache.
          use-flakehub: false
          use-gha-cache: true

      # Enable KVM for NixOS VM integration tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Disk telemetry + reclaim (#257, Option A): the full check
      # intermittently dies with "No space left on device" while the big
      # derivations build. Log free space before and after the reclaim and
      # before and after the check so a recurrence is diagnosable at a
      # glance, and drop preinstalled toolchains/SDKs this job never uses
      # (the standard free-disk-space recipe, ~20-30 GB on ubuntu-latest).
      - name: Disk space before reclaim
        run: df -h

      - name: Reclaim disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Disk space after reclaim (before check)
        run: df -h

      # Diagnostic snapshot only: no evaluation or build.
      - name: Record Nix runner configuration
        run: |
          nix --version
          nix show-config --json | jq '{
            max_jobs: ."max-jobs".value,
            cores: .cores.value,
            substituters: .substituters.value
          }'
          nproc
          df -h / /nix/store

      # Watchdog + log capture (#1372, see header): heartbeat every
      # 5 minutes naming the phase, output tee'd to flake-check.log
      # (uploaded below even when the job is cancelled), step timeout
      # 270 < job timeout 300 so the always() steps still run. With
      # only_checks set, each named check runs on its own under a
      # per-check GNU timeout budget and the step ends with a summary
      # naming every failed check.
      - name: Run nix flake check (watchdog, log capture)
        timeout-minutes: 270
        env:
          ONLY_CHECKS: ${{ inputs.only_checks }}
        run: |
          set -uo pipefail
          set +e
          START_EPOCH=$(date +%s)
          PHASE_FILE="$RUNNER_TEMP/nightly-phase"
          echo "full flake check" > "$PHASE_FILE"
          # setsid + process-group kill: a plain kill of the loop would
          # orphan its current `sleep`, which inherits the step's stdout
          # pipe and can hold the step open until the sleep expires.
          setsid bash -c '
            while true; do
              sleep 300
              echo "[nightly-watchdog] still running: phase=$(cat "$1" 2>/dev/null || echo unknown), watchdog elapsed ${SECONDS}s"
            done
          ' _ "$PHASE_FILE" &
          WATCHDOG=$!
          cleanup() {
            local rc=$?
            kill -TERM -"$WATCHDOG" 2>/dev/null || true
            echo "Elapsed check seconds: $(($(date +%s) - START_EPOCH))" >> "$GITHUB_STEP_SUMMARY"
            return "$rc"
          }
          trap cleanup EXIT

          budget_for() {
            # Build + test bounds (see header): the test phase itself
            # is bounded by each check's own internal timeouts.
            case "$1" in
              nixos-integration) echo 7200 ;;
              nixos-playwright-e2e) echo 5400 ;;
              nixos-e2e|nixos-serve) echo 5400 ;;
              *) echo 5400 ;;
            esac
          }

          if [ -n "${ONLY_CHECKS:-}" ]; then
            FAILED=""
            for CHECK in $ONLY_CHECKS; do
              BUDGET=$(budget_for "$CHECK")
              echo "targeted check $CHECK" > "$PHASE_FILE"
              echo "[nightly] waiting on check '$CHECK' (budget ${BUDGET}s)"
              timeout --signal=TERM --kill-after=30s "$BUDGET" \
                nix build "./pkgs/id#checks.x86_64-linux.$CHECK" -L 2>&1 | tee -a flake-check.log
              RC=${PIPESTATUS[0]}
              if [ "$RC" -eq 124 ]; then
                echo "[nightly] check '$CHECK' exceeded its ${BUDGET}s budget (rc=124)"
                FAILED="$FAILED $CHECK"
              elif [ "$RC" -ne 0 ]; then
                echo "[nightly] check '$CHECK' failed (rc=$RC)"
                FAILED="$FAILED $CHECK"
              else
                echo "[nightly] check '$CHECK' passed"
              fi
            done
            echo "[nightly] targeted summary: failed checks:${FAILED:- none}"
            [ -z "$FAILED" ]
            exit $?
          fi

          nix flake check ./pkgs/id/ -L --keep-going 2>&1 | tee flake-check.log
          exit "${PIPESTATUS[0]}"

      - name: Disk space after check
        if: always()
        run: df -h

      # The tee'd check log as a downloadable artifact (#1372): it
      # survives job cancellation/timeout, so the evidence for a stall
      # or a named failure is attachable to the issue, not scrollback.
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-flake-check-log
          path: flake-check.log
          if-no-files-found: ignore
