name: decision-events worker release

# CI tier policy: see .github/ci-policy.md. This is a manual release
# workflow: workflow_dispatch does not run tests or deploy on PRs or pushes.

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "I confirm the existing decision-events Worker and D1 ID in the configured Cloudflare account are the intended target."
        required: true
        type: boolean
        default: false
      promote:
        description: "Create a 100% deployment after uploading the version."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: decision-events-worker-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: release decision-events Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: decision-events-production
    defaults:
      run:
        working-directory: pm-stack/decision-events-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install locked dependencies
        run: npm ci

      - name: Run Worker tests and typecheck
        run: |
          bun test
          npm run typecheck
          npm run test:release

      - name: Build and inspect offline Build Output
        run: |
          export WRANGLER_LOG_PATH="$RUNNER_TEMP/wrangler-decision-events.log"
          ./node_modules/.bin/cf workers versions create \
            --worker decision-events \
            --tag offline-${GITHUB_SHA:0:12} \
            --message "offline Build Output check" \
            --dry-run
          npm run check:build-output

      - name: Require explicit target confirmation
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          if [[ "$CONFIRM_TARGET" != "true" ]]; then
            echo "Set confirm_target after verifying the existing account, Worker, and D1 target." >&2
            exit 1
          fi

      - name: Verify existing Worker and D1 identity (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Configure the account ID variable and API token secret in decision-events-production." >&2
            exit 1
          fi
          ./node_modules/.bin/cf -q workers get decision-events > "$RUNNER_TEMP/decision-events-worker.json"
          ./node_modules/.bin/cf -q d1 get 68ade85e-6835-46a8-af6a-a9f2f2d966ae > "$RUNNER_TEMP/decision-events-d1.json"
          node scripts/check-target.mjs \
            "$RUNNER_TEMP/decision-events-worker.json" \
            "$RUNNER_TEMP/decision-events-d1.json"

      - name: Upload immutable Worker version
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Set the decision-events-production CLOUDFLARE_ACCOUNT_ID variable." >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Set the decision-events-production CLOUDFLARE_API_TOKEN secret." >&2
            exit 1
          fi
          export WRANGLER_LOG_PATH="$RUNNER_TEMP/wrangler-decision-events.log"
          tag="git-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          ./node_modules/.bin/cf workers versions create \
            --worker decision-events \
            --tag "$tag" \
            --message "GitHub Actions release ${GITHUB_SHA}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Promote uploaded version to 100 percent
        if: ${{ inputs.promote }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TAG: ${{ steps.upload.outputs.tag }}
        run: |
          set -euo pipefail
          version_id="$(node scripts/resolve-deployable-version.mjs "$RELEASE_TAG")"
          versions="$(node -e 'process.stdout.write(JSON.stringify([{version_id: process.argv[1], percentage: 100}]))' "$version_id")"
          ./node_modules/.bin/cf workers deployments create \
            --worker decision-events \
            --strategy percentage \
            --versions "$versions"
