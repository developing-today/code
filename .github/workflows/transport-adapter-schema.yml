name: transport adapter declarations

on:
  pull_request:
    paths:
      - 'config/transport-adapters/**'
      - '.github/workflows/transport-adapter-schema.yml'
  push:
    branches: [main]
    paths:
      - 'config/transport-adapters/**'
      - '.github/workflows/transport-adapter-schema.yml'

permissions:
  contents: read

jobs:
  validate:
    name: validate adapter registry schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Validate registry against JSON Schema 2020-12
        run: nix shell nixpkgs#check-jsonschema -c check-jsonschema --schemafile config/transport-adapters/schema.json config/transport-adapters/registry.json
