name: queue-transport-alert Worker deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Upload a code-only version or promote an uploaded version
        required: true
        type: choice
        options: [upload, promote]
      confirm:
        description: Confirm the selected Cloudflare operation
        required: true
        type: boolean
        default: false
      attest_admin_bypass_disabled:
        description: Owner attests the environment was checked separately and administrator bypass is disabled
        required: true
        type: boolean
        default: false
      upload_run_id:
        description: Successful upload workflow run ID for promotion
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: queue-transport-alert-cloudflare-deploy
  cancel-in-progress: false

jobs:
  verify-environment:
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main' && inputs.confirm && inputs.attest_admin_bypass_disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an existing reviewed main-only environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/environments/cloudflare-queue-transport-alert"
          gh api "$endpoint" | jq -e '
            .name == "cloudflare-queue-transport-alert"
            and ((has("can_admins_bypass") | not) or .can_admins_bypass == false)
            and .deployment_branch_policy.custom_branch_policies == true
            and .deployment_branch_policy.protected_branches == false
            and any(.protection_rules[];
              .type == "required_reviewers" and .prevent_self_review == true
              and (.reviewers | length) > 0)' >/dev/null
          gh api "$endpoint/deployment-branch-policies?per_page=100" | jq -e '
            .total_count == 1 and (.branch_policies | length) == 1
            and .branch_policies[0].type == "branch" and .branch_policies[0].name == "main"' >/dev/null
  deploy:
    needs: verify-environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-queue-transport-alert
    steps:
      - name: Validate dispatch inputs
        env:
          ACTION: ${{ inputs.action }}
          RUN_ID: ${{ inputs.upload_run_id }}
        run: |
          if [[ "$ACTION" == promote ]]; then
            [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo 'promote requires upload_run_id' >&2; exit 2; }
          elif [[ -n "$RUN_ID" ]]; then
            echo 'upload_run_id is only valid for promote' >&2; exit 2
          fi
      - name: Download handoff from exact upload run
        if: inputs.action == 'promote'
        uses: actions/download-artifact@v4
        with:
          name: qta-version-${{ inputs.upload_run_id }}
          run-id: ${{ inputs.upload_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qta-handoff
      - name: Verify upload provenance and baseline receipt
        if: inputs.action == 'promote'
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.upload_run_id }}
          HANDOFF: ${{ runner.temp }}/qta-handoff/qta-version.json
        run: |
          set -euo pipefail
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          source_sha=$(jq -r .source_sha "$HANDOFF")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r .worker "$HANDOFF")" = queue-transport-alert
          test "$(jq -r .upload_run_id "$HANDOFF")" = "$RUN_ID"
          test "$(jq -r .upload_run_attempt "$HANDOFF")" = "$(jq -r .run_attempt <<<"$run")"
          test "$(jq -r .upload_event "$HANDOFF")" = workflow_dispatch
          test "$(jq -r .upload_ref "$HANDOFF")" = refs/heads/main
          test "$(jq -r .upload_workflow_path "$HANDOFF")" = .github/workflows/queue-transport-alert-deploy.yml
          test "$(jq -r .path <<<"$run")" = .github/workflows/queue-transport-alert-deploy.yml
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .head_sha <<<"$run")" = "$source_sha"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .worker "$HANDOFF")" = queue-transport-alert
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact uploaded source
        if: inputs.action == 'promote'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.handoff.outputs.source_sha }}
          persist-credentials: false
      - name: Check out trusted dispatch source
        if: inputs.action == 'upload'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Build pinned deploy application from verified source
        run: nix build .#queue-transport-alert-deploy
      - name: Upload code-only Worker version
        if: inputs.action == 'upload'
        env:
          QTA_GHA: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.QTA_WORKER_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.QTA_WORKER_PRODUCTION_CF_API_TOKEN }}
          QTA_SOURCE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QTA_HANDOFF_FILE: ${{ runner.temp }}/qta-version.json
        run: ./result/bin/queue-transport-alert-deploy
      - name: Save version handoff
        if: inputs.action == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: qta-version-${{ github.run_id }}
          path: ${{ runner.temp }}/qta-version.json
          if-no-files-found: error
          retention-days: 14
      - name: Promote verified version only
        if: inputs.action == 'promote'
        env:
          QTA_GHA: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.QTA_WORKER_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.QTA_WORKER_PRODUCTION_CF_API_TOKEN }}
          QTA_HANDOFF_FILE: ${{ runner.temp }}/qta-handoff/qta-version.json
          QTA_SOURCE_SHA: ${{ steps.handoff.outputs.source_sha }}
          QTA_UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
        run: |
          set -euo pipefail
          version_id=$(jq -r .version_id "$QTA_HANDOFF_FILE")
          [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          ./result/bin/queue-transport-alert-deploy --deploy-version "$version_id"
