name: queue-transport-alert Worker deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Upload a new version or promote an existing version
        required: true
        type: choice
        options: [upload, promote]
      version_id:
        description: Upload workflow run ID that produced the version handoff artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: queue-transport-alert-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-queue-transport-alert
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Build pinned deploy application
        run: nix build .#queue-transport-alert-deploy
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ "$ACTION" == promote ]]; then
            [[ "$VERSION_ID" =~ ^[A-Za-z0-9_-]{8,128}$ ]] || { echo 'promote requires a valid version_id' >&2; exit 2; }
          elif [[ -n "$VERSION_ID" ]]; then
            echo 'version_id is only valid for promote' >&2; exit 2
          fi
      - name: Upload a new version (does not promote)
        if: inputs.action == 'upload'
        env:
          QTA_GHA: '1'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BROKER_AGENT_TOKEN: ${{ secrets.BROKER_AGENT_TOKEN }}
          QTA_HANDOFF_FILE: ${{ runner.temp }}/qta-version.json
        run: ./result/bin/queue-transport-alert-deploy
      - name: Save version handoff
        if: inputs.action == 'upload'
        uses: actions/upload-artifact@v4
        with:
          name: qta-version-${{ github.run_id }}
          path: ${{ runner.temp }}/qta-version.json
          if-no-files-found: error
          retention-days: 14
      - name: Download handoff from exact successful upload run
        if: inputs.action == 'promote'
        uses: actions/download-artifact@v4
        with:
          name: qta-version-${{ inputs.version_id }}
          run-id: ${{ inputs.version_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qta-handoff
      - name: Check out uploaded source commit
        if: inputs.action == 'promote'
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Validate handoff source is still trusted main history
        if: inputs.action == 'promote'
        id: handoff
        env:
          RUN_ID: ${{ inputs.version_id }}
          HANDOFF: ${{ runner.temp }}/qta-handoff/qta-version.json
        run: |
          source_sha=$(jq -r .source_sha "$HANDOFF")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r .worker "$HANDOFF")" = queue-transport-alert
          test "$(jq -r .upload_run_id "$HANDOFF")" = "$RUN_ID"
          git fetch origin "$source_sha"
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Promote explicit existing version
        if: inputs.action == 'promote'
        env:
          QTA_GHA: '1'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QTA_HANDOFF_FILE: ${{ runner.temp }}/qta-handoff/qta-version.json
          QTA_SOURCE_SHA: ${{ steps.handoff.outputs.source_sha }}
          QTA_UPLOAD_RUN_ID: ${{ inputs.version_id }}
        run: |
          test "$(jq -r .upload_run_id "$QTA_HANDOFF_FILE")" = "$QTA_UPLOAD_RUN_ID"
          version_id=$(jq -r .version_id "$QTA_HANDOFF_FILE")
          ./result/bin/queue-transport-alert-deploy --deploy-version "$version_id"
