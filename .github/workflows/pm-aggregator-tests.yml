# pm-aggregator-tests.yml -- runs the pm-stack aggregator bun test
# suite (incl. the #1176 publisher/collector/aggregator contract corpus),
# the contract pre-publish check, and typecheck in GitHub Actions
# (#1579), plus the projector bun test suite (#2936: projector PRs
# previously got no test signal until the push-to-main pm-stack-tests
# workflow ran after merge). Until #1579 aggregator PRs merged with no
# test signal: the suite (pm-stack/aggregator/test/) and the bun
# scripts existed, but no workflow ran them.
#
# Path-filtered to pm-stack/** plus this file, so unrelated PRs never
# pay for it. Runs on pull requests touching pm-stack (the contract
# suite is the merge-time signal for the #1110 failure class) and on
# every main push. Deliberately NOT a required check -- making it
# required in branch protection is a separate settings decision.
# CI tier policy: see .github/ci-policy.md.

name: pm-aggregator tests

on:
  pull_request:
    paths:
      - "pm-stack/**"
      - ".github/workflows/pm-aggregator-tests.yml"
  push:
    branches:
      - main
    paths:
      - "pm-stack/**"
      - ".github/workflows/pm-aggregator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel a verification run for an earlier merge.
# Pull-request runs share a per-ref group, so a new push to a PR still
# supersedes its stale run (#392).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run contract corpus tests
        run: bun test test/contract-corpus.test.ts test/contract-collector.test.ts
      - name: Run contract pre-publish check over the corpus
        run: bun run scripts/check-contract-corpus.ts

  test:
    name: aggregator tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_AGG_SOURCE: fixtures
      PM_AGG_DEV: "1"
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run aggregator tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit

  projector:
    name: projector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/projector
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run projector tests
        run: bun test
