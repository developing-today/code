# pm-aggregator-tests.yml -- runs the pm-stack aggregator bun test
# suite and typecheck in GitHub Actions (#1579). Until now aggregator
# PRs merged with no test signal: the suite (pm-stack/aggregator/test/)
# and the bun scripts existed, but no workflow ran them.
#
# Path-filtered to pm-stack/** plus this file, so unrelated PRs never
# pay for it. Deliberately NOT a required check -- making it required
# in branch protection is a separate settings decision.

name: pm-aggregator tests

on:
  pull_request:
    paths:
      - "pm-stack/**"
      - ".github/workflows/pm-aggregator-tests.yml"
  push:
    branches: [main]
    paths:
      - "pm-stack/**"
      - ".github/workflows/pm-aggregator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run aggregator tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
