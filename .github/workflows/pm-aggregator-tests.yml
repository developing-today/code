# pm-aggregator-tests.yml -- runs the pm-stack aggregator bun test
# suite (incl. the #1176 publisher/collector/aggregator contract corpus),
# the contract pre-publish check, and typecheck in GitHub Actions
# (#1579), plus the projector bun test suite (#2936: projector PRs
# previously got no test signal until the push-to-main pm-stack-tests
# workflow ran after merge). Until #1579 aggregator PRs merged with no
# test signal: the suite (pm-stack/aggregator/test/) and the bun
# scripts existed, but no workflow ran them.
#
# Dispatch-only by Drew's 2026-11-05 ruling (#6126): PR and main-push
# triggers remain blocked until runner strategy and fleet-wide trigger
# policy are decided. Do not add auto triggers in a routine workflow fix.
# Dispatch this workflow deliberately for pm-stack changes that need its
# checks; until it is dispatched, the CI status is "not run".
# Deliberately NOT a required check -- making it required in branch
# protection is a separate settings decision.
# CI tier policy: see .github/ci-policy.md.

name: pm-aggregator tests

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow currently runs only via workflow_dispatch. Dispatches
# on the same ref share a group, and a newer dispatch cancels the older
# run. Push/PR event groups are inactive until runner strategy and the
# fleet-wide trigger policy are settled (see #6126).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run contract corpus tests
        run: bun test test/contract-corpus.test.ts test/contract-collector.test.ts
      - name: Run contract pre-publish check over the corpus
        run: bun run scripts/check-contract-corpus.ts

  test:
    name: aggregator tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run aggregator tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit

  projector:
    name: projector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/projector
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run projector tests
        run: bun test
