# pm-aggregator-tests.yml -- runs the pm-stack aggregator bun test
# suite (incl. the #1176 publisher/collector/aggregator contract corpus),
# the contract pre-publish check, and typecheck in GitHub Actions
# (#1579), plus the projector bun test suite (#2936: projector PRs
# previously got no test signal until the push-to-main pm-stack-tests
# workflow ran after merge). Until #1579 aggregator PRs merged with no
# test signal: the suite (pm-stack/aggregator/test/) and the bun
# scripts existed, but no workflow ran them.
#
# Dispatch-only by Drew's 2026-11-05 ruling (#6126): PR and main-push
# triggers remain blocked until runner strategy and fleet-wide trigger
# policy are decided. Do not add auto triggers in a routine workflow fix.
# Dispatch this workflow deliberately for pm-stack changes that need its
# checks; until it is dispatched, the CI status is "not run".
# Deliberately NOT a required check -- making it required in branch
# protection is a separate settings decision.
# CI tier policy: see .github/ci-policy.md.

name: pm-aggregator tests

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow currently runs only via workflow_dispatch. Dispatches
# on the same ref share a group, and a newer dispatch cancels the older
# run. Push/PR event groups are inactive until runner strategy and the
# fleet-wide trigger policy are settled (see #6126).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run contract corpus tests
        run: bun test test/contract-corpus.test.ts test/contract-collector.test.ts
      - name: Run contract pre-publish check over the corpus
        run: bun run scripts/check-contract-corpus.ts

  test:
    name: aggregator tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The aggregator suite's contract is the fixture environment
    # (#5557): without it, `bun test` boots the live sources and the
    # run depends on whatever the runner can reach. Job-level env so
    # every step (tests and typecheck) sees the same world.
    env:
      PM_AGG_SOURCE: fixtures
      PM_AGG_DEV: "1"
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run aggregator tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit

  projector:
    name: projector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pm-stack/projector
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run projector tests
        run: bun test

  browser:
    name: browser acceptance (MOB-00)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same fixture contract as the test job (#5557): the MOB-00
    # Playwright harness (#9467) boots the aggregator in fixture mode
    # and aborts every non-local request, so the run is deterministic
    # and needs no GitHub/Project/session credentials.
    env:
      PM_AGG_SOURCE: fixtures
      PM_AGG_DEV: "1"
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve pinned Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers (pinned by @playwright/test in bun.lock)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('pm-stack/aggregator/bun.lock') }}
      - name: Install Chromium for the pinned Playwright version
        run: bunx playwright install --with-deps chromium
      - name: Run browser acceptance (MOB-00 contract test)
        run: bunx playwright test --config playwright.config.ts --grep pmo_mob_03/04
      - name: Upload Playwright trace/video on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: pm-stack/aggregator/test-results
          if-no-files-found: ignore
