name: github-backup hosted publisher

# First hosted publisher slice for #15000: reconstruct the four source
# mirrors directly from GitHub, then publish and verify their plain mirrors.
# R2 bundles and rehost publication remain later slices of the same issue.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: github-backup-hosted-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Reconstruct and publish four plain mirrors
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create least-privilege backup App token
        id: mirror-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "5562183"
          private-key: ${{ secrets.BACKUP_APP_PRIVATE_KEY }}
          owner: developing-today
          repositories: |
            code-mirror
            fleet-mirror
            openchamber-mirror
            opencode-mirror
          permission-contents: write
          permission-workflows: write

      - name: Create ephemeral backup root
        id: root
        shell: bash
        run: |
          path="$(mktemp -d "$RUNNER_TEMP/github-backup.XXXXXX")"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"

      - name: Reconstruct sources from GitHub
        env:
          HOSTED_BACKUP_ROOT: ${{ steps.root.outputs.path }}
        run: python3 infra/github-backup/bin/hosted_seed_fleet.py --root "$HOSTED_BACKUP_ROOT"

      - name: Publish and verify plain mirrors
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          HOSTED_BACKUP_ROOT: ${{ steps.root.outputs.path }}
        run: |
          gh auth setup-git
          python3 infra/github-backup/bin/plain_mirror_all.py --root "$HOSTED_BACKUP_ROOT"

      - name: Install rclone for R2 bundles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Upload verified R2 bundles
        env:
          HOSTED_BACKUP_ROOT: ${{ steps.root.outputs.path }}
          RCLONE_CONFIG_R2BAK_TYPE: s3
          RCLONE_CONFIG_R2BAK_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2BAK_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2BAK_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2BAK_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: python3 infra/github-backup/bin/bundle_r2_all.py --bucket supabase-backups --root "$HOSTED_BACKUP_ROOT"

      - name: Remove ephemeral backup root
        if: always() && steps.root.outputs.path != ''
        env:
          HOSTED_BACKUP_ROOT: ${{ steps.root.outputs.path }}
        run: rm -rf -- "$HOSTED_BACKUP_ROOT"
