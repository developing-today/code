name: program-tending

# program-tending (issue #1352, slice 1/3 scaffold).
#
# Daily scheduled care for the planning layer across the four fleet
# repos (code, opencode, openchamber, nix): epics, roadmaps, projects,
# stalled PRs, loose ends. This slice is the scaffold only: the
# schedule, the runner entrypoint, per-section stubs that verify and
# report no-actions, and the structured run log. Full section
# implementations land in slices 2-3 (see #1352 triage decomposition,
# 2026-11-02) after this scaffold lands.
#
# Ownership rules (from #1352, enforced in slice 1 stubs):
# - Never touch held / do-not-merge / user-owned PRs.
# - Drew's own feature PRs: check-in comment at 7 days only, never a packet.
# - user/review is reported, never re-decided.

on:
  schedule:
    # Daily 13:00 UTC (07:00 CST / 08:00 CDT).
    - cron: "0 13 * * *"
  workflow_dispatch:

# One live tending run at a time: a new tick cancels a still-running
# previous run (each run is read-mostly and idempotent; actions are
# comments/labels, never force-pushes).
concurrency:
  group: program-tending
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tend:
    name: program-tending scaffold run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run program-tending scaffold (slice 1 stubs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/program_tending.py --run
