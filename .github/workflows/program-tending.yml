name: program-tending

# program-tending (issue #1352, slices 1+2 of 3).
#
# Daily scheduled care for the planning layer across the four fleet
# repos (code, opencode, openchamber, nix): epics, roadmaps, projects,
# stalled PRs, loose ends. This slice is the scaffold only: the
# schedule, the runner entrypoint, per-section stubs that verify and
# report no-actions, and the structured run log. Full section
# implementations land in slices 2-3 (see #1352 triage decomposition,
# 2026-11-02) after this scaffold lands.
#
# Ownership rules (from #1352, enforced in slice 1 stubs):
# - Never touch held / do-not-merge / user-owned PRs (hold labels only:
#   `held`, `user/owned`, `do-not-merge`, `do-not-auto-edit`).
# - PRs labeled `user/owned`: check-in comment at 7 days only, never a packet
#   (authorship alone never marks a PR held — Drew ruling 2026-11-07, #7077).
# - user/review is reported, never re-decided.

on:
  schedule:
    # Daily 13:00 UTC (07:00 CST / 08:00 CDT).
    - cron: "0 13 * * *"
  workflow_dispatch:

# One live tending run at a time: a new tick cancels a still-running
# previous run (each run is read-mostly and idempotent; actions are
# comments/labels, never force-pushes).
concurrency:
  group: program-tending
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  tend:
    name: program-tending run (slices 1+2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test program-tending contracts
        run: |
          test -f scripts/tests/test_program_tending.py
          python3 -m unittest discover -s scripts/tests -p 'test_program_tending.py' -v
      - name: Run program-tending (slice 2 sections live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/program_tending.py --run --live
