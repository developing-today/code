name: go modules build

# Build verification for the small pkgs/{chat,database,import,launcher,tea}
# Go modules (#342).
#
# Nothing built these five modules in CI at all, so a change breaking any
# of them would rot silently — the exact failure that hit pkgs/map (#338)
# and pkgs/identity (#340) before each got its own build workflow. They
# compile and vet clean today; this workflow keeps them that way. One
# matrix job per module so a failure names the module.
#
# pkgs/graph is deliberately excluded: its build failure is #166 and the
# mod-tidy workflow already watches it. pkgs/map and pkgs/identity keep
# their dedicated workflows (identity needs build tags).

on:
  pull_request:
    paths:
      - "pkgs/chat/**"
      - "pkgs/database/**"
      - "pkgs/import/**"
      - "pkgs/launcher/**"
      - "pkgs/tea/**"
      - ".github/workflows/go-modules-build.yml"
  push:
    branches: [main]
    paths:
      - "pkgs/chat/**"
      - "pkgs/database/**"
      - "pkgs/import/**"
      - "pkgs/launcher/**"
      - "pkgs/tea/**"
      - ".github/workflows/go-modules-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: go build (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [chat, database, import, launcher, tea]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/${{ matrix.module }}/go.mod
          cache-dependency-path: pkgs/${{ matrix.module }}/go.sum

      - name: Build
        working-directory: pkgs/${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: pkgs/${{ matrix.module }}
        run: go vet ./...
