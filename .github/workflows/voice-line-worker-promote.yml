# Promote only a previously uploaded exact version, after environment approval.
name: Voice line Worker promote

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare Workers Version UUID printed by the upload run
        required: true
        type: string
      source_sha:
        description: Full 40-character source commit SHA printed by the upload run
        required: true
        type: string
      upload_run_id:
        description: GitHub Actions run ID printed by the upload run
        required: true
        type: string
      upload_run_attempt:
        description: Attempt number printed by the upload run
        required: true
        type: string
      expected_current_version_id:
        description: Current 100% serving Version UUID (compare-and-check)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: voice-line-worker-promotion
  cancel-in-progress: false

jobs:
  verify-environment:
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.verify.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
      - name: Require existing protected Voice Line environment
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_LINE_ENVIRONMENT: voice-line-worker-production
        run: |
          set -euo pipefail
          node pm-stack/voice-line-worker/scripts/check-environment.mjs "$VOICE_LINE_ENVIRONMENT"
          echo "name=$VOICE_LINE_ENVIRONMENT" >> "$GITHUB_OUTPUT"

  promote:
    needs: verify-environment
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.verify-environment.outputs.name }}
    env:
      CF_SEND_TELEMETRY: "false"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CI_OVERRIDE_WORKER_NAME: ''
      WRANGLER_CI_OVERRIDE_NAME: ''
      CF_WORKER_NAME: ''
      CLOUDFLARE_WORKER_NAME: ''
      WRANGLER_WORKER_NAME: ''
      CF_MODE: ''
      CLOUDFLARE_ENV: ''
      WRANGLER_ENV: ''
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE_VERSION_ID: ${{ inputs.version_id }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
      CANDIDATE_UPLOAD_RUN_ATTEMPT: ${{ inputs.upload_run_attempt }}
      EXPECTED_CURRENT_VERSION_ID: ${{ inputs.expected_current_version_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install worker dependencies
        working-directory: pm-stack/voice-line-worker
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate receipt selector
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_UPLOAD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_UPLOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]

      - name: Read exact successful upload attempt receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voice-line-upload-${{ inputs.upload_run_id }}-${{ inputs.upload_run_attempt }}
          repository: developing-today/code
          run-id: ${{ inputs.upload_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/voice-line-receipt

      - name: Verify exact candidate provenance and serving version, then promote
        working-directory: pm-stack/voice-line-worker
        run: npm run promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_VOICE_LINE_PROMOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VOICE_LINE_UPLOAD_RECEIPT: ${{ runner.temp }}/voice-line-receipt/voice-line-upload-receipt.json
