name: Daily Flake Sync & Config Optimization

# Daily NixOS configuration optimization and dependency auditing for
# developing-today/code using an OpenCode session launched via pm-dispatch
# (the pm-dispatch-start reusable action). The `opencode` and `openchamber`
# flake inputs are NOT maintained here: they are owned by the deterministic
# flake-inputs-update workflow (.github/workflows/flake-inputs-update.yml).

on:
  schedule:
    # Run daily at 05:00 UTC (after opencode & openchamber fork syncs)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      update_forks_only:
        description: "Legacy flag, ignored: the opencode/openchamber pins are owned by the flake-inputs-update workflow"
        type: boolean
        default: false
      auto_merge:
        description: "Automatically merge the PR if nix evaluation passes"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  queue: max

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily-flake-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify every declared dispatch input is wired (#2681)
        run: |
          python3 - <<'PYEOF2'
          import re, sys
          path = ".github/workflows/jules-daily-flake-sync.yml"
          text = open(path).read()
          block = re.search(r"workflow_dispatch:\n    inputs:\n((?:      .*\n|        .*\n|          .*\n)+)", text)
          names = re.findall(r"^      (\w+):", block.group(1), re.M) if block else []
          ignored = set(re.findall(r"^      (\w+):\n        description: \"[^\"]*[Ii]gnored", block.group(1), re.M)) if block else set()
          missing = [n for n in names if n not in ignored and ("inputs." + n) not in text]
          if missing:
              sys.exit("declared workflow_dispatch inputs never referenced: " + ", ".join(missing))
          print("all declared dispatch inputs are wired or explicitly ignored:", ", ".join(names) or "none")
          PYEOF2

      - name: Run Flake Sync & Config Agent via pm-dispatch
        id: dispatch
        uses: developing-today/code/.github/actions/pm-dispatch-start@main
        with:
          title: "Daily flake sync & config optimization"
          prompt: >-
            Perform the daily configuration review for developing-today/code. Do NOT update the `opencode` or `openchamber` flake inputs — the flake-inputs-update workflow owns them.

            Follow these instructions and rules:

            ### 1. FLAKE INPUTS — OWNED ELSEWHERE, DO NOT BUMP
            - The `opencode` and `openchamber` flake inputs are owned by the deterministic
              `flake-inputs-update` workflow, which bumps, validates, and merges them daily.
              Do NOT run `nix flake update` for them, do NOT change their pins in `flake.lock`,
              and do NOT open PRs that bump them. If their pins look stale, leave them — the
              owning workflow handles them the same day.
            - Do NOT casually bump root `nixpkgs` (root nixpkgs is pinned deliberately per system stability policies).
            - Clean up any stale input overrides or unused flake dependencies in `flake.nix` (e.g. warnings about non-existent input overrides like gitignore or devshell).

            ### 2. CONFIGURATION & INFRASTRUCTURE IMPROVEMENTS
            - Investigate potential configuration improvements in `nixos/`, `home/`, `lib/`, and package definitions under `pkgs/`.
            - Check for:
              - Deprecated NixOS or Home Manager options
              - Suboptimal build phases or missing binary wrappers
              - Systemd service resilience (e.g. restart policies, socket activation)
              - Modularity and decoupling to prevent merge conflicts
            - Clean up any dead code, unused flags, or documentation drift in Nix configurations.

            ### 3. EVALUATION & VALIDATION
            - Verify that all system and host configurations evaluate cleanly without errors:
              `nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath`
            - Ensure git hooks, commit messages, and treefmt formatting pass cleanly.

            ${{ github.event_name == 'workflow_dispatch' && !inputs.auto_merge && 'OPERATOR DIRECTIVE: auto_merge is false for this manually dispatched run — open the Pull Request if warranted, but do NOT merge it. Leave it open for a human and say in the PR description that auto_merge was off for this run.' || '' }}

            ### 4. PULL REQUEST & MERGE
            - If updates or improvements are present:
              - Open a clear Pull Request documenting any configuration enhancements made. Keep every related change in this one PR — never split changes into one PR per item.
              - Merge into `main` only when you are reasonably certain it is correct: all Nix evaluations and checks succeed, the PR is conflict-free, and the changes are limited to the intended bumps and fixes. Merging is permitted, never required — when any of that is uncertain, leave the PR open and explain what a human should check.
