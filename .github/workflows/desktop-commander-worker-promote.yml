name: desktop-commander worker promote

on:
  workflow_dispatch:
    inputs:
      upload_run_id:
        description: Successful desktop-commander publish run ID
        required: true
        type: string
      upload_run_attempt:
        description: Successful upload attempt number
        required: true
        type: string
      confirm_promotion:
        description: Promote the exact uploaded version to 100 percent
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-commander-worker-lifecycle
  cancel-in-progress: false

jobs:
  promote-version:
    if: github.ref == 'refs/heads/main' && inputs.confirm_promotion
    name: Verify and promote desktop-commander Worker Version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: desktop-commander-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: pkgs/desktop-commander/worker/package-lock.json
      - name: Install pinned cf CLI
        working-directory: pkgs/desktop-commander/worker
        run: npm ci --no-audit --no-fund
      - name: Verify selected upload attempt
        working-directory: pkgs/desktop-commander/worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
          UPLOAD_RUN_ATTEMPT: ${{ inputs.upload_run_attempt }}
          VERIFIED_UPLOAD_RUN_FILE: ${{ runner.temp }}/desktop-commander-worker-verified-run.json
        run: node verify-upload-run.mjs "$UPLOAD_RUN_ID" "$UPLOAD_RUN_ATTEMPT" "$VERIFIED_UPLOAD_RUN_FILE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-commander-worker-upload-${{ inputs.upload_run_id }}-${{ inputs.upload_run_attempt }}
          path: ${{ runner.temp }}/desktop-commander-worker-provenance
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.upload_run_id }}
      - name: Promote only the verified upload
        working-directory: pkgs/desktop-commander/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DC_WORKER_CF_TOKEN: ${{ secrets.DESKTOP_COMMANDER_WORKER_CF_TOKEN }}
          DC_WORKER_VERIFIED_RUN_FILE: ${{ runner.temp }}/desktop-commander-worker-verified-run.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node promote.mjs --manifest "${{ runner.temp }}/desktop-commander-worker-provenance/desktop-commander-worker-provenance.json" --promote
