name: identity build

# CI tier policy: see .github/ci-policy.md

# Build verification for the pkgs/identity Go module (#340).
#
# pkgs/identity builds only with a build tag: its charm fork keeps the
# sqlite/libsql migration variants behind the `sqlite` and `libsql` tags,
# so a plain `go build ./...` fails on undefined Migration0003/0005/0006
# symbols. Nothing built pkgs/identity in CI at all, so a change breaking
# either tagged variant would rot silently. This workflow builds and
# vets both variants whenever the module changes.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "basic: go build (${{ matrix.tags }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tags: [sqlite, libsql]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/identity/go.mod
          cache-dependency-path: pkgs/identity/go.sum

      - name: Verify go.mod and go.sum are tidy
        working-directory: pkgs/identity
        # Same gap as pkgs/map (#349): build/vet pass on an untidy
        # module, so drift would be silent. Tidy is build-tag agnostic,
        # so this one step covers both matrix tag variants.
        # Pattern copied from go-modules-build.yml: these modules pin
        # Go 1.21/1.22, whose `go mod tidy` has no -diff flag (added in
        # Go 1.24; mcpx.yml can use it only because mcpx pins Go 1.27),
        # so run tidy and fail if it changed anything.
        run: |
          go mod tidy
          if [[ -n "$(git status --short -- go.mod go.sum)" ]]; then
            echo "go mod tidy changed go.mod or go.sum; commit the tidy changes."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        working-directory: pkgs/identity
        run: go build -tags ${{ matrix.tags }} ./...

      - name: Vet
        working-directory: pkgs/identity
        run: go vet -tags ${{ matrix.tags }} ./...
