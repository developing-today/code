name: decision-events Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "pm-stack/decision-events-worker/**"
      - "pm-stack/platform/workers.json"
      - ".github/workflows/decision-events-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: pm-stack/decision-events-worker
        run: bun install --frozen-lockfile
      - name: Test and type-check the Worker
        working-directory: pm-stack/decision-events-worker
        run: |
          bun test
          bun run typecheck
      - name: Deploy this commit
        working-directory: pm-stack/decision-events-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to deploy decision-events." >&2
            exit 1
          fi
          bunx wrangler deploy --var "VERSION:${GITHUB_SHA}"
      - name: Require the deployed health version to match this commit
        working-directory: pm-stack/decision-events-worker
        run: >-
          node scripts/check-health.mjs
          --url https://decision-events.developing-today.workers.dev/health
          --version "$GITHUB_SHA"
