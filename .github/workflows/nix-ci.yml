name: nix ci

# CI tier policy: see .github/ci-policy.md
on:
  push:
    branches: [main]
  pull_request:
  # Merge queue pilot (see .github/ci-policy.md): the queue validates
  # the combined merge-group head, and this workflow's PR-tier job
  # (basic: proxy port fallbacks) is main's required status check —
  # it must run on merge groups too, or the queue can never see its
  # required context and stalls.
  merge_group:
  schedule:
    # Nightly backstop: the full flake check runs on main + nightly, not PRs.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Basic tier: the proxy ports' fallback copies (bin/*.mjs script
  # defaults and the {env:VAR:-port} defaults in
  # .opencode/opencode.jsonc) must match the single definitions in
  # home/common/default.nix, or a non-shell launch silently dials
  # the wrong — or an empty — port (#434, #435). Pure bash/grep: no
  # Nix needed, runs on every PR. The same job runs the openclaw unit
  # Wants guard (#2581): generated proxy units must not carry a proxy
  # `Wants` that #2092 deliberately removed, and a clean merge must not
  # be able to put it back unnoticed. Its self-test pins the failure
  # mode by driving the real guard against resurrected fixtures.
  # This job used to also run the treefmt format check; formatting is
  # no longer a merge gate — it is auto-fixed on main by
  # .github/workflows/auto-format.yml (see .github/ci-policy.md).
  proxy-port-fallbacks:
    name: "basic: proxy port fallbacks"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check proxy port fallbacks match their definitions
        run: .github/scripts/check-proxy-port-fallbacks.sh
      - name: Check generated openclaw units carry no undeclared proxy Wants
        run: .github/scripts/check-openclaw-unit-wants.sh
      - name: Self-test the openclaw unit Wants guard
        run: .github/scripts/check-openclaw-unit-wants.test.sh

  flake-check:
    name: "full (main tier): Nix flake evaluation"
    # Main tier only (Phase 2, #1781): PRs keep the basic proxy-port
    # fallback check above; formatting is auto-fixed on main, never a gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Evaluate root flake outputs
        run: |
          nix eval .#devShells.x86_64-linux.default.drvPath
          nix eval .#packages.x86_64-linux.mcpx.drvPath
          nix eval .#apps.x86_64-linux.format-check.program
