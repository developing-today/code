name: nix ci

# CI tier policy: see .github/ci-policy.md
on:
  push:
    branches: [main]
  pull_request:
  # Merge queue pilot (see .github/ci-policy.md): the queue validates
  # the combined merge-group head, and this workflow's PR-tier job
  # (basic: proxy port fallbacks) is main's required status check —
  # it must run on merge groups too, or the queue can never see its
  # required context and stalls.
  merge_group:
  schedule:
    # Nightly backstop: the full flake check runs on main + nightly, not PRs.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  treefmt:
    name: treefmt check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The proxy ports' fallback copies (bin/*.mjs script defaults and
      # the {env:VAR:-port} defaults in .opencode/opencode.jsonc) must
      # match the single definitions in home/common/default.nix, or a
      # non-shell launch silently dials the wrong — or an empty — port
      # (#434, #435). Pure bash/grep: no Nix needed.
      - name: Check proxy port fallbacks match their definitions
        run: .github/scripts/check-proxy-port-fallbacks.sh
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check formatting for changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          changed_files_file="$(mktemp)"
          trap 'rm -f "$changed_files_file"' EXIT
          git diff --name-only --diff-filter=ACMR -z "$base_sha...$GITHUB_SHA" > "$changed_files_file"
          mapfile -d '' changed_files < "$changed_files_file"
          if ((${#changed_files[@]} == 0)); then
            echo "No changed files to format-check."
            exit 0
          fi
          nix run .#format-check -- "${changed_files[@]}"

  flake-check:
    name: Nix flake evaluation
    # Main tier only (Phase 2, #1781): PRs keep the treefmt/format gate above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Evaluate root flake outputs
        run: |
          nix eval .#devShells.x86_64-linux.default.drvPath
          nix eval .#packages.x86_64-linux.mcpx.drvPath
          nix eval .#apps.x86_64-linux.format-check.program
