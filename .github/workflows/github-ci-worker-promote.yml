name: github-ci Worker version promotion

# Explicit promotion is separate from version upload. Configure this
# environment with required reviewers and allow deployment only from main.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Workers Version UUID from an upload workflow run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-ci-worker-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-ci-production
    defaults:
      run:
        working-directory: pkgs/github-ci/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: pkgs/github-ci/worker/package-lock.json

      - name: Install pinned cf and locked tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Cloudflare credentials and version UUID
        id: validate
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION_ID_INPUT: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          [[ "$CF_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ -n "$CF_API_TOKEN" ]]
          [[ "$VERSION_ID_INPUT" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          echo "version_id=${VERSION_ID_INPUT,,}" >> "$GITHUB_OUTPUT"

      - name: Require the existing Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: ./node_modules/.bin/cf -q workers get github-ci >/dev/null

      - name: Read exact version and check secret bindings and provenance
        id: candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION_ID: ${{ steps.validate.outputs.version_id }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/cf -q workers versions get "$VERSION_ID" --worker github-ci \
            > "$RUNNER_TEMP/github-ci-version.json"
          node scripts/deployment-guard.mjs verify-version \
            "$RUNNER_TEMP/github-ci-version.json" "$VERSION_ID"

      - name: Require the source commit to be on main history
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"

      - name: Require the selected version to be deployable
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION_ID: ${{ steps.validate.outputs.version_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/github-ci/versions?deployable=true" \
            > "$RUNNER_TEMP/github-ci-deployable.json"
          node scripts/deployment-guard.mjs verify-deployable \
            "$RUNNER_TEMP/github-ci-deployable.json" "$VERSION_ID"

      - name: Create 100 percent deployment for the selected version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION_ID: ${{ steps.validate.outputs.version_id }}
        run: |
          set -euo pipefail
          printf '[{"version_id":"%s","percentage":100}]\n' "$VERSION_ID" \
            > "$RUNNER_TEMP/github-ci-deployment-versions.json"
          ./node_modules/.bin/cf -q workers deployments create \
            --worker github-ci --strategy percentage \
            --versions "@$RUNNER_TEMP/github-ci-deployment-versions.json"

      - name: Read back latest deployment and verify provenance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION_ID: ${{ steps.validate.outputs.version_id }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/cf -q workers deployments list --worker github-ci \
            > "$RUNNER_TEMP/github-ci-deployments.json"
          node scripts/deployment-guard.mjs verify-deployment \
            "$RUNNER_TEMP/github-ci-deployments.json" "$VERSION_ID" "$SOURCE_SHA"
