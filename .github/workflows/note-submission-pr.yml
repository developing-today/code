name: note-submission

# Main-only CI policy (.github/ci-policy.md): push to main plus manual
# dispatch; no PR-derived trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pkgs/note-submission/**"
      - ".github/workflows/note-submission-pr.yml"

permissions:
  contents: read

concurrency:
  group: note-submission-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "basic: note-submission package tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pkgs/note-submission -> target
      - name: Test note-submission
        run: cargo test --manifest-path pkgs/note-submission/Cargo.toml --all-targets --locked
