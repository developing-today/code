name: github-ci Worker deploy

# Deploys pkgs/github-ci/worker (the webhook-fed CI sink and GitHub
# mirror projector) from main. Deploys are not CI and keep their push
# trigger (.github/ci-policy.md); the vitest suite still runs nightly in
# github-ci-worker-tests.yml and runs here once more before the upload,
# so a red suite never ships.
#
# The Worker had no deploy workflow: `npm run deploy` from a laptop was
# the only path, so merged projector changes (#14170 Q5's
# github_label_history) waited on a person. The mirror ensures its DDL
# on every write, so a deploy is all a schema addition needs.

on:
  push:
    branches: [main]
    paths:
      - "pkgs/github-ci/worker/**"
      - ".github/workflows/github-ci-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: pkgs/github-ci/worker
        run: npm ci --no-audit --no-fund
      - name: Test and type-check the Worker
        working-directory: pkgs/github-ci/worker
        run: |
          npx tsc --noEmit
          npm test
      - name: Deploy this commit
        working-directory: pkgs/github-ci/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to deploy github-ci." >&2
            exit 1
          fi
          npx wrangler deploy --message "github-ci ${GITHUB_SHA}"
