name: fleet-build mirror (org namespace)

# Mirrors the fleet's shared build/test container into the org namespace:
#   ghcr.io/dezren39/fleet-build  ->  ghcr.io/developing-today/fleet-build
#
# The canonical build lives in dezren39/fleet (containers/fleet-build),
# which builds + smoke-tests the image. This workflow does NOT rebuild
# anything — `buildx imagetools create` re-tags the identical image
# digest under the org namespace, for repos/workflows that prefer an
# org-owned package. Consuming repos can use EITHER namespace's image
# as a job container (`jobs.<job>.container:`); they are the same image.
#
# Manual + weekly only: no CI-on-main impact, no per-push cost. The
# source package must be public for the (anonymous) pull to work; it is
# published public by the fleet repo (see dezren39/fleet PR #2 notes).

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag in ghcr.io/dezren39/fleet-build to mirror"
        type: string
        default: "full"
  schedule:
    - cron: "30 7 * * 1"

concurrency:
  group: fleet-build-mirror
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag identical digest into the org namespace
        env:
          SRC_TAG: ${{ inputs.source_tag || 'full' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/developing-today/fleet-build:${SRC_TAG}" \
            "ghcr.io/dezren39/fleet-build:${SRC_TAG}"
          docker buildx imagetools inspect "ghcr.io/developing-today/fleet-build:${SRC_TAG}"
