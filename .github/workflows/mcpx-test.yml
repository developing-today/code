name: mcpx test

# CI tier policy: see .github/ci-policy.md
#
# First measured CI iteration for mcpx (#1998, design #1985): the serial
# `go test ./...` in mcpx.yml's push-only test job is complemented here by
# a sharded suite that also runs on PRs — init generates an e2e matrix
# from the test names actually present in the tree, unit and lint run as
# their own legs, and ci-ok aggregates everything and prints the #140
# measurement table. Nothing in the matrix is hand-maintained: adding or
# renaming a test re-deals the shards on the next run.
#
# #1994: shards are dealt by measured time, not by test count.
# pkgs/mcpx/scripts/ci/e2e-shard-packer.py reads the committed seed
# pkgs/mcpx/scripts/ci/e2e-timings.json (test -> seconds), gives
# unmeasured tests the seed median, and LPT-packs the suite into
# N = clamp(ceil(T / target_leg_seconds), 1, 6) shards. init fails if the
# emitted regexes do not cover every `func Test` in internal/e2e exactly
# once, so a shard cannot silently run zero tests. Each e2e leg runs
# `go test -json` and uploads its per-test Elapsed values, which is where
# the next seed refresh comes from.
#
# WHEN TO STOP SPLITTING (#1994 stop rule — arithmetic, not taste):
# a shard only helps while T/N is below a leg's fixed cost plus queue
# delay, or while the e2e leg is the longest job. Fixed cost per leg is
# ~35 s (checkout + Go setup) plus the deno/bun/node setup time; run
# 41530429335 measured six shards at 2 m 50 s-3 m 05 s of test work each
# but a 38-45 min queue delay, so the queue, not T/N, was the wall clock:
# adding a seventh shard there would have bought ~25 s of test time and
# more queue pressure. Target leg and max shards live in the init step.
#
# Reconciliation with the live workflows (#1998): mcpx.yml keeps its
# direct-Go push test + bot vendorhash-repair, mcpx-nixbuild.yml keeps
# the nix build leg, mcpx-conformance.yml keeps conformance. This
# workflow does not duplicate the nix leg and does not touch
# vendorHash repair.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    name: "basic: mcpx-test init (measured-time e2e matrix)"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@v7
      - id: shards
        name: Generate the measured-time e2e shard matrix
        # Measured-time packing (#1994). target-seconds is the intended
        # test time per leg; it, not a constant shard count, sets N.
        # Raising the seed's coverage (from the uploaded -json artifacts)
        # is what makes the pack converge on real runtime.
        run: |
          python3 pkgs/mcpx/scripts/ci/e2e-shard-packer.py \
            --tests-dir pkgs/mcpx/internal/e2e \
            --timings pkgs/mcpx/scripts/ci/e2e-timings.json \
            --target-seconds 170 \
            --max-shards 6

  unit:
    name: "basic: mcpx-test unit"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum
      - name: Affected-test selector regressions
        run: python3 -m unittest discover -s pkgs/mcpx/scripts/tests -p 'test_affected_untracked.py' -v
      # Same runtimes as mcpx.yml's test job: non-e2e packages (examples)
      # shell out to deno/bun/node too, and a missing runtime reads as a
      # test failure (first run of this workflow, PR #2888).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests (everything except internal/e2e)
        working-directory: pkgs/mcpx
        run: |
          # Intentional word splitting: $pkgs is a newline-separated package list
          # from go list and must split into separate go test arguments --
          # quoting it would pass the whole list as a single bogus package name
          # (per-line directive below; actionlint's prepended `set` line defeats
          # a single block-top directive).
          pkgs=$(go list ./... | grep -v '/internal/e2e$')
          echo "unit packages:"; echo "$pkgs"
          # shellcheck disable=SC2086
          go test $pkgs -count=1

  lint:
    name: "basic: mcpx-test lint"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum
      - name: gofmt (must print nothing) and go vet
        working-directory: pkgs/mcpx
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -l is not empty:"; echo "$unformatted"; exit 1
          fi
          go vet ./...


  plugin-ts:
    name: "basic: mcpx-test plugin-ts"
    if: github.event_name != pull_request || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # #5151: lint + type-check coverage for the mcpx-owned TypeScript
      # plugin sources (plugin/opencode/mcpx/), which the Go jobs and
      # the bun test suite never type-check. Toolchain is pinned
      # exactly in plugin/opencode/package.json + bun.lock: biome lint
      # under the repo-root biome.json (mcpx/biome.json extends it and
      # disables only noAssignInExpressions — daemon.ts parses Go
      # durations with the canonical while ((m = re.exec(s))) loop)
      # and tsc --noEmit under plugin/opencode/tsconfig.json (strict).
      # Deno was evaluated first (it is already in this workflow for
      # the Go legs):  fails on these sources inside its
      # tsc host, and  default rules flag the daemon wire
      # codes established patterns wholesale, so the repos existing
      # biome + tsc pair (id web, pm-stack aggregator) is the fit.
      - name: Install the pinned plugin check toolchain
        working-directory: pkgs/mcpx/plugin/opencode
        run: bun install --frozen-lockfile
      - name: Lint and type-check the plugin TypeScript
        working-directory: pkgs/mcpx/plugin/opencode
        run: bun run check

  e2e:
    name: "basic: mcpx-test e2e (shard ${{ matrix.shard }})"
    needs: init
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: E2E shard ${{ matrix.shard }} (${{ matrix.count }} tests)
        working-directory: pkgs/mcpx
        env:
          RUN_PATTERN: ${{ matrix.run }}
          SHARD: ${{ matrix.shard }}
          EXPECTED_COUNT: ${{ matrix.count }}
        run: |
          echo "go test ./internal/e2e -run '^($RUN_PATTERN)$' -count=1 -json"
          set +e
          go test ./internal/e2e -run "^($RUN_PATTERN)$" -count=1 -json \
            > "$RUNNER_TEMP/e2e-shard-${SHARD}.json"
          rc=$?
          set -e
          # The -json stream is both the CI log's timing record and the
          # artifact the next seed refresh reads (#1994).
          python3 - "$RUNNER_TEMP/e2e-shard-${SHARD}.json" <<'EOF'
          import json, os, sys
          names = set(os.environ["RUN_PATTERN"].split("|"))
          elapsed, passed, failed = 0.0, 0, 0
          with open(sys.argv[1], errors="replace") as fh:
              for line in fh:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  # Top-level tests only: subtests (TestX/case) pass/fail
                  # events would otherwise double-count parent elapsed time
                  # and the assigned-test assertion.
                  if event.get("Action") not in ("pass", "fail"):
                      continue
                  if event.get("Test") not in names:
                      continue
                  elapsed += float(event.get("Elapsed", 0) or 0)
                  passed += event["Action"] == "pass"
                  failed += event["Action"] == "fail"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = (f"shard {os.environ.get('SHARD')}: {passed + failed} tests reported "
                  f"({passed} pass, {failed} fail), {elapsed:.1f}s of test time "
                  f"(expected {os.environ.get('EXPECTED_COUNT')} tests)")
          print(text)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"- {text}\n")
          if passed + failed == 0:
              raise SystemExit("shard ran no tests: the generated regex matched nothing")
          if passed + failed != int(os.environ.get("EXPECTED_COUNT", "0")):
              raise SystemExit("shard test count differs from the init assignment")
          EOF
          exit $rc
      - name: Upload per-test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcpx-e2e-timings-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Surviving mcpx daemons
        if: always()
        run: |
          count=$(pgrep -c -x mcpx || true)
          echo "surviving mcpx daemon count: ${count:-0}"

  ci-ok:
    name: "mcpx-test ci-ok"
    needs: [init, unit, lint, plugin-ts, e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail if any leg failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k for k, v in needs.items() if v.get("result") != "success"))')
          if [ -n "$bad" ]; then
            echo "legs not successful: $bad"; exit 1
          fi
          echo "all legs succeeded"
      - name: Print the #140 measurement table
        # Step-level always(): the job-level `always()` does not override
        # a step's default success() condition, so the failing gate above
        # would skip this step on exactly the red runs whose timings the
        # #140 baseline needs (Codex P2). The gate keeps its exit 1 and
        # the job conclusion stays failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.json" <<'EOF'
          import json, os, subprocess, sys
          from datetime import datetime
          def ts(v):
              return datetime.fromisoformat(v.replace("Z", "+00:00")) if v else None
          run = json.load(open(sys.argv[1]))
          # The Jobs API has no job-level created_at; queue time is
          # measured from the workflow run's created_at to each leg's
          # start (run-to-start), the approach mcpx.yml's budget job
          # already uses (Codex P2).
          run_created = ts(run.get("created_at"))
          jobs = json.load(open(sys.argv[2]))["jobs"]
          def completed(job_list):
              # ci-ok itself is the aggregator, never a measured leg.
              return [j for j in job_list
                      if j["name"] != "mcpx-test ci-ok"
                      and ts(j.get("started_at")) and ts(j.get("completed_at"))]
          done = completed(jobs)
          if not done:
              # "Re-run failed jobs" starts a new attempt holding only
              # the failed jobs (here: ci-ok itself), so this attempt
              # has no completed upstream legs. Fall back to retained
              # results from all attempts, keeping each job's most
              # recently completed entry (Codex P2; same fallback as
              # mcpx.yml's budget job).
              repo = os.environ["GITHUB_REPOSITORY"]
              try:
                  out = subprocess.run(
                      ["gh", "api",
                       f"repos/{repo}/actions/runs/{run['id']}/jobs?filter=all&per_page=100"],
                      capture_output=True, text=True, check=True).stdout
              except Exception:
                  out = '{"jobs": []}'
              by_name = {}
              for j in json.loads(out)["jobs"]:
                  e = ts(j.get("completed_at"))
                  if e and (j["name"] not in by_name
                            or e > ts(by_name[j["name"]]["completed_at"])):
                      by_name[j["name"]] = j
              done = completed(list(by_name.values()))
          if not done:
              text = "| metric | value |\n| --- | --- |\n| all metrics | n/a (no completed legs found in any attempt) |"
          else:
              e2e = [j for j in done if "e2e (shard" in j["name"]]
              wall = (max(ts(j["completed_at"]) for j in done)
                      - min(ts(j["started_at"]) for j in done)).total_seconds()
              span = (max(ts(j["completed_at"]) for j in e2e)
                      - min(ts(j["started_at"]) for j in e2e)).total_seconds() if e2e else 0
              longest = max(((ts(j["completed_at"]) - ts(j["started_at"])).total_seconds(), j["name"]) for j in done)
              queues = [((ts(j["started_at"]) - run_created).total_seconds(), j["name"]) for j in done if run_created]
              table = [
                  "| metric | value |",
                  "| --- | --- |",
                  f"| wall (first start to last finish, finished legs) | {wall:.0f}s |",
                  f"| matrix span (e2e shards) | {span:.0f}s |",
                  f"| longest leg | {longest[1]} \u2014 {longest[0]:.0f}s |",
                  f"| queue max (run created to leg start) | {max(q for q, _ in queues):.0f}s |" if queues else "| queue max (run created to leg start) | n/a |",
                  f"| queue sum (run created to leg start) | {sum(q for q, _ in queues):.0f}s |" if queues else "| queue sum (run created to leg start) | n/a |",
              ]
              text = "\n".join(table)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## mcpx-test measurement (#140)\n\n" + text + "\n")
          EOF
