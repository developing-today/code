name: mcpx docs

# CI tier policy: see .github/ci-policy.md

# Build the mcpx book (#1941, Approach C) and publish it to GitHub Pages.
#
# Builds run on pushes to main and on manual dispatch — there is no
# pull-request build (the sibling docs workflows, fleet-docs.yml,
# atlas-docs.yml and id-docs.yml, are shaped the same way). Pushes and
# dispatches deploy the build to Pages via the Actions artifact flow:
# Pages source for this repository is "GitHub Actions"
# (build_type=workflow), no generated HTML is ever committed, and no
# extra repository or secret is needed.
#
# The build is the flake output .#mcpx-docs (pkgs/mcpx/docs.nix, from
# #1939 / PR #2629): the same `nix build` locally and in CI. The
# derivation takes the base URL as its `siteUrl` argument, baked in as
# mdBook's site-url: plain builds use the default "/", the Pages
# deploy overrides it with "/code/" (the project site's path) — builds
# differ only in that one value (#1941).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "build: nix build .#mcpx-docs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          # Same cache posture as mcpx-nixbuild.yml (#2120): no
          # FlakeHub, the GitHub Actions cache is the cache.
          use-flakehub: false
          use-gha-cache: true

      - name: Nix build
        run: nix build .#mcpx-docs --print-build-logs

      # The nix result is a symlink into the store; copy it dereferenced
      # so the artifact is a plain static site tree.
      - name: Stage site
        run: |
          rm -rf site
          cp -rL result site
          test -f site/index.html

      # The derivation already gates on twin currency (docs-twins
      # check runs inside .#mcpx-docs); assert the agent surface is
      # visibly present in the staged site too (#1947).
      - name: Verify agent twins in staged site
        run: |
          test -f site/llms.txt
          test -f site/llms-full.txt
          test -f site/index.html.md
          grep -q 'rel="alternate" type="text/markdown"' site/index.html

  deploy:
    name: "stage: build + upload Pages artifact"
    # Deploys only from main: pushes to main and manual dispatches
    # (a dispatch on a non-main ref is refused here rather than
    # publishing a branch build).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          use-flakehub: false
          use-gha-cache: true

      # The deployed book is served from the project Pages path
      # (https://developing-today.github.io/code/), and mdBook needs
      # that path as its site-url: with "/" the generated 404 page
      # points its CSS/JS and navigation at the domain root and breaks.
      # Same derivation as the build job, differing only in the siteUrl
      # argument (#1941).
      - name: Nix build (deploy variant, siteUrl /code/)
        run: |
          # Intentional: the single-quoted string in this block is a Nix expression
          # evaluated by nix, not the shell -- ${builtins.currentSystem} in it is
          # Nix's, and letting the shell expand it would break the build.
          # shellcheck disable=SC2016
          nix build --impure --print-build-logs --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.mcpx-docs.override { siteUrl = "/code/"; }'

      - name: Stage site
        run: |
          rm -rf site
          cp -rL result site
          test -f site/index.html

      # The fleet book (#13165, pkgs/fleet/book) shares this
      # repository's single Pages site: a deployment replaces the
      # whole site, so the fleet book is built with its own siteUrl
      # and staged under fleet/ here, in the same deploy — a separate
      # fleet-only deploy would wipe the mcpx book. Its build-only
      # workflow is fleet-docs.yml; see the book's "Deploying this
      # book" chapter (pkgs/fleet/book/operations/deploying-this-book.md).
      - name: Nix build (fleet book, siteUrl /code/fleet/)
        run: |
          # Intentional: the single-quoted string in this block is a Nix expression
          # evaluated by nix, not the shell -- ${builtins.currentSystem} in it is
          # Nix's, and letting the shell expand it would break the build.
          # shellcheck disable=SC2016
          nix build --impure --print-build-logs --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.fleet-docs.override { siteUrl = "/code/fleet/"; }' \
            --out-link result-fleet-docs

      - name: Stage fleet book into site/fleet
        run: |
          rm -rf site/fleet
          # site/ is a copy of a Nix store path: its directories are
          # read-only, so make the root writable before adding fleet/.
          chmod u+w site
          cp -rL result-fleet-docs site/fleet
          test -f site/fleet/index.html

      # The atlas book (#13251, pkgs/atlas-search/book) shares this
      # repository's single Pages site the same way: built with its
      # own siteUrl and staged under atlas/ here, in the same deploy
      # — a separate atlas-only deploy would wipe the mcpx and fleet
      # books. Its build-only workflow is atlas-docs.yml; see the
      # book's "Deploying this book" chapter
      # (pkgs/atlas-search/book/operations/deploying-this-book.md).
      - name: Nix build (atlas book, siteUrl /code/atlas/)
        run: |
          # Intentional: the single-quoted string in this block is a Nix expression
          # evaluated by nix, not the shell -- ${builtins.currentSystem} in it is
          # Nix's, and letting the shell expand it would break the build.
          # shellcheck disable=SC2016
          nix build --impure --print-build-logs --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.atlas-docs.override { siteUrl = "/code/atlas/"; }' \
            --out-link result-atlas-docs

      - name: Stage atlas book into site/atlas
        run: |
          rm -rf site/atlas
          # site/ is a copy of a Nix store path: its directories are
          # read-only, so make the root writable before adding atlas/.
          chmod u+w site
          cp -rL result-atlas-docs site/atlas
          test -f site/atlas/index.html

      # The id book (#13332, pkgs/id/book) shares this
      # repository's single Pages site the same way: built with its
      # own siteUrl and staged under id/ here, in the same deploy
      # — a separate id-only deploy would wipe the mcpx, fleet and
      # atlas books. Its build-only workflow is id-docs.yml; see
      # the book's "Deploying this book" chapter
      # (pkgs/id/book/operations/deploying-this-book.md).
      - name: Nix build (id book, siteUrl /code/id/)
        run: |
          # Intentional: the single-quoted string in this block is a Nix expression
          # evaluated by nix, not the shell -- ${builtins.currentSystem} in it is
          # Nix's, and letting the shell expand it would break the build.
          # shellcheck disable=SC2016
          nix build --impure --print-build-logs --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.id-docs.override { siteUrl = "/code/id/"; }' \
            --out-link result-id-docs

      - name: Stage id book into site/id
        run: |
          rm -rf site/id
          # site/ is a copy of a Nix store path: its directories are
          # read-only, so make the root writable before adding id/.
          chmod u+w site
          cp -rL result-id-docs site/id
          test -f site/id/index.html

      # The Project Management book (#13900, pm-stack/book) shares
      # this repository's single Pages site the same way: built with
      # its own siteUrl and staged under pm/ here, in the same deploy
      # — a separate pm-only deploy would wipe the mcpx, fleet, atlas
      # and id books. Its build-only workflow is pm-docs.yml; see
      # the book's "Deploying this book" chapter
      # (pm-stack/book/operations/deploying-this-book.md).
      - name: Nix build (PM book, siteUrl /code/pm/)
        run: |
          # Intentional: the single-quoted string in this block is a Nix expression
          # evaluated by nix, not the shell -- ${builtins.currentSystem} in it is
          # Nix's, and letting the shell expand it would break the build.
          # shellcheck disable=SC2016
          nix build --impure --print-build-logs --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.pm-docs.override { siteUrl = "/code/pm/"; }' \
            --out-link result-pm-docs

      - name: Stage PM book into site/pm
        run: |
          rm -rf site/pm
          # site/ is a copy of a Nix store path: its directories are
          # read-only, so make the root writable before adding pm/.
          chmod u+w site
          cp -rL result-pm-docs site/pm
          test -f site/pm/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # The publish step lives in its own job, separate from the upload
  # (#10956): deploy-pages fetches the "github-pages" artifact metadata
  # as its first act, and when it ran ~1s after upload-pages-artifact
  # finalized in the same job, the metadata had not always propagated
  # ("Found 0 artifact(s)" — runs 44014450921 and 44066621783, with
  # successful runs interleaved). A job boundary puts runner teardown,
  # scheduling and startup between the upload and the fetch, which is
  # the window the metadata needs; the conditional retry below covers
  # a propagation delay longer than that.
  publish:
    name: "publish: GitHub Pages"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialise deploys: two deploys must never interleave, and a queued
    # deploy is never cancelled by a later one (#1941).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for artifact metadata to propagate (retry gate)
        if: failure() && steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
