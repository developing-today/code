# pm-scheduled — the fleet's single scheduled-agents runner.
#
# This reusable workflow is the ONE place the fleet's scheduled
# agents are defined. The callers are the thin per-repo `agents.yml`
# files in each fleet repo: they carry only triggers (their cron
# lines, workflow_dispatch, ...) and pass the fired schedule (or an
# explicit task list) through to this workflow. Nothing else about
# the scheduled agents lives in the callers.
#
# To add a common task:
#   1. Add its prompt to the pm-dispatch-task prompt library
#      (.github/actions/pm-dispatch-task/prompts/<task>.md in this
#      repo).
#   2. Add ONE step for it to THE LIST in this workflow's job below.
#   3. Add a cron line to a repo's agents.yml ONLY if the task needs
#      a time that repo doesn't already trigger.
# No caller changes are needed for steps 1-2.
#
# The slot table in the shared resolver is the single place where
# schedule -> tasks mapping lives.
name: pm-scheduled

on:
  workflow_call:
    inputs:
      schedule:
        description: "The cron expression that fired in the caller (usually github.event.schedule). Mapped to a task list by the shared resolver; empty or unknown schedules run all tasks."
        type: string
        required: false
        default: ""
      tasks:
        description: 'Explicit comma-separated task list (e.g. "bolt,palette"). Non-empty input is validated and each token is trimmed; the slot table is not consulted.'
        type: string
        required: false
        default: ""
      repo:
        description: "Target repo (owner/name). Defaults to the caller's repository."
        type: string
        required: false
        default: ""
  workflow_dispatch:

jobs:
  # Exactly one job. Permissions are the CALLER's: a reusable
  # workflow runs with the calling job's token, so this workflow
  # declares no permissions of its own. Callers grant:
  #   permissions:
  #     id-token: write   # pm-dispatch-task mints an OIDC token
  #     contents: read
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The pm-dispatch action family is loaded from this checkout
      # rather than as `developing-today/code/.github/actions/...@main`.
      # The remote form made the runner download the whole
      # developing-today/code repo as an action archive, which fails
      # with `Could not find file .../_staging/code-<sha>/archive`
      # (issue #4742; same failure and fix as issue #4867 in
      # main-broken.yml). A local action path is resolved from the
      # workspace and needs no action-repository download. The
      # checkout lands at .pm-central because pm-dispatch-task's own
      # nested steps load pm-dispatch-start / pm-dispatch-queue from
      # that same path (see that action's header note).
      #
      # The checkout is pinned to the commit this workflow file was
      # read from, not to main (#15764). A caller that pins
      # pm-scheduled.yml@<sha> then also pins the resolver script and
      # the dispatch actions this job runs, and a push to main cannot
      # change what a pinned caller executes under its own token. The
      # pin is self-referential: it follows whatever revision of this
      # file runs, so it never needs a manual bump.
      #
      # The `github` context belongs to the caller in a reusable
      # workflow, so github.sha cannot name this file's commit. The
      # job's OIDC token can: its job_workflow_ref / job_workflow_sha
      # claims are set by GitHub to this workflow's own path and
      # commit. Callers already grant `id-token: write` (see above).
      # When this workflow runs directly (workflow_dispatch here),
      # github.workflow_ref names this file and github.sha is its
      # commit. With neither, the step fails closed rather than fall
      # back to a mutable ref.
      - name: Find the commit this workflow runs from
        id: self
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          self="developing-today/code/.github/workflows/pm-scheduled.yml@"

          if [ "${WORKFLOW_REF#"$self"}" != "$WORKFLOW_REF" ]; then
            ref="$WORKFLOW_REF"
            sha="$RUN_SHA"
          else
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::pm-scheduled needs the calling job to grant 'id-token: write' to pin its own checkout"
              exit 1
            fi
            token="$(curl -fsS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pm-scheduled-self-pin" | jq -r '.value')"
            echo "::add-mask::$token"
            # The claims are the JWT's middle segment, base64url without padding.
            payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
            claims="$(printf '%s' "$payload" | base64 -d)"
            ref="$(printf '%s' "$claims" | jq -r '.job_workflow_ref // empty')"
            sha="$(printf '%s' "$claims" | jq -r '.job_workflow_sha // empty')"
          fi

          if [ "${ref#"$self"}" = "$ref" ]; then
            echo "::error::unexpected workflow ref '$ref'; refusing to check out an unpinned revision"
            exit 1
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::workflow commit '$sha' is not a full commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pm-scheduled runs from $ref at $sha"

      - name: Check out the pm-dispatch actions (central)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: developing-today/code
          ref: ${{ steps.self.outputs.sha }}
          path: .pm-central
          persist-credentials: false

      - name: Resolve the target repo and the task list
        id: resolve
        shell: bash
        env:
          INPUT_SCHEDULE: ${{ inputs.schedule }}
          INPUT_TASKS: ${{ inputs.tasks }}
          INPUT_REPO: ${{ inputs.repo }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Effective repo: the explicit input wins; otherwise the
          # repository that called this workflow.
          repo="$INPUT_REPO"
          if [ -z "$repo" ]; then
            repo="$CALLER_REPO"
          fi

          # Resolve and validate the task list before writing any step
          # outputs. The shared resolver keeps dispatch input handling
          # contract-tested; its nonzero exit aborts this step.
          resolved="$(bash .pm-central/.github/scripts/resolve-pm-scheduled-tasks.sh \
            "$INPUT_SCHEDULE" "$INPUT_TASKS")"
          tasks="$(printf '%s\n' "$resolved" | sed -n 's/^tasks=//p')"

          {
            echo "repo=$repo"
            printf '%s\n' "$resolved"
          } >> "$GITHUB_OUTPUT"
          echo "pm-scheduled resolve: repo=$repo schedule='${INPUT_SCHEDULE}' tasks=$tasks"

      # ==========================================================
      # THE LIST — one step per common task.
      #
      # Adding a common task = one step here (gated on a resolve
      # output, following the pattern of the steps below) + its
      # prompt in the pm-dispatch-task prompt library. Zero caller
      # changes.
      # ==========================================================

      - name: Dispatch bolt
        id: bolt
        if: steps.resolve.outputs.has_bolt == 'true'
        uses: ./.pm-central/.github/actions/pm-dispatch-task
        with:
          task: bolt
          repo: ${{ steps.resolve.outputs.repo }}

      - name: Dispatch palette
        id: palette
        if: steps.resolve.outputs.has_palette == 'true'
        uses: ./.pm-central/.github/actions/pm-dispatch-task
        with:
          task: palette
          repo: ${{ steps.resolve.outputs.repo }}

      - name: Dispatch suggestions
        id: suggestions
        if: steps.resolve.outputs.has_suggestions == 'true'
        uses: ./.pm-central/.github/actions/pm-dispatch-task
        with:
          task: suggestions
          repo: ${{ steps.resolve.outputs.repo }}

      - name: Summarize the dispatched tasks
        if: always()
        shell: bash
        env:
          RESOLVED_REPO: ${{ steps.resolve.outputs.repo }}
          RESOLVED_TASKS: ${{ steps.resolve.outputs.tasks }}
          BOLT_TASK_ID: ${{ steps.bolt.outputs.task_id }}
          BOLT_SESSION_ID: ${{ steps.bolt.outputs.session_id }}
          BOLT_ISSUE_NUMBER: ${{ steps.bolt.outputs.issue_number }}
          BOLT_ISSUE_URL: ${{ steps.bolt.outputs.issue_url }}
          PALETTE_TASK_ID: ${{ steps.palette.outputs.task_id }}
          PALETTE_SESSION_ID: ${{ steps.palette.outputs.session_id }}
          PALETTE_ISSUE_NUMBER: ${{ steps.palette.outputs.issue_number }}
          PALETTE_ISSUE_URL: ${{ steps.palette.outputs.issue_url }}
          SUGGESTIONS_TASK_ID: ${{ steps.suggestions.outputs.task_id }}
          SUGGESTIONS_SESSION_ID: ${{ steps.suggestions.outputs.session_id }}
          SUGGESTIONS_ISSUE_NUMBER: ${{ steps.suggestions.outputs.issue_number }}
          SUGGESTIONS_ISSUE_URL: ${{ steps.suggestions.outputs.issue_url }}
        run: |
          set -euo pipefail
          # A skipped task step leaves all of its outputs blank;
          # they are reported blank here, exactly as passed in.
          {
            echo "## pm-scheduled — ${RESOLVED_REPO}"
            echo ""
            echo "Resolved tasks: ${RESOLVED_TASKS}"
            echo ""
            echo "| Task | task_id | session_id | issue_number | issue_url |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| bolt | ${BOLT_TASK_ID} | ${BOLT_SESSION_ID} | ${BOLT_ISSUE_NUMBER} | ${BOLT_ISSUE_URL} |"
            echo "| palette | ${PALETTE_TASK_ID} | ${PALETTE_SESSION_ID} | ${PALETTE_ISSUE_NUMBER} | ${PALETTE_ISSUE_URL} |"
            echo "| suggestions | ${SUGGESTIONS_TASK_ID} | ${SUGGESTIONS_SESSION_ID} | ${SUGGESTIONS_ISSUE_NUMBER} | ${SUGGESTIONS_ISSUE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pm-scheduled summary written for repo=${RESOLVED_REPO} tasks=${RESOLVED_TASKS}"
