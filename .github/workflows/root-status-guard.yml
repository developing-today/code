name: root-status-guard

# Repo-root status-file guard (#12136): no file at the repository
# root may be named *COMPLETE* / *SUMMARY* - those are one-shot
# status documents that go stale on landing. Pure bash - no nix, no
# toolchain - so this stays a seconds-long basic check.

on:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-status-guard-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  root-status-guard:
    name: "basic: root status files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard passes on this tree (#12136)
        run: bash .github/scripts/check-root-status-files.sh
      - name: Guard contract tests (#12136)
        run: bash .github/scripts/check-root-status-files.test.sh
