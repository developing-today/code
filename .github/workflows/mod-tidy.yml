name: Go Mod Tidy

on:
  push:
    branches: [main]
    paths:
      - "pkgs/graph/**"
      - ".github/workflows/mod-tidy.yml"
  pull_request:
    paths:
      - "pkgs/graph/**"
      - ".github/workflows/mod-tidy.yml"

permissions:
  contents: write

jobs:
  tidy:
    name: Go module tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/graph/go.mod
          cache-dependency-path: pkgs/graph/go.sum

      - name: Tidy Go module
        working-directory: pkgs/graph
        run: go mod tidy -compat=1.17

      - name: Verify tidy changes are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- pkgs/graph/go.mod pkgs/graph/go.sum

      - name: Commit tidy changes on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pkgs/graph/go.mod pkgs/graph/go.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/graph/go.mod pkgs/graph/go.sum
          git commit -m "chore(graph): tidy Go module"
          git push origin "HEAD:${GITHUB_REF}"
