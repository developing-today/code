name: Go Mod Tidy

on:
  push:
    branches: [main]
    paths:
      - "pkgs/graph/**"
      - ".github/workflows/mod-tidy.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tidy:
    name: "basic: Go module tidy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/graph/go.mod
          cache-dependency-path: pkgs/graph/go.sum

      - name: Tidy Go module
        working-directory: pkgs/graph
        run: go mod tidy -compat=1.17

      - name: Verify tidy changes are committed
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --short --untracked-files=all -- pkgs/graph/go.mod pkgs/graph/go.sum)" ]]; then
            echo "go mod tidy changed go.mod or go.sum; commit the tidy changes."
            git status --short --untracked-files=all -- pkgs/graph/go.mod pkgs/graph/go.sum
            exit 1
          fi

      - name: Commit tidy changes on main
        if: github.event_name == 'push'
        run: |
          if [[ -z "$(git status --short --untracked-files=all -- pkgs/graph/go.mod pkgs/graph/go.sum)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/graph/go.mod pkgs/graph/go.sum
          git commit -m "chore(graph): tidy Go module"
          git push origin "HEAD:${GITHUB_REF}"
