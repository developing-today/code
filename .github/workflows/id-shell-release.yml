name: id shell release

# CI tier policy: see .github/ci-policy.md
#
# Per-app, per-platform release snapshot for the id shells (#12819; design
# doc/2026-11-23T03-17-14Z_design_more_shells_v2/, follow-on slice 3). The
# Q3 ruling on #6297 is per-platform releases with granular tags per app
# and platform, so one dispatch covers one shell on one platform:
#   tag scheme <app>/<platform>/v<version>, e.g. id-native-shell/linux-x86_64/v0.1.0
#
# .github/scripts/id-shell-release.sh does the work: the shell's gate (its
# test check and the shell conformance suite), the flake package build, and
# the packaged closure with checksums. This workflow uploads that as a
# workflow artifact. It never creates a tag or a release: tag-push releases
# are disabled by the owner (2026-11-13, ci-policy.md), and publishing joins
# release-gate.sh when that is re-armed.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Shell to release"
        required: true
        default: id-native-shell
        type: choice
        options:
          - id-native-shell
      platform:
        description: "Target platform"
        required: true
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.app }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: "release: id shell snapshot"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            fallback = true

      - name: Gate, build and package
        env:
          APP: ${{ inputs.app }}
          PLATFORM: ${{ inputs.platform }}
        run: bash .github/scripts/id-shell-release.sh "$APP" "$PLATFORM" dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-${{ inputs.platform }}
          path: dist/
          if-no-files-found: error
