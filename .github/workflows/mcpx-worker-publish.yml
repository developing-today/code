name: mcpx worker publish

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Confirm upload of a mcpx Worker version from main
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcpx-worker-lifecycle
  cancel-in-progress: false

jobs:
  publish-version:
    if: github.ref == 'refs/heads/main' && inputs.confirm_upload
    name: Upload mcpx Worker Version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mcpx-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: pkgs/mcpx/worker/package-lock.json
      - name: Install pinned cf CLI
        working-directory: pkgs/mcpx/worker
        run: npm ci --no-audit --no-fund
      - name: Run Worker tests
        working-directory: pkgs/mcpx/worker
        run: npm test
      - name: Validate Worker build without credentials
        working-directory: pkgs/mcpx/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node upload-version.mjs --dry-run
      - name: Stage Worker secrets file
        env:
          BRIDGE_ACCESS_CLIENT_ID: ${{ secrets.BRIDGE_ACCESS_CLIENT_ID }}
          BRIDGE_ACCESS_CLIENT_SECRET: ${{ secrets.BRIDGE_ACCESS_CLIENT_SECRET }}
          MACHINE_BEARER: ${{ secrets.MACHINE_BEARER }}
        run: |
          umask 077
          python3 - "$RUNNER_TEMP/mcpx-secrets.json" <<'PY'
          import json, os, sys
          data = {
              "ACCESS_CLIENT_ID": os.environ["BRIDGE_ACCESS_CLIENT_ID"],
              "ACCESS_CLIENT_SECRET": os.environ["BRIDGE_ACCESS_CLIENT_SECRET"],
              "MACHINE_BEARER": os.environ["MACHINE_BEARER"],
          }
          if not all(data.values()):
              raise SystemExit("Worker secrets are empty")
          with open(sys.argv[1], "w") as f:
              json.dump(data, f)
          PY
      - name: Upload Worker Version and capture provenance
        working-directory: pkgs/mcpx/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MCPX_WORKER_CF_TOKEN: ${{ secrets.MCPX_WORKER_CF_TOKEN }}
          MCPX_WORKER_SECRETS_FILE: ${{ runner.temp }}/mcpx-secrets.json
          MCPX_WORKER_PROVENANCE_FILE: ${{ runner.temp }}/mcpx-worker-provenance.json
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node upload-version.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpx-worker-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcpx-worker-provenance.json
          if-no-files-found: error
          retention-days: 90
