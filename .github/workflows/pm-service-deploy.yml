name: pm-service deploy

# CF-5c (#14969): build and test here, then upload a version stamped
# with the full commit SHA. This Worker implements a Durable Object,
# so Cloudflare does not provide a Version URL to health-gate before
# promotion. The workflow records the active version, promotes the
# candidate, checks production /health for the exact SHA, and restores
# the recorded version if the check fails. The first deploy stands the
# Worker up with a plain deploy (versions upload refuses a Worker that
# does not exist yet). A pending Durable Object migration is the other
# exception: versions upload cannot apply migrations, so the workflow
# uses a plain deploy and health-gates production directly. Manual
# rollback remains available through rollback_version.

on:
  push:
    branches: [main]
    paths:
      - "pm-stack/pm-service/**"
      - "pm-stack/platform/workers.json"
      - ".github/workflows/pm-service-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Promote this existing version id back to 100% instead of deploying this commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: pm-stack/pm-service
        run: bun install --frozen-lockfile
      - name: Test and type-check the Worker
        working-directory: pm-stack/pm-service
        run: |
          bun test
          bun run typecheck
      - name: Check deploy secrets are present
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Roll back to a previous version
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version != ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          # The input goes through the env, never into the script
          # text, and must look like a version id before it is used.
          if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "rollback_version is not a version id" >&2
            exit 2
          fi
          bunx wrangler versions deploy "${ROLLBACK_VERSION}@100" --yes \
            --message "rollback from workflow run ${GITHUB_RUN_ID}"
          echo "Put pm-service back to version ${ROLLBACK_VERSION}." >> "$GITHUB_STEP_SUMMARY"
      - name: Stand the Worker up if it does not exist yet
        id: standup
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pm-service")"
          if [ "$code" = "404" ]; then
            # versions upload refuses a Worker that does not exist
            # yet (first run of this workflow, 2026-11-25): stand
            # it up with a plain deploy of this commit, stamped
            # the same way; the health re-check below still gates
            # the run on the deployed version reporting this SHA.
            bunx wrangler deploy --var "VERSION:${GITHUB_SHA}" \
              --message "pm-service stand-up ${GITHUB_SHA}"
            echo "stood_up=true" >> "$GITHUB_OUTPUT"
            echo "Stood pm-service up from nothing at ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stood_up=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record the current version for rollback
        id: previous
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true'
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler deployments status --name pm-service --json > "$RUNNER_TEMP/current-deployment.json"
          previous_version_id="$(node scripts/active-version.mjs --file "$RUNNER_TEMP/current-deployment.json")"
          echo "version_id=$previous_version_id" >> "$GITHUB_OUTPUT"
          echo "Recorded current pm-service version ${previous_version_id} for rollback." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload this commit as a version
        id: upload
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true'
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          bunx wrangler versions upload --var "VERSION:${GITHUB_SHA}" \
            --message "pm-service ${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ] && grep -Eq 'pending Durable Object migration|must be applied with `wrangler deploy`' "$RUNNER_TEMP/upload.log"; then
            # versions upload cannot apply DO migrations (run
            # 45905665485): apply this commit with a plain deploy,
            # which applies the pending migration, stamped the same
            # way. Production serves it at once, so there is no
            # version to promote; the final health step still gates
            # the run on production reporting this SHA.
            bunx wrangler deploy --var "VERSION:${GITHUB_SHA}" \
              --message "pm-service migration ${GITHUB_SHA}"
            echo "migrated=true" >> "$GITHUB_OUTPUT"
            echo "Applied the pending Durable Object migration with a plain deploy of ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "migrated=false" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "wrangler versions upload failed" >&2
            exit "$status"
          fi
          version_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "could not read a version id from the upload output" >&2
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          # Cloudflare does not create Version URLs for Workers that
          # implement Durable Objects. The exact-SHA health check runs
          # after promotion, with the previous deployment captured above
          # and restored below if production does not report this SHA.
          echo "Uploaded pm-service version ${version_id}; health-gating production after promotion because this Worker uses a Durable Object." >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the uploaded version before health-gating production
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true' && steps.upload.outputs.migrated != 'true'
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100" --yes \
            --message "deploy ${GITHUB_SHA} from workflow run ${GITHUB_RUN_ID}"
          echo "Promoted pm-service version ${{ steps.upload.outputs.version_id }} (${GITHUB_SHA})." >> "$GITHUB_STEP_SUMMARY"
      - name: Require the deployed health version to match this commit
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        run: >-
          node scripts/check-health.mjs
          --url https://pm-service.developing-today.workers.dev/health
          --version "$GITHUB_SHA"
      - name: Restore previous version if the health gate fails
        if: failure() && steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true' && steps.upload.outputs.migrated != 'true' && steps.upload.outputs.version_id != '' && steps.previous.outputs.version_id != ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: |
          set -euo pipefail
          bunx wrangler versions deploy "${PREVIOUS_VERSION_ID}@100" --yes \
            --message "rollback after failed health gate for ${GITHUB_SHA}"
          bunx wrangler deployments status --name pm-service --json > "$RUNNER_TEMP/rollback-deployment.json"
          rolled_back_version_id="$(node scripts/active-version.mjs --file "$RUNNER_TEMP/rollback-deployment.json")"
          if [ "$rolled_back_version_id" != "$PREVIOUS_VERSION_ID" ]; then
            echo "rollback expected ${PREVIOUS_VERSION_ID} but active version is ${rolled_back_version_id}" >&2
            exit 1
          fi
          echo "Restored pm-service version ${PREVIOUS_VERSION_ID} after the health gate failed." >> "$GITHUB_STEP_SUMMARY"
