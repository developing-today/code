name: pm-service deploy

# CF-5c (#14969): the pm-service Worker (the hosted read API over
# the tenant plane's Turso DB) deploys by the design §4 versions
# standard — build and test here, upload as a new version stamped
# with the full commit SHA, health-gate that version on its
# preview URL (/health must report the exact SHA), then promote
# with versions deploy. A failed gate leaves the previous version
# serving. The very first deploy stands the Worker up with a plain
# deploy (versions upload refuses a Worker that does not exist
# yet); every later deploy takes the versions path. Rollback is a
# versions operation: dispatch with
# rollback_version set to a previous version id to promote it
# back (the pm-console-edge input shape). A pending Durable Object
# migration is the second deploy-shaped exception: versions upload
# cannot apply migrations, so when the upload refuses with a
# pending-migration error the workflow applies this commit with a
# plain deploy (which applies the migration) and health-gates
# production directly; later commits return to the versions path.

on:
  push:
    branches: [main]
    paths:
      - "pm-stack/pm-service/**"
      - "pm-stack/platform/workers.json"
      - ".github/workflows/pm-service-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Promote this existing version id back to 100% instead of deploying this commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: pm-stack/pm-service
        run: bun install --frozen-lockfile
      - name: Test and type-check the Worker
        working-directory: pm-stack/pm-service
        run: |
          bun test
          bun run typecheck
      - name: Check deploy secrets are present
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Roll back to a previous version
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version != ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          # The input goes through the env, never into the script
          # text, and must look like a version id before it is used.
          if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "rollback_version is not a version id" >&2
            exit 2
          fi
          bunx wrangler versions deploy "${ROLLBACK_VERSION}@100" --yes \
            --message "rollback from workflow run ${GITHUB_RUN_ID}"
          echo "Put pm-service back to version ${ROLLBACK_VERSION}." >> "$GITHUB_STEP_SUMMARY"
      - name: Stand the Worker up if it does not exist yet
        id: standup
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pm-service")"
          if [ "$code" = "404" ]; then
            # versions upload refuses a Worker that does not exist
            # yet (first run of this workflow, 2026-11-25): stand
            # it up with a plain deploy of this commit, stamped
            # the same way; the health re-check below still gates
            # the run on the deployed version reporting this SHA.
            bunx wrangler deploy --var "VERSION:${GITHUB_SHA}" \
              --message "pm-service stand-up ${GITHUB_SHA}"
            echo "stood_up=true" >> "$GITHUB_OUTPUT"
            echo "Stood pm-service up from nothing at ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stood_up=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload this commit as a version and health-gate it
        id: upload
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true'
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          bunx wrangler versions upload --var "VERSION:${GITHUB_SHA}" \
            --message "pm-service ${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ] && grep -Eq 'pending Durable Object migration|must be applied with `wrangler deploy`' "$RUNNER_TEMP/upload.log"; then
            # versions upload cannot apply DO migrations (run
            # 45905665485): apply this commit with a plain deploy,
            # which applies the pending migration, stamped the same
            # way. Production serves it at once, so there is no
            # version to promote; the final health step still gates
            # the run on production reporting this SHA.
            bunx wrangler deploy --var "VERSION:${GITHUB_SHA}" \
              --message "pm-service migration ${GITHUB_SHA}"
            echo "migrated=true" >> "$GITHUB_OUTPUT"
            echo "Applied the pending Durable Object migration with a plain deploy of ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "migrated=false" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "wrangler versions upload failed" >&2
            exit "$status"
          fi
          version_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "could not read a version id from the upload output" >&2
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          # The version's preview URL answers before promotion, so
          # the gate runs against the candidate, not production.
          # Prefer the URL from wrangler's own output when it prints
          # one; the preview host carries only the version id's first
          # segment (run 45605143016 built the full-id host, got an
          # HTML error page, and the gate correctly refused to
          # promote). Wrangler 4.168.0 omits the Preview URL line on
          # a successful upload (run 45952287379), so fall back to
          # constructing the first-segment host via the account
          # subdomain rather than failing the gate (issue #15969).
          preview_url="$(grep -Eo 'Version Preview URL: https://[^ ]+' "$RUNNER_TEMP/upload.log" | sed 's/.*: //' | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            short="${version_id%%-*}"
            sub="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
            if [ -z "$sub" ]; then
              echo "could not resolve the workers.dev subdomain for the preview URL fallback" >&2
              exit 1
            fi
            preview_url="https://${short}-pm-service.${sub}.workers.dev"
            echo "wrangler omitted the Version Preview URL; using ${preview_url} (version ${version_id})." >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/check-health.mjs \
            --url "${preview_url}/health" \
            --version "$GITHUB_SHA"
      - name: Promote the gated version
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == '' && steps.standup.outputs.stood_up != 'true' && steps.upload.outputs.migrated != 'true'
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100" --yes \
            --message "deploy ${GITHUB_SHA} from workflow run ${GITHUB_RUN_ID}"
          echo "Promoted pm-service version ${{ steps.upload.outputs.version_id }} (${GITHUB_SHA})." >> "$GITHUB_STEP_SUMMARY"
      - name: Require the deployed health version to match this commit
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        run: >-
          node scripts/check-health.mjs
          --url https://pm-service.developing-today.workers.dev/health
          --version "$GITHUB_SHA"
