name: pm-service deploy

# CF-5c (#14969): the pm-service Worker (the hosted read API over
# the tenant plane's Turso DB) deploys by the design §4 versions
# standard — build and test here, upload as a new version stamped
# with the full commit SHA, health-gate that version on its
# preview URL (/health must report the exact SHA), then promote
# with versions deploy. A failed gate leaves the previous version
# serving. Rollback is a versions operation: dispatch with
# rollback_version set to a previous version id to promote it
# back (the pm-console-edge input shape).

on:
  push:
    branches: [main]
    paths:
      - "pm-stack/pm-service/**"
      - "pm-stack/platform/workers.json"
      - ".github/workflows/pm-service-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Promote this existing version id back to 100% instead of deploying this commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: pm-stack/pm-service
        run: bun install --frozen-lockfile
      - name: Test and type-check the Worker
        working-directory: pm-stack/pm-service
        run: |
          bun test
          bun run typecheck
      - name: Check deploy secrets are present
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Roll back to a previous version
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version != ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          # The input goes through the env, never into the script
          # text, and must look like a version id before it is used.
          if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "rollback_version is not a version id" >&2
            exit 2
          fi
          bunx wrangler versions deploy "${ROLLBACK_VERSION}@100" --yes \
            --message "rollback from workflow run ${GITHUB_RUN_ID}"
          echo "Put pm-service back to version ${ROLLBACK_VERSION}." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload this commit as a version and health-gate it
        id: upload
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler versions upload --var "VERSION:${GITHUB_SHA}" \
            --message "pm-service ${GITHUB_SHA}" | tee "$RUNNER_TEMP/upload.log"
          version_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "could not read a version id from the upload output" >&2
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          # The version's preview URL answers before promotion, so
          # the gate runs against the candidate, not production.
          sub="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
          node scripts/check-health.mjs \
            --url "https://${version_id}-pm-service.${sub}.workers.dev/health" \
            --version "$GITHUB_SHA"
      - name: Promote the gated version
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100" --yes \
            --message "deploy ${GITHUB_SHA} from workflow run ${GITHUB_RUN_ID}"
          echo "Promoted pm-service version ${{ steps.upload.outputs.version_id }} (${GITHUB_SHA})." >> "$GITHUB_STEP_SUMMARY"
      - name: Require the deployed health version to match this commit
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        working-directory: pm-stack/pm-service
        run: >-
          node scripts/check-health.mjs
          --url https://pm-service.developing-today.workers.dev/health
          --version "$GITHUB_SHA"
