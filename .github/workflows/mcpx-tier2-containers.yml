name: mcpx tier-2 containers

# The tier-2 container legs for #1987: the static mcpx binary running in
# the minimal images (alpine, scratch, distroless) with the surfaces each
# image supports. Tier 2 means nightly + on-main verification, never a PR
# gate; this repo's workflows are main-only (see .github/ci-policy.md).
# The legs themselves live in pkgs/mcpx/scripts/tier2-containers.sh so
# they can be run locally with the same assertions CI makes.

on:
  push:
    branches: [main]
    paths:
      - "pkgs/mcpx/**"
      - ".github/workflows/mcpx-tier2-containers.yml"
  schedule:
    # Nightly, off the hour the other mcpx jobs favour.
    - cron: "37 5 * * *"
  workflow_dispatch:

# Same rule as mcpx.yml: a push run is never cancelled by a later merge —
# every merged tree gets its own completed verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: "tier2: shipped image runs mcpx"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build the shipped Nix image (#5771)
        run: nix build .#packages.x86_64-linux.mcpx-container --print-build-logs --out-link mcpx-image
      - name: The shipped image runs mcpx and executes a script
        run: |
          loaded=$(docker load -i mcpx-image | sed -n 's/^Loaded image: //p')
          test -n "$loaded"
          echo "loaded $loaded"
          docker run --rm "$loaded" --version
          docker run --rm "$loaded" exec 'console.log("tier2-shipped-ok")' | grep -q 'tier2-shipped-ok'

  legs:
    name: "tier2: ${{ matrix.leg }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg:
          - alpine-nonexec
          - alpine-bunmusl-exec
          - alpine-node-exec
          - scratch-nonexec
          - distroless-static-nonexec
          - distroless-cc-deno-exec
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum
      - name: Run the leg
        working-directory: pkgs/mcpx
        run: scripts/tier2-containers.sh "${{ matrix.leg }}"
