# Upload an immutable candidate only. Promotion is a separate approved workflow.
name: Voice line Worker upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-line-worker-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: voice-line-worker-upload
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install worker dependencies
        working-directory: pm-stack/voice-line-worker
        run: bun install --frozen-lockfile

      - name: Test offline worker and deployment contracts
        working-directory: pm-stack/voice-line-worker
        run: |
          bun test
          node --test test/deploy-contract.test.mjs
          bun run typecheck

      - name: Build the Worker with cf
        working-directory: pm-stack/voice-line-worker
        run: npm run cf:build

      - name: Upload an immutable Workers Version (no traffic change)
        working-directory: pm-stack/voice-line-worker
        run: npm run upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_VOICE_LINE_UPLOAD_TOKEN }}
