name: pm-stack tests

on:
  workflow_dispatch:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "17 7 * * *"
permissions:
  contents: read

jobs:
  provenance:
    name: "basic: aggregator provenance matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pm-stack/aggregator
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check provenance matrix
        run: bun run provenance:check

  test:
    name: aggregator + projector + dispatch + python suites + quota exporters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install aggregator dependencies
        working-directory: pm-stack/aggregator
        run: bun install --frozen-lockfile

      - name: Test aggregator
        working-directory: pm-stack/aggregator
        run: bun test

      - name: Install projector dependencies
        working-directory: pm-stack/projector
        run: bun install --frozen-lockfile

      - name: Test projector
        working-directory: pm-stack/projector
        run: bun test

      - name: Install dispatch dependencies
        working-directory: pm-stack/dispatch
        run: bun install --frozen-lockfile

      # Bun suite for #6090: pm-stack/dispatch/test/ (131 tests, incl.
      # the #4917 launch-failure compensation / orphan-cleanup pins in
      # launch_failure.test.ts) was run by no workflow. The test
      # directory is asserted to exist and hold *.test.ts files first,
      # so a green run cannot be a silently skipped suite; any failure
      # in the suite fails the job.
      - name: Test dispatch
        working-directory: pm-stack/dispatch
        run: |
          if [ ! -d test ] || ! ls test/*.test.ts >/dev/null 2>&1; then
            echo "::error::Missing dispatch test suite — pm-stack/dispatch/test has no *.test.ts files; the dispatch suite was not run."
            exit 1
          fi
          bun test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install the console's type-check tools
        working-directory: pm-stack/console/edge
        run: npm ci --no-audit --no-fund

      - name: Type-check the console
        working-directory: pm-stack/console/edge
        run: npx tsc --noEmit -p ../tsconfig.json

      - name: Test console
        working-directory: pm-stack/console
        run: |
          if [ ! -d test ] || ! ls test/*.test.ts >/dev/null 2>&1; then
            echo "::error::Missing console test suite — pm-stack/console/test has no *.test.ts files."
            exit 1
          fi
          bun test
          python3 -I -m unittest discover -s scripts -p 'test_*.py'

      # The list of Workers the PM app's Platform screen is drawn from
      # (pm-stack/platform/workers.json) is held to the repository: a
      # Worker added, moved or renamed without the list being told
      # fails here.
      - name: Test the list of Workers against the repository
        working-directory: pm-stack/platform
        run: bun test

      - name: Test seed and deploy/install scripts
        run: |
          bash pm-stack/scripts/seed-smoke.test.sh
          bash pm-stack/scripts/deploy-install-smoke.test.sh

      # pm-git-sync's clone hygiene (2026-11-20): untracked files in
      # ~/git/code are moved aside with content kept, tracked edits and
      # a non-main branch still refuse.
      - name: Test pm-git-sync quarantine
        run: bash pm-stack/scripts/pm-git-sync-quarantine.test.sh

      # pm-git-sync and local commits (2026-11-22): empty rebuild marker
      # commits that block the pull are kept under tags and main follows
      # origin; a local commit that changes a file still refuses.
      - name: Test pm-git-sync rebuild markers
        run: bash pm-stack/scripts/pm-git-sync-markers.test.sh

      # The Android app's release (pm-stack/console/android/release.sh),
      # against a stand-in for gh: the numbered release is made once and
      # never changed, the fixed address always ends up on the newest
      # build and never goes back, and a run started again changes
      # nothing.
      - name: Test the Android app's release script
        run: bash pm-stack/console/android/release.test.sh

      # The other half (pm-stack/console/android/release-built.sh): on
      # the machine that holds the key, which of GitHub's builds is
      # signed (this repository's own, on main, the newest), that
      # nothing is released or served unless it carries the certificate
      # the site lists, and that a failure leaves everything as it was.
      - name: Test the Android app's sign-and-release script
        run: bash pm-stack/console/android/release-built.test.sh

      # Script suite for #5993: pm-stack/scripts/
      # tailnet-bindings.test.sh (the #781 regression pin for the
      # Pad/Grist tailnet bindings) was run by no workflow. The
      # file is named explicitly and asserted to exist first, so a
      # green run cannot be a silently skipped suite, and any
      # failure fails the job. The suite SKIPs (exit 0) when
      # docker compose is unavailable: ubuntu-latest runners ship
      # it, so a SKIP here means the runner changed — fail the job
      # rather than letting the pin lapse silently.
      # (The other #5993 suite, pm-git-sync.test.sh, is NOT wired:
      # PR #8171 retired the pm-git-sync redeploy machinery and
      # deleted its harness on purpose — deploys are merge ->
      # nixos-rebuild switch now. See the task 9866 note on #5993.)
      - name: Test tailnet-bindings script
        run: |
          t=pm-stack/scripts/tailnet-bindings.test.sh
          if [ ! -f "$t" ]; then
            echo "::error::Missing suite file $t — the tailnet-bindings suite was not run."
            exit 1
          fi
          rc=0
          out="$(bash "$t" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::tailnet-bindings suite failed (exit $rc)."
            exit 1
          fi
          if printf '%s' "$out" | grep -q '^SKIP:'; then
            echo "::error::tailnet-bindings suite reported SKIP (docker compose unavailable) — the #781 pin did not run."
            exit 1
          fi
          echo "tailnet-bindings script suite passed."

      # Fencing and cutover suites for #6816: pm-stack/scripts/
      # fence-check.test.sh proves the fencing rule (old writer fenced
      # before promotion, fail closed when state is unreadable) and
      # kaneo-cutover.test.sh proves the promotion gate built on it —
      # refuse while unfenced and touch nothing, demand exact table/row
      # parity, and refuse to report PASS otherwise. Both were run by no
      # workflow. Files are named explicitly and asserted to exist first,
      # so a green run cannot be a silently skipped suite.
      - name: Test fence-check and kaneo-cutover script suites
        run: |
          fail=0
          for t in pm-stack/scripts/fence-check.test.sh pm-stack/scripts/kaneo-cutover.test.sh; do
            if [ ! -f "$t" ]; then
              echo "::error::Missing suite file $t — the pm-stack fencing/cutover suites were not run."
              fail=1
              continue
            fi
            bash "$t" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::pm-stack fencing/cutover suites failed (see above)."
            exit 1
          fi
          echo "fence-check and kaneo-cutover script suites passed."

      # Ownership-map guard for #3989 criterion 1:
      # pm-stack/scripts/ownership-map.test.sh pins the
      # machine-checkable citations of
      # doc/pm-stack/current-state-reconciliation-2026-11-24.md
      # (one canonical home + one active writer per service, the
      # muse-dev2 deletion recorded, the #6816 re-plan named), so the
      # map cannot silently rot. Named explicitly and asserted to
      # exist first, like the fencing suites above.
      - name: Test ownership-map doc-rot guard suite
        run: |
          t=pm-stack/scripts/ownership-map.test.sh
          if [ ! -f "$t" ]; then
            echo "::error::Missing suite file $t — the ownership-map guard suite was not run."
            exit 1
          fi
          bash "$t" || exit 1
          echo "ownership-map guard suite passed."

      # Python suites for #5951: pm-stack/opencode-claimant/test_poll.py
      # (36 tests, the #3026 claimant session-cap gate) and
      # pm-stack/grist/test_update_choice_options.py (7 tests) were run
      # by no workflow. Both files are named explicitly and asserted to
      # exist first, so a green run cannot be a silently skipped suite;
      # any failure in either suite fails the job.
      - name: Test claimant and grist Python suites
        run: |
          fail=0
          for t in pm-stack/opencode-claimant/test_poll.py pm-stack/opencode-claimant/test_claimant.py pm-stack/opencode-claimant/test/test_claimant.py pm-stack/grist/test_update_choice_options.py; do
            if [ ! -f "$t" ]; then
              echo "::error::Missing suite file $t — the pm-stack Python suites were not run in full."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          python3 -m unittest pm-stack/opencode-claimant/test_poll.py || fail=1
          python3 -m unittest pm-stack/opencode-claimant/test_claimant.py || fail=1
          python3 -m unittest pm-stack/opencode-claimant/test/test_claimant.py || fail=1
          python3 -m unittest discover -s pm-stack/grist -p 'test_*.py' || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "::error::pm-stack Python suites: at least one suite failed (see above)."
            exit 1
          fi
          echo "pm-stack Python suites: test_poll.py + test_claimant.py + test/test_claimant.py (#7670) + grist discovery passed."

      # Python suite for #10423: pm-stack/scheduled-history/
      # test_collect.py (19 checks, the regression suite for the
      # scheduled-history reconciler/collector from #2174 Gap 1) was
      # run by no workflow. The suite is script-style (not
      # unittest-discoverable), so it is run directly; the file is
      # asserted to exist first and its checks-passed line is
      # required in the output, so a green run cannot be a silently
      # skipped or empty suite; any failure fails the job. (This
      # workflow runs nightly on main with no path filters, per the
      # 2026-11-16 nightly-CI policy — being a step here is the
      # coverage; there is no path filter to extend.)
      - name: Test scheduled-history collector Python suite
        run: |
          t=pm-stack/scheduled-history/test_collect.py
          if [ ! -f "$t" ]; then
            echo "::error::Missing suite file $t — the scheduled-history collector suite was not run."
            exit 1
          fi
          rc=0
          out="$(python3 "$t" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::scheduled-history collector suite failed (exit $rc)."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'checks passed'; then
            echo "::error::scheduled-history collector suite did not report its checks-passed line — the suite did not run in full."
            exit 1
          fi
          echo "scheduled-history collector suite passed."

      # Host-health collector projection and backup restore-point reader
      # (#3989 criterion 6). Run explicitly: this suite is not otherwise
      # discovered by the aggregator or Python test jobs.
      - name: Test host-health collector Python suite
        run: python3 -m unittest discover -s pm-stack/tests -p 'test_host_health_collector.py'

      # Required inputs are explicit so discovery cannot silently drop a suite.
      - name: Test claimant launch, handoff, and batch dispatch (#9877)
        working-directory: pm-stack/opencode-claimant
        run: |
          set -euo pipefail
          set -- test_launch_one.py test_send_to_opencode.py test_dispatch_batch.py
          for suite in "$@"; do
            if [ ! -f "$suite" ]; then
              echo "::error::Missing claimant suite file $suite; launch, handoff, and batch dispatch tests did not run."
              exit 1
            fi
          done
          python3 -m unittest "$@"

      # Lane guard: assignee-is-not-a-hold and park-note dedupe checks
      # that queue lanes run before parking or commenting (#7616).
      - name: Test lane guard
        working-directory: pm-stack/lane-guard
        run: |
          set -euo pipefail
          if [ ! -f test_lane_guard.py ]; then
            echo "::error::Missing suite file pm-stack/lane-guard/test_lane_guard.py; the lane guard tests did not run."
            exit 1
          fi
          python3 -m unittest test_lane_guard.py

      # Bun suite for #6091: pm-stack/opencode-claimant/
      # test/install.test.mjs (13 tests, the #3278 typo'd-flag
      # install guard) was run by no workflow — #5951 wired only
      # the claimant Python suite above. The suite imports
      # bun:test, so the runner is bun (node --test fails on it).
      # The file is named explicitly and asserted to exist first,
      # so a green run cannot be a silently skipped suite; any
      # failure in the suite fails the job.
      - name: Test claimant install bun suite
        working-directory: pm-stack/opencode-claimant
        run: |
          if [ ! -f test/install.test.mjs ]; then
            echo "::error::Missing suite file pm-stack/opencode-claimant/test/install.test.mjs — the claimant install suite was not run."
            exit 1
          fi
          bun test test/install.test.mjs

      # Python suite for #6217: pm-stack/external-comms/
      # test_push_quarantine.py (6 tests, the pinning suite for the
      # #6154 external-comms pusher fix) was run by no workflow, so a
      # regression of the silent-drop bug would have passed CI
      # unnoticed. The file is asserted to exist first, so a green run
      # cannot be a silently skipped suite; any failure fails the job.
      - name: Test external-comms push-quarantine Python suite
        working-directory: pm-stack/external-comms
        run: |
          if [ ! -f test_push_quarantine.py ]; then
            echo "::error::Missing suite file pm-stack/external-comms/test_push_quarantine.py — the push-quarantine suite was not run."
            exit 1
          fi
          python3 -m unittest test_push_quarantine

      # The quota exporter suites need Node 24: opencode-usage-export
      # imports node:sqlite, which under the runner's default Node 22
      # prints an ExperimentalWarning to stderr — and that suite's
      # import test asserts the child's stderr is empty. (Codex P1
      # finding on PR #6928, verified against the suite at lines
      # 52-68 of opencode-usage-export.test.mjs.)
      - name: Set up Node 24 for the quota exporter suites
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      # Quota exporter suites for #6084
      # opencode-usage-export: node --test (12 tests)
      - name: Test opencode-usage-export suite
        run: node --test pm-stack/opencode-usage-export/opencode-usage-export.test.mjs

      # cloudflare-export: node --test (35 tests)
      - name: Test cloudflare-export suite
        run: node --test pm-stack/cloudflare-export/cloudflare-quota-export.test.mjs

      # meta-exporter: node --test (suite for #6344; the explicit file
      # path is required — the directory form fails on Node 24). The
      # file is asserted to exist first, so a green run cannot be a
      # silently skipped suite; any failure fails the job.
      - name: Test meta-exporter suite
        run: |
          if [ ! -f pm-stack/meta-exporter/meta-quota-export.test.mjs ]; then
            echo "::error::Missing suite file pm-stack/meta-exporter/meta-quota-export.test.mjs — the meta-exporter suite was not run."
            exit 1
          fi
          node --test pm-stack/meta-exporter/meta-quota-export.test.mjs

      # watchdog-state: bun test (suite for #8026;
      # pm-stack/exporters/test/watchdog-state.test.ts, 12 tests, is the
      # only verification of the quota watchdog decision layer in
      # pm-stack/exporters/src/watchdog-state.ts and was run by no
      # workflow - bare `bun test` never reaches it because
      # pm-stack/exporters/ has no package.json. The invocation is the
      # one documented in pm-stack/exporters/README.md, run from
      # pm-stack/aggregator (whose dependencies are installed above).
      # The file is asserted to exist first, so a green run cannot be
      # a silently skipped suite; any failure fails the job.
      - name: Test watchdog-state suite
        working-directory: pm-stack/aggregator
        run: |
          if [ ! -f ../exporters/test/watchdog-state.test.ts ]; then
            echo "::error::Missing suite file pm-stack/exporters/test/watchdog-state.test.ts - the watchdog-state suite was not run."
            exit 1
          fi
          bun test ../exporters/test/watchdog-state.test.ts

      # Bun suite for #9860: pm-stack/decision-events-worker/test/
      # (14 tests: events.test.ts + pagination.test.ts, the #9335
      # decision-set event pipeline) was run by no venue. The
      # directory is asserted to hold *.test.ts files first, so a
      # green run cannot be a silently skipped suite; any failure
      # fails the job. It needs only bun, no wrangler install.
      - name: Test decision-events-worker suite
        working-directory: pm-stack/decision-events-worker
        run: |
          if [ ! -d test ] || ! ls test/*.test.ts >/dev/null 2>&1; then
            echo "::error::Missing decision-events-worker test suite — pm-stack/decision-events-worker/test has no *.test.ts files; the suite was not run."
            exit 1
          fi
          bun test

      # Bun suite for #12825: pm-stack/pm-service/test/
      # (tenant-store.test.ts, the component A PM tenant store
      # schema + migrations conformance suite) must not be a
      # silently skipped suite either. It needs only bun
      # (bun:sqlite is built in), no install step.
      - name: Test pm-service tenant-store suite
        working-directory: pm-stack/pm-service
        run: |
          if [ ! -d test ] || ! ls test/*.test.ts >/dev/null 2>&1; then
            echo "::error::Missing pm-service test suite — pm-stack/pm-service/test has no *.test.ts files; the suite was not run."
            exit 1
          fi
          bun test
