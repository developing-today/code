name: Daily Codebase Innovation & Maintenance

# NOT Jules dispatch: this legacy filename launches an OpenCode session via
# pm-dispatch.
# Daily automated codebase review, ideation, gap analysis, issue triage/refinement,
# and opportunistic improvements across developing-today/code using an OpenCode
# session launched via pm-dispatch (the pm-dispatch-start reusable action).

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      focus_app:
        description: "Optional specific package or subsystem to focus on (e.g. pkgs/id, pkgs/mcpx, or all)"
        type: string
        default: "all"
      allow_direct_prs:
        description: "Allow opening small PRs for quick bugfixes, edge cases, and conflict-reducing refactors"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codebase-ideation-and-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify every declared dispatch input is wired (#2681)
        run: |
          python3 - <<'PYEOF2'
          import re, sys
          path = ".github/workflows/jules-daily-codebase-ideation.yml"
          text = open(path).read()
          block = re.search(r"workflow_dispatch:\n    inputs:\n((?:      .*\n|        .*\n|          .*\n)+)", text)
          names = re.findall(r"^      (\w+):", block.group(1), re.M) if block else []
          ignored = set(re.findall(r"^      (\w+):\n        description: \"[^\"]*[Ii]gnored", block.group(1), re.M)) if block else set()
          missing = [n for n in names if n not in ignored and ("inputs." + n) not in text]
          if missing:
              sys.exit("declared workflow_dispatch inputs never referenced: " + ", ".join(missing))
          print("all declared dispatch inputs are wired or explicitly ignored:", ", ".join(names) or "none")

          lines = text.splitlines()
          step_name = "      - name: Run Codebase Innovation & Review Agent via pm-dispatch"
          step_start = next((i for i, line in enumerate(lines) if line == step_name), None)
          if step_start is None:
              sys.exit("pm-dispatch step is missing")
          step_end = next(
              (i for i in range(step_start + 1, len(lines)) if lines[i].startswith("      - name:")),
              len(lines),
          )
          step = "\n".join(lines[step_start:step_end])
          default_branch_guard = "if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
          if default_branch_guard not in step:
              sys.exit("pm-dispatch must be limited to the repository's default branch")
          should_dispatch = lambda ref, default_branch: ref == f"refs/heads/{default_branch}"
          if not should_dispatch("refs/heads/main", "main") or should_dispatch("refs/heads/feature", "main"):
              sys.exit("default-branch dispatch guard examples failed")
          print("pm-dispatch default-branch guard is present and rejects feature refs")
          PYEOF2

      - name: Verify audit targets exist and retired packages stay retired (#5735)
        run: |
          python3 - <<'PYEOF3'
          import os, sys
          active = [
              "pkgs/fleet",
              ".github/actions/pm-dispatch-start",
              ".github/actions/pm-dispatch-task",
              ".github/workflows/pm-scheduled.yml",
          ]
          missing = [p for p in active if not os.path.exists(p)]
          if missing:
              sys.exit("daily review prompt names audit targets that do not exist: " + ", ".join(missing))
          retired = ["pkgs/jules", "pkgs/jules-fleet", "pkgs/jules-merge"]
          present = [p for p in retired if os.path.exists(p)]
          if present:
              sys.exit("retired Jules packages (removed by PR #5376) exist again: " + ", ".join(present))
          text = open(".github/workflows/jules-daily-codebase-ideation.yml").read()
          named = [p for p in retired if ("`" + p + "`") in text]
          if named:
              sys.exit("daily review prompt still presents retired packages as audit targets: " + ", ".join(named))
          print("audit targets exist and retired Jules packages are absent and unnamed:", ", ".join(active))
          PYEOF3

      - name: Run Codebase Innovation & Review Agent via pm-dispatch
        id: dispatch
        # Feature-ref workflow_dispatch runs can verify setup without starting production work.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/actions/pm-dispatch-start
        with:
          title: "Daily codebase innovation & maintenance"
          prompt: >-
            Perform a comprehensive daily codebase review, innovation scan, and issue/PR maintenance pass across developing-today/code.

            ${{ github.event_name == 'workflow_dispatch' && inputs.focus_app != '' && inputs.focus_app != 'all' && format('OPERATOR FOCUS: this run was manually dispatched with focus_app={0}. Concentrate the review, ideation, and maintenance below on {0} and its immediate neighbours; do not spread across the whole repository.', inputs.focus_app) || '' }}

            You are acting as an unrestricted principal architect and senior systems engineer. Do not hold back: generate bold ideas, surface hidden gaps, polish proposals, and solve immediate problems opportunistically.

            Follow these directives and areas of focus:

            ### 1. COMPREHENSIVE REPOSITORY & ACTIVITY AUDIT
            - Inspect recent commits on `main` to understand the latest velocity and architectural direction.
            - Review open, recently closed, and merged issues and PRs (`gh issue list --state all --limit 50`, `gh pr list --state all --limit 30`).
            - Review each major package, tool, and subsystem in the repository:
              - **`pkgs/id`**: Distributed identity, cryptographic event log, p2panda synchronization, local event store, group encryption, discovery, and capability delegation.
              - **`pkgs/mcpx`**: Model Context Protocol daemon, multi-server multiplexing, protocol compliance, session leasing, JIT secret prompt vault, and Code Mode projection.
              - **`pkgs/fleet`**: The Rust multicall fleet tools and queue client — automated multi-agent coding workflows, issue triage, and parallel agent execution (the retired Jules packages were removed by PR #5376; audit the fleet queue automation under `pkgs/fleet` and `.github/workflows`, the dispatch actions `.github/actions/pm-dispatch-start` and `.github/actions/pm-dispatch-task`, the scheduler `.github/workflows/pm-scheduled.yml` and its repo-specific scheduled callers, and the CI-breakage automation).
              - **NixOS System Infrastructure & Web Services**: Modules, cloud functions, background daemons, and system services.

            ### 2. UNRESTRICTED INNOVATION & NEW FEATURE GENERATION
            - You are NOT restricted by what currently exists. Brainstorm things that *should* exist, would be exceptionally useful, or incorporate frontier concepts:
              - Edge architectures using Cloudflare Workers, Durable Objects, KV, and Queues.
              - Distributed SQLite / libSQL / Turso primitives for offline-first, syncable state.
              - Advanced autonomous coding loops, speculative tool execution, and local verification loops.
              - Cross-platform bridges, native desktop integrations, and performance optimizations.
            - **Bias Toward Capture**: It is far better to create an issue to triage later than to let a valuable opportunity or insight pass.

            ### 3. ACTIVE ISSUE & PR MAINTENANCE
            - **Scope Variety**: Create single large architectural vision issues for strategic direction, or narrow, highly focused issues for targeted improvements.
            - **Issue Decomposition**: If an existing issue is too broad, ambiguous, or monolithic (including issues created by others), break it apart into a series of clear, modular, linked sub-issues with explicit dependencies.
            - **Deduplication & Consolidation**: Identify overlapping or duplicate proposals/issues and consolidate them into unified, high-quality reference issues.
            - **Comments & Spec Refinement**: Leave comments or edit existing issues/PRs to provide missing technical specifications, edge-case analysis, data schemas, or suggested test cases.
            - **Zero-Context Hand-off Standard**: Every issue you author must be self-contained, citing exact file paths, interfaces, architectural rationale, and verifiable acceptance criteria so a new agent with zero prior context can execute it.

            ${{ github.event_name == 'workflow_dispatch' && !inputs.allow_direct_prs && 'OPERATOR DIRECTIVE: allow_direct_prs is false for this manually dispatched run — do NOT open any Pull Requests. Capture every fix, bug, or improvement as an issue or a comment on an existing issue instead.' || '' }}

            ### 4. OPPORTUNISTIC IMPLEMENTATION (QUICK-WIN PRS)
            - If you identify straightforward bugs, unhandled edge cases, missing test coverage, or clean opportunities to refactor code to prevent future merge conflicts:
              - You are actively encouraged to open small, focused Pull Requests implementing the fix or feature directly.
              - Ensure all added code follows repository standards, includes tests, and passes formatting/linting hooks (`treefmt`, `conform`).
              - Never introduce breaking regressions to existing stable flows.
              - **One PR per coherent set**: batch every instance of the same problem — and all related dependency updates — into a single PR, or a few PRs split by coherent group. Never one PR per item or per dependency.
              - **Prefer tracked, higher-impact work**: before inventing a new micro-fix, check the open issues and implement the highest-impact one you can complete and verify, even when it spans several files.
              - **Merging is permitted, never required**: merge your PR only when checks pass and you are reasonably certain it is correct and low-risk. Otherwise leave it open and state your confidence and what a human should check in the description.
