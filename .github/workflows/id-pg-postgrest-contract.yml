name: id-pg PostgREST contract

# Real Postgres/PostgREST contract verification for #13764. This is a
# nightly/manual signal, not a PR gate; see .github/ci-policy.md.
on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  postgrest-contract:
    name: id-pg PostgREST contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Run injectable and real PostgREST container contracts
        run: nix develop ./pkgs/id --command bash pkgs/id/scripts/test-postgrest-contract.sh
