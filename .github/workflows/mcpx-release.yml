name: mcpx release

# Cuts an mcpx release from the monorepo (decision 0005 §2.1-§2.2, §3, §5;
# #1881). It produces channel 1 (release binaries + checksums) and exercises
# channel 2 (the curl|sh installer) against them.
#
# mcpx lives in pkgs/mcpx of a monorepo, so its releases need a scheme that
# cannot collide with another package's: tags are `mcpx/vX.Y.Z`, and this
# workflow triggers on exactly that prefix.
#
# The version's single source is pkgs/mcpx/VERSION. A tag that disagrees with
# it is refused before anything is built -- a release whose name and whose
# `mcpx --version` differ is the failure this workflow exists to prevent.
#
# A manual run (workflow_dispatch) is a snapshot: it builds the same three
# artifacts with the same script and uploads them as a workflow artifact,
# without publishing a release. That run is the proof the release path works,
# and it is how a person checks a change before tagging.
on:
  push:
    tags:
      - "mcpx/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (default: pkgs/mcpx/VERSION)"
        required: false
        type: string

permissions:
  contents: write

# CI tier policy: see .github/ci-policy.md
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: "release: build artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          # Monorepo: setup-go looks for go.sum at the repository root unless
          # told otherwise (same reason as .github/workflows/mcpx.yml).
          cache-dependency-path: pkgs/mcpx/go.sum

      - name: Resolve the version, and refuse a tag that disagrees with it
        id: version
        working-directory: pkgs/mcpx
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file_version=$(tr -d '\n' <VERSION)
          if [ "$EVENT" = "push" ]; then
            # mcpx/v1.2.3 -> 1.2.3
            tag_version=${REF_NAME#mcpx/v}
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::tag $REF_NAME says $tag_version, pkgs/mcpx/VERSION says $file_version"
              echo "Bump pkgs/mcpx/VERSION in the commit the tag points at, then re-tag."
              exit 1
            fi
            version=$file_version
          else
            # A snapshot builds VERSION unless a version is given; it never
            # publishes, so a mismatch here is a request, not a release.
            version=${INPUT_VERSION:-$file_version}
            version=${version#v}
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=mcpx/v$version" >>"$GITHUB_OUTPUT"
          echo "building mcpx $version"

      - name: Build the three static artifacts and their checksums
        working-directory: pkgs/mcpx
        run: ./scripts/release-artifacts.sh "$RUNNER_TEMP/artifacts" "${{ steps.version.outputs.version }}"

      - name: Smoke-test the host binary's reported version
        # The version stamp is the whole point of the ldflags wiring, so read
        # it back off the artifact this runner can execute.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf "$RUNNER_TEMP/artifacts/mcpx-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz"
          got=$("$RUNNER_TEMP/smoke/mcpx" --version)
          echo "mcpx --version: $got"
          case "$got" in
          *"${{ steps.version.outputs.version }}"*) ;;
          *) echo "::error::artifact reports '$got', expected ${{ steps.version.outputs.version }}"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: mcpx-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/artifacts/*.tar.gz
            ${{ runner.temp }}/artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  installer:
    name: "release: installer exercise"
    # The curl|sh installer (decision 0005 §2.2, §6.5) consumes the artifacts
    # built above, so it is exercised here against a snapshot: install into a
    # temp prefix and read the version back. A tag release also runs it, and
    # `publish` waits for it, so a release cannot ship an installer that no
    # longer works against the tarballs it just built.
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: mcpx-${{ needs.artifacts.outputs.version }}
          path: ${{ runner.temp }}/artifacts

      - name: Install the snapshot into a temp prefix
        env:
          MCPX_VERSION: ${{ needs.artifacts.outputs.version }}
          MCPX_BASE_URL: ${{ runner.temp }}/artifacts
          MCPX_PREFIX: ${{ runner.temp }}/prefix
        run: |
          set -euo pipefail
          sh pkgs/mcpx/scripts/install.sh
          got=$("$MCPX_PREFIX/mcpx" --version)
          echo "installed binary reports: $got"
          case "$got" in
          *"$MCPX_VERSION"*) ;;
          *) echo "::error::installed binary reports '$got', expected $MCPX_VERSION"; exit 1 ;;
          esac

      - name: Refuse a tampered artifact
        # The installer verifies the checksum; prove it by breaking one. An
        # installer that only *says* it verifies teaches the wrong habit.
        env:
          MCPX_VERSION: ${{ needs.artifacts.outputs.version }}
          MCPX_PREFIX: ${{ runner.temp }}/tampered-prefix
        run: |
          set -euo pipefail
          cp -r "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/tampered"
          asset="$RUNNER_TEMP/tampered/mcpx-$MCPX_VERSION-x86_64-linux.tar.gz"
          printf 'x' >>"$asset"
          if MCPX_BASE_URL="$RUNNER_TEMP/tampered" sh pkgs/mcpx/scripts/install.sh 2>"$RUNNER_TEMP/err"; then
            echo "::error::the installer accepted an artifact whose checksum does not match"
            exit 1
          fi
          grep -q "checksum mismatch" "$RUNNER_TEMP/err" || {
            echo "::error::installer failed for the wrong reason:"
            cat "$RUNNER_TEMP/err"
            exit 1
          }
          echo "tampered artifact refused, as it must be"

  publish:
    name: "release: publish"
    # Only a tag publishes. A snapshot run stops at the artifacts and the
    # installer exercise above.
    if: github.event_name == 'push'
    needs: [artifacts, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcpx-${{ needs.artifacts.outputs.version }}
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.artifacts.outputs.tag }}
          VERSION: ${{ needs.artifacts.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          cat >notes.md <<EOF
          Static mcpx $VERSION binaries for x86_64-linux, aarch64-linux and
          aarch64-darwin (CGO_ENABLED=0), with SHA256SUMS. Verify before use:

              sha256sum -c SHA256SUMS

          A bare binary has no JavaScript runtime: \`mcpx run\` and \`mcpx exec\`
          need Deno, Bun or Node on PATH until you install one (\`mcpx doctor\`
          says which it found). On Linux the static build's pure-Go os/user
          parses /etc/passwd instead of asking NSS, and its resolver does not
          honour nsswitch.conf. See pkgs/mcpx/docs/decisions/0005-release-pipeline.md.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mcpx $VERSION" \
            --notes-file notes.md \
            ./*.tar.gz SHA256SUMS
