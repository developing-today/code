name: pm-console-cloudflare config

# CI tier policy: see .github/ci-policy.md. This applies account
# configuration, so it is not CI: pull requests and pushes only
# validate the state and run its tests against a model of the
# Cloudflare account. Only a manual run applies, and only when the
# repository secrets below exist; otherwise it says so and changes
# nothing.
#
# Applies the PM stack's Cloudflare edge configuration from the
# repository (infra/pm-cloudflare/state.json): the Access application
# and policy for pm.security.cab, the tunnel route, DNS, the edge
# Worker route, and the Worker's secrets, whose values come from the
# repository's secrets at apply time and are never in the repo.
# Direct-mode tokens and repository-owned edge configuration are managed
# here; the laptop timer owns only its named tunnel's ingress.
on:
  push:
    branches: [main]
    paths:
      - "infra/pm-cloudflare/**"
      - "pm-stack/console/scripts/expose.py"
      - "pm-stack/console/scripts/test_expose.py"
      - "pm-stack/systemd/pm-console-expose.service"
      - "pm-stack/systemd/pm-console-expose.timer"
      - ".github/workflows/pm-cloudflare-config.yml"
  pull_request:
    paths:
      - "infra/pm-cloudflare/**"
      - "pm-stack/console/scripts/expose.py"
      - "pm-stack/console/scripts/test_expose.py"
      - "pm-stack/systemd/pm-console-expose.service"
      - "pm-stack/systemd/pm-console-expose.timer"
      - ".github/workflows/pm-cloudflare-config.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "check reports what would change; apply makes the changes"
        required: false
        default: "check"
        type: choice
        options: [check, apply]
      refresh_tokens:
        description: "replace the Worker's repository tokens with the current repository secrets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Applies run one at a time, in order; a newer run never cancels one
# that is uploading.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    name: state and model tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository applier and laptop tunnel boundary
        run: |
          python3 -I infra/pm-cloudflare/test_apply.py -v
          python3 -I pm-stack/console/scripts/test_expose.py -v

  apply:
    name: apply from the repository state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    # Validation runs on every push and pull request. Applying only
    # ever happens on a manual run that asks for it.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    steps:
      - name: Check apply secrets
        id: secrets
        env:
          PMCF_CLOUDFLARE_TOKEN: ${{ secrets.PMCF_CLOUDFLARE_TOKEN }}
          PMCF_OWNER_EMAIL: ${{ secrets.PMCF_OWNER_EMAIL }}
          PMCF_GITHUB_TOKEN: ${{ secrets.PMCF_GITHUB_TOKEN }}
          PMCF_QUEUE_TOKEN: ${{ secrets.PMCF_QUEUE_TOKEN }}
        run: |
          missing=""
          for v in PMCF_CLOUDFLARE_TOKEN PMCF_OWNER_EMAIL PMCF_GITHUB_TOKEN PMCF_QUEUE_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: set the repository secrets$missing to apply the Cloudflare config from the repo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Apply the repository state to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        env:
          PMCF_CLOUDFLARE_TOKEN: ${{ secrets.PMCF_CLOUDFLARE_TOKEN }}
          PMCF_OWNER_EMAIL: ${{ secrets.PMCF_OWNER_EMAIL }}
          PMCF_GOOGLE_CLIENT_ID: ${{ secrets.PMCF_GOOGLE_CLIENT_ID }}
          PMCF_GOOGLE_CLIENT_SECRET: ${{ secrets.PMCF_GOOGLE_CLIENT_SECRET }}
          PMCF_GITHUB_TOKEN: ${{ secrets.PMCF_GITHUB_TOKEN }}
          PMCF_QUEUE_TOKEN: ${{ secrets.PMCF_QUEUE_TOKEN }}
          PMCF_BRIDGE_TOKEN: ${{ secrets.PMCF_BRIDGE_TOKEN }}
          PMCF_BROKER_ACCESS_ID: ${{ secrets.PMCF_BROKER_ACCESS_ID }}
          PMCF_BROKER_ACCESS_SECRET: ${{ secrets.PMCF_BROKER_ACCESS_SECRET }}
          PMCF_REFRESH_TOKENS: ${{ inputs.refresh_tokens }}
        run: |
          # The input goes through the env; it is never interpolated into
          # script text. Rotation replaces unreadable secret values.
          if [ "$PMCF_REFRESH_TOKENS" = "true" ]; then
            python3 -I infra/pm-cloudflare/apply.py --apply --refresh-tokens
          else
            python3 -I infra/pm-cloudflare/apply.py --apply
          fi
          echo "Applied the PM stack Cloudflare config from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
