name: scripts-test

# THROWAWAY BRANCH ONLY (#15232): re-measure the graph encoding bake-off
# with the current redb pin on a GitHub-hosted runner. Never merged.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  bakeoff:
    name: graph encoding bake-off re-measure (#15232)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: pkgs/id
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run the bake-off harness
        working-directory: pkgs/id
        env:
          CARGO_TERM_COLOR: never
        run: |
          BAKEOFF_RESULTS="$PWD/fresh-bakeoff-results.json" cargo test -q -p id-store --test graph_encoding_bakeoff -- --exact graph_encoding_bakeoff 2>&1 | tail -40
          test -f fresh-bakeoff-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: fresh-bakeoff-results
          path: pkgs/id/fresh-bakeoff-results.json
