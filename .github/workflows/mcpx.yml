name: mcpx

# Builds mcpx on every change to it, and repairs the one thing a dependency
# bot cannot: the Nix vendorHash.
#
# Renovate updates go.mod and go.sum correctly. It has no way to know the hash
# of the vendored module tree, so every Go dependency bump it opens leaves the
# Nix build broken -- and without a build here, that merged silently and was
# only found by the next person to rebuild. This job computes the new hash,
# commits it to the Renovate branch, and fails any PR that still does not
# build.

# CI shape (2026-10): the gate is a single direct-Go test job -- no nix.
# The old workflow also ran a full "Nix build" that recompiled the same
# code a second time (~5.4 of the old ~10.6 min); that leg is gone from
# this workflow (#286). The flake is still evaluated on every PR by
# nix-ci, vendorHash repair keeps its own bot-only job below because it
# genuinely needs nix, and the package build itself is verified by the
# companion mcpx-nixbuild workflow — but only on PRs that change
# go.mod, go.sum or package.nix, where a stale vendorHash can appear
# (#297).

on:
  push:
    branches: [main]
    paths:
      - "pkgs/mcpx/**"
      # The seed store is data the collector bot files (#1953): its
      # commits must never re-trigger this workflow (the collector
      # also marks its commits [skip ci] — both addendum fixes).
      - "!pkgs/mcpx/testdata/seeds/**"
      - ".opencode/plugin/**"
  # Added for the flake-policy jobs below (#1973): the PR stress job
  # runs on pull requests, the full-suite stress job nightly. The
  # original jobs keep their original event coverage via their own
  # `if:` conditions, so these triggers change nothing for them.
  pull_request:
    paths:
      - "pkgs/mcpx/**"
      - "!pkgs/mcpx/testdata/seeds/**"
      - ".opencode/plugin/**"
      - ".github/workflows/mcpx.yml"
  schedule:
    # Nightly full-suite stress (#1973). Odd minute, off the hour.
    - cron: "23 3 * * *"
  workflow_dispatch:

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392). A conditional
# cancel-in-progress (the mcpx-conformance pattern) would still let a
# third rapid merge displace the second merge's pending run, so push
# runs are keyed by run_id here, matching dezren39/nix PR #495.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    name: "basic: test"
    # Original coverage was push-only; the pull_request/schedule
    # triggers above exist for the flake-policy jobs (#1973).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The Renovate branch itself, so a fixed hash can be pushed back.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      # The repo dogfoods the plugin: .opencode/plugin is a copy of
      # pkgs/mcpx/plugin/opencode, and the two must stay identical. The
      # generated ops table in the copy once fell 9 operations behind
      # (secrets, reload, preflight, servers_get) because the generation
      # guard inside pkgs/mcpx only compares the pkgs copy (#314). This
      # guard lives here, not in pkgs/mcpx, because that package also
      # stands alone in dezren39/nix with no repo-root .opencode copy.
      - name: Check the dogfood plugin copy is in sync
        run: |
          diff -r pkgs/mcpx/plugin/opencode/mcpx .opencode/plugin/mcpx
          diff pkgs/mcpx/plugin/opencode/mcpx-session.ts .opencode/plugin/mcpx-session.ts

      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          # setup-go looks for go.sum at the repository root unless told
          # otherwise, and this is a monorepo. Without this the cache step
          # logged "Restore cache failed: Dependencies file is not found" on
          # every run and the module cache was rebuilt from scratch each time.
          cache-dependency-path: pkgs/mcpx/go.sum

      - name: Check go.mod and go.sum are tidy
        working-directory: pkgs/mcpx
        # dezren39/nix#436: this module drifted untidy once (wazero
        # recorded indirect though imported directly; go.sum kept the
        # previous sqlite version's graph) because nothing checked.
        # `go mod tidy -diff` prints the diff and exits nonzero when
        # go.mod or go.sum is not tidy, without modifying the files.
        run: go mod tidy -diff

      # All three runtimes, because each reaches the daemon differently --
      # Deno and Bun over the unix socket, Node over TCP -- and a test that
      # skips a runtime it cannot find is a test that silently covers less.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit and end-to-end tests
        working-directory: pkgs/mcpx
        env:
          VARS: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ secrets.MCPX_CONFORMANCE_VARS_TOKEN }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          rc=0
          go test ./... -count=1 -json >"$RUNNER_TEMP/gotest.json" || rc=$?
          # Readable output for the log, from the same run.
          python3 - "$RUNNER_TEMP/gotest.json" <<'EOF'
          import json, sys
          for line in open(sys.argv[1], errors="replace"):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get("Action") == "output" and not e.get("Test"):
                  print(e.get("Output", ""), end="")
          EOF
          # Skipped tests are held to a record kept in the repository variable
          # MCPX_GO_TESTS, like the conformance records: more than the record
          # fails, naming the newly skipped tests; fewer becomes the new record
          # on main. Which tests skip depends on the machine, so the record is
          # this runner's.
          python3 scripts/gotest-report.py "$RUNNER_TEMP/gotest.json" \
            "$(jq -r '.MCPX_GO_TESTS // ""' <<<"$VARS")" "$RUN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/gotest-record.json" || rc=1
          if [ -f "$RUNNER_TEMP/gotest-record.json" ] && [ "$ON_MAIN" = true ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh variable set MCPX_GO_TESTS --repo "$GITHUB_REPOSITORY" --body "$(cat "$RUNNER_TEMP/gotest-record.json")"
              echo "- saved \`MCPX_GO_TESTS\`" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "> [!CAUTION]" >>"$GITHUB_STEP_SUMMARY"
              echo "> Go test record not saved: MCPX_CONFORMANCE_VARS_TOKEN is not set." >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$rc"

      # The opencode plugin's bun tests are the one suite `go test` never
      # sees. Bun is already installed above (the Go e2e tests shell out to
      # it); this step runs the plugin suite itself, so a broken plugin
      # test fails CI instead of never running (#1978).
      - name: Plugin tests (bun)
        working-directory: pkgs/mcpx
        run: bun test plugin/opencode/mcpx/

  lint:
    name: "basic: lint"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Approach C (#1996): the linters are the dev shell's, so their
      # versions are pinned by flake.lock and this workflow passes no
      # per-action version input of its own. The shell is the flake's
      # minimal `mcpx-lint` shell, not the default: realising the full
      # monorepo dev shell on a cold runner exceeded this job's timeout
      # and the leg was cancelled before any linter ran (PR #2718).
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            # The default dev shell's closure needs the cgroups
            # feature at build time. That gate is enforced by the nix
            # daemon, whose config is written here — a client-side
            # --extra-experimental-features flag alone does not lift
            # it (verified on this PR: the flag was accepted and the
            # build still died). Drew's NixOS machines never see this
            # because the flake's nixConfig is fed into their system
            # nix.settings; a stock runner's is not (#1996).
            experimental-features = nix-command flakes cgroups

      # shellcheck reads the repository's .shellcheckrc, which enables every
      # optional check; --severity=warning keeps this leg to findings that
      # are wrong rather than merely unidiomatic (the style class is
      # treefmt's shfmt job). actionlint checks these workflow files.
      - name: go vet, gofmt, shellcheck, actionlint
        run: |
          # The cgroups feature is enabled in the installer step's
          # extra-conf above (the daemon enforces it); the flag here
          # covers the client side of `nix develop` itself. Without
          # both, this step dies with "experimental Nix feature
          # 'cgroups' is disabled" before any linter runs (#1996).
          nix develop .#mcpx-lint --extra-experimental-features cgroups --command bash -euo pipefail -c '
            cd pkgs/mcpx
            go vet ./...
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "gofmt would rewrite:"
              echo "$unformatted"
              exit 1
            fi
            cd ../..
            shellcheck -x -P SCRIPTDIR --severity=warning pkgs/mcpx/scripts/*.sh
            actionlint
          '

      # golangci-lint runs, but is NOT blocking yet — explicitly, per
      # #1996's acceptance fallback. Its first full run (PR #2718, run
      # 41131293079) reported 119 pre-existing findings across the
      # module (errcheck 50, staticcheck 50, unused 17, ineffassign 2),
      # far beyond this slice's baseline. They are filed as #2836;
      # when #2836 lands, this step loses `continue-on-error` and the
      # leg becomes fully blocking. Until then the findings print on
      # every run, visible but not gating.
      - name: golangci-lint (non-blocking until #2836)
        continue-on-error: true
        run: |
          nix develop .#mcpx-lint --extra-experimental-features cgroups --command bash -euo pipefail -c '
            cd pkgs/mcpx
            golangci-lint run
          '

  plugin:
    name: "basic: plugin tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Every test file the plugin has, not the single daemon.test.ts #1996
      # was written against. Ops tests skip unless OPS_LIVE_SOCKET is set:
      # they need a running daemon, and this leg deliberately does not
      # provide one (the Go test job is where the daemon itself is tested).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: bun test
        working-directory: pkgs/mcpx
        run: bun test plugin/opencode/mcpx/

  vendorhash-repair:
    name: vendorHash repair (bot dependency bumps only)
    # Only on bot branches. A human changing dependencies should see the
    # failure and fix it deliberately rather than have it rewritten under
    # them. This is the one job here that still needs nix on a PR.
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The Renovate branch itself, so a fixed hash can be pushed back.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Repair vendorHash on a dependency bump
        # Only on bot branches. A human changing dependencies should see the
        # failure and fix it deliberately rather than have it rewritten under
        # them.
        run: |
          set -euo pipefail
          file=pkgs/mcpx/package.nix
          if nix build .#packages.x86_64-linux.mcpx --no-link 2>/dev/null; then
            echo "builds as-is; nothing to repair"
            exit 0
          fi
          # Blank the hash so Nix reports the one it computed.
          sed -i 's|vendorHash = "sha256-[^"]*"|vendorHash = ""|' "$file"
          got=$(nix build .#packages.x86_64-linux.mcpx --no-link 2>&1 \
            | sed -n 's/.*got: *\(sha256-[A-Za-z0-9+/=]*\).*/\1/p' | head -1)
          if [ -z "$got" ]; then
            echo "could not determine the new vendorHash; the build fails for another reason"
            git checkout -- "$file"
            exit 1
          fi
          sed -i "s|vendorHash = \"\"|vendorHash = \"$got\"|" "$file"
          git config user.name "mcpx-hash-bot"
          git config user.email "mcpx-hash-bot@users.noreply.github.com"
          git add "$file"
          git commit -m "mcpx: update vendorHash for the dependency bump"
          git push

  stress-pr:
    name: "stress: PR changed tests (race/shuffle/repeat)"
    # Flake policy (#1973, approach C): detect by repetition off the
    # critical path. This job is parallel to the main test job and is
    # never a required check; it runs only the packages a PR changed,
    # with the race detector, a deterministic shuffle seed derived
    # from the workflow run identity (printed in the log, so a failing
    # order reproduces with the same seed), and repetition: -count=10
    # for unit packages, -count=3 for the e2e package. No retries:
    # a failure here is a finding, not something to re-run to green.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Stress the packages this PR changed
        working-directory: pkgs/mcpx
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_IDENTITY: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          seed=$(python3 -c 'import hashlib, os; print(int(hashlib.sha256(("mcpx-shuffle/v1:" + os.environ["RUN_IDENTITY"]).encode()).hexdigest()[:15], 16))')
          echo "shuffle seed: $seed (reproduce with: go test <pkg> -race -shuffle=$seed -count=<n>)"
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA...$HEAD_SHA" -- pkgs/mcpx \
            | sed 's|^pkgs/mcpx/||' | grep -E '\.go$' | grep -v '^testdata/' || true)
          if [ -z "$changed" ]; then
            echo "no Go files changed in pkgs/mcpx; nothing to stress"
            exit 0
          fi
          unit=""; e2e=""
          for d in $(printf '%s\n' "$changed" | xargs -n1 dirname | sort -u); do
            if [ "$d" = "internal/e2e" ]; then e2e="./$d"; else unit="$unit ./$d"; fi
          done
          if [ -n "$unit" ]; then
            echo "unit packages (-count=10):$unit"
            go test $unit -race -shuffle=$seed -count=10
          fi
          if [ -n "$e2e" ]; then
            echo "e2e package (-count=3): $e2e"
            go test $e2e -race -shuffle=$seed -count=3
          fi

  stress-nightly:
    name: "stress: nightly full suite (race/shuffle/repeat)"
    # Flake policy (#1973): the whole suite, nightly, on two OSes, off
    # the PR critical path. A failure opens or updates one tracking
    # issue instead of blocking anything. Quarantined tests run here
    # like everywhere else: testsupport.Quarantine skips them until
    # their expiry and fails the suite after it, so the nightly log
    # and the failure issue are where quarantines surface.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache: true
          cache-dependency-path: pkgs/mcpx/go.sum

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Full suite under race/shuffle/repeat
        working-directory: pkgs/mcpx
        env:
          RUN_IDENTITY: ${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.os }}
        run: |
          set -euo pipefail
          seed=$(python3 -c 'import hashlib, os; print(int(hashlib.sha256(("mcpx-shuffle/v1:" + os.environ["RUN_IDENTITY"]).encode()).hexdigest()[:15], 16))')
          echo "SHUFFLE_SEED=$seed" >> "$GITHUB_ENV"
          echo "shuffle seed: $seed (reproduce with: go test ./... -race -shuffle=$seed -count=3)"
          go test ./... -race -shuffle=$seed -count=3

      - name: Open or update the nightly failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="mcpx nightly stress failure"
          body="The nightly flake-policy stress run failed on ${{ matrix.os }} (shuffle seed: $SHUFFLE_SEED).

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Reproduce: \`go test ./... -race -shuffle=$SHUFFLE_SEED -count=3\` in pkgs/mcpx.

          Policy: #1973 — fix the flake; quarantine only via testsupport.Quarantine with an issue link and an expiry."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$title in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
