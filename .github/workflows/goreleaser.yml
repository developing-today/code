name: goreleaser

on:
  push:
    tags:
      - "*"
  # Manual runs prove the workflow still works without cutting a
  # release: they build a snapshot (see the GoReleaser args below).
  workflow_dispatch:

permissions:
  contents: write

# CI tier policy: see .github/ci-policy.md
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  dump_contexts_to_log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"
      - name: Dump steps context
        env:
          STEPS_CONTEXT: ${{ toJson(steps) }}
        run: echo "$STEPS_CONTEXT"
      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"
      - name: Dump strategy context
        env:
          STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        run: echo "$STRATEGY_CONTEXT"
      - name: Dump matrix context
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTEXT"
  goreleaser:
    name: ${{ matrix.working-directory }} goreleaser
    strategy:
      matrix:
        include: [{ working-directory: "." }]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dump job context
        env:
          JOB_CONTEXT: ${{ toJson(job) }}
        run: echo "$JOB_CONTEXT"
      - name: Dump strategy context
        env:
          STRATEGY_CONTEXT: ${{ toJson(strategy) }}
        run: echo "$STRATEGY_CONTEXT"
      - name: Dump matrix context
        env:
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTEXT"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The release builds pkgs/graph (.goreleaser.yaml: dir
          # sources/graph, and sources is a symlink to pkgs/), so its
          # go.mod/go.sum are the version/cache files — the same pair
          # mod-tidy.yml uses. (This pointed at ./go.work until #344;
          # go.work was deleted in Feb 2024 and setup-go fails on the
          # missing file before GoReleaser ever runs.)
          go-version-file: pkgs/graph/go.mod
          check-latest: true
          cache-dependency-path: pkgs/graph/go.sum
      - name: Run GoReleaser ${{ matrix.working-directory }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          # Tag pushes cut the real release; manual dispatch runs a
          # snapshot build instead (no publish, no tag required).
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
          workdir: ${{ matrix.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
