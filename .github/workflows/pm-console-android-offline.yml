name: pm-console-android offline

# CI tier policy: see .github/ci-policy.md. This is CI, not a release,
# so it runs on the nightly schedule and by hand, never on push.
#
# Checks the PM console Android app with no connection on a device in
# CI (#13500): it builds the app against the demo edge on the runner,
# starts an emulator, installs the APK, and drives it — open, aeroplane
# mode, open again from the icon, answer a question, swipe the app
# away, network back — then checks the demo edge saw that answer
# exactly once. What Android does differently from desktop Chrome is
# in pm-stack/console/README.md under "With no connection".
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in order; a newer run never cancels one that is
# driving the emulator.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  offline-check:
    name: "check the app with no connection on a device"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the APK against the demo edge
        # The emulator reaches this machine as 10.0.2.2. The site is
        # plain http there, so the app opens as a Custom Tab rather
        # than a verified Trusted Web Activity; the web content under
        # test is the same.
        env:
          PM_CONSOLE_SITE: http://10.0.2.2:4897
        run: bash pm-stack/console/android/build.sh
      - name: Start the demo edge
        env:
          PM_CONSOLE_DEMO_ACT_LOG: ${{ github.workspace }}/pm-console-acts.jsonl
        run: |
          : >pm-console-acts.jsonl
          nohup bun run pm-stack/console/scripts/edge-demo.ts 4897 >edge-demo.log 2>&1 &
          echo $! >edge-demo.pid
          disown
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:4897/console/health" >/dev/null 2>&1; then
              echo "demo edge answers at http://127.0.0.1:4897/console/health"
              exit 0
            fi
            sleep 2
          done
          echo "the demo edge did not answer its health check" >&2
          cat edge-demo.log >&2
          exit 1
      # GitHub's current Ubuntu runners keep /dev/kvm closed to the
      # runner user, so the emulator action finds no hardware
      # acceleration and starts the emulator with -accel off, which
      # current emulator builds refuse outright: the emulator exits at
      # once and the step burns its whole boot timeout polling for a
      # device that never starts (runs 45397083403, 45464698161).
      # Open the device up the way the action's README prescribes for
      # these runners, so the emulator gets KVM and actually boots.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the app with no connection
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash pm-stack/console/android/offline-check.sh --apk pm-stack/console/android/app/build/outputs/apk/release/app-release.apk --edge-url http://127.0.0.1:4897 --act-log pm-console-acts.jsonl
      - name: Keep the act log and the edge log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pm-console-android-offline-logs
          path: |
            pm-console-acts.jsonl
            edge-demo.log
          if-no-files-found: warn
