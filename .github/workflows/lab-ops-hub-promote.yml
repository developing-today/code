name: Lab Ops Hub Worker promotion

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Exact Worker Version UUID printed by the upload workflow"
        required: true
        type: string
      confirm_promotion:
        description: "Confirm promotion of this exact version to 100% of traffic"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lab-ops-hub-worker-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VERSION_ID: ${{ inputs.version_id }}
    steps:
      - name: Keep promotion held until explicitly confirmed
        if: ${{ !inputs.confirm_promotion }}
        run: echo "::notice::Promotion held. Review the uploaded version UUID, then dispatch again with confirmation."

      - name: Checkout
        if: ${{ inputs.confirm_promotion }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24.22.0
        if: ${{ inputs.confirm_promotion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0

      - name: Install pinned cf and Wrangler toolchain
        if: ${{ inputs.confirm_promotion }}
        working-directory: pkgs/lab-ops-hub
        run: |
          npm ci --prefix release-tools
          ln -s release-tools/node_modules node_modules

      - name: Validate exact version UUID
        if: ${{ inputs.confirm_promotion }}
        working-directory: pkgs/lab-ops-hub
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const id = process.env.VERSION_ID;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id ?? "")) {
            throw new Error("version_id must be a UUID printed by the upload workflow");
          }
          writeFileSync("versions.json", JSON.stringify([{ version_id: id, percentage: 100 }]));
          NODE

      - name: Promote the selected version to 100%
        if: ${{ inputs.confirm_promotion }}
        working-directory: pkgs/lab-ops-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ./node_modules/.bin/cf workers deployments create
          --worker lab-ops-hub
          --strategy percentage
          --versions @versions.json
