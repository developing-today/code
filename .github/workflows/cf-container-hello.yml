name: cf-container-hello

# CI tier policy: see .github/ci-policy.md

# Test verification for pkgs/cf-container-hello (#1439).
#
# The package's only test suite — the Python regression suite for the
# #955 probe hardening (test/test_probe_hardening.py, 11 tests) — was
# run by nothing: no workflow, flake check, or justfile recipe mentions
# the package, so the pins could silently regress: the fail-closed
# API_TOKEN gate ordering in src/index.ts, the no-stale-crawler-copy
# rule, and the production validator's SSRF refusals. Several pins are
# source-shape checks that produce no other signal when broken. This
# workflow runs the single documented command (`npm test`, i.e.
# python3 -m unittest discover -s test -p 'test_*.py') on every change
# to the package.
#
# Cross-package trigger: the suite loads the production crawl
# validator from pkgs/lab-ops-hub/container/app.py (repo-root
# relative), so a change to that file can break this suite and is a
# trigger path below even though it lives in another package.
#
# The suite imports the production crawler validator, which uses the
# pinned dependency in pkgs/lab-ops-hub/container/requirements.txt. That
# Python dependency is installed directly; no npm packages are needed.

on:
  # Restored (#7716): the blanket trigger removal (5a94833ea3) left
  # this suite dispatch-only, so the #955 hardening pins had no
  # signal on the changes that can break them -- the package itself
  # and the cross-package validator it loads. Path-gated to exactly
  # those changes, per the header above and .github/ci-policy.md.
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      stage_versions:
        description: "Build and dry-run an unpromoted Worker Version (no upload)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Push-to-main runs each get their own group (keyed by run_id), so a
# later merge can never cancel — or displace a pending — verification
# run for an earlier merge: every merged tree gets its own completed
# run. Pull-request runs keep sharing a per-ref group, so a new push
# to a PR still supersedes its stale run (#392).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator runtime dependency
        run: python -m pip install -r pkgs/lab-ops-hub/container/requirements.txt

      - name: Run the #955 hardening suite
        working-directory: pkgs/cf-container-hello
        run: npm test

  stage-versions:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_versions == true && github.repository == 'developing-today/code' && github.ref == 'refs/heads/main'
    name: validate Worker Version staging (dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
      - name: Install isolated pinned cf toolchain
        working-directory: pkgs/cf-container-hello/release-tools
        run: |
          npm ci --no-audit --no-fund
          test ! -e ../node_modules
          ln -s release-tools/node_modules ../node_modules
          test "$(../node_modules/.bin/cf --version)" = "1.0.0-rc.1"
      - name: Build and verify exact Worker output, then dry-run Versions upload
        working-directory: pkgs/cf-container-hello
        run: |
          set -euo pipefail
          node release-tools/verify-config.mjs
          saved_package="$RUNNER_TEMP/cf-container-hello-package.json"
          cp package.json "$saved_package"
          restore_package() { cp "$saved_package" package.json; }
          trap restore_package EXIT
          npm pkg set 'devDependencies.wrangler=4.163.0'
          node_modules/.bin/cf build
          node release-tools/verify-build.mjs
          node_modules/.bin/cf workers versions create \
            --worker cf-container-hello \
            --prebuilt \
            --tag "git-${GITHUB_SHA::12}" \
            --message "git ${GITHUB_SHA}" \
            --dry-run
