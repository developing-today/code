name: id hosted-worker tests

# CI tier policy: see .github/ci-policy.md
#
# Test verification for pkgs/id/hosted-worker (#6095).
#
# The hosted Worker's routing suite — pkgs/id/hosted-worker/test/
# routing.test.ts, the only tests for src/routing.ts — was run by no
# workflow, flake check, justfile recipe, or Nix build. The id
# workflows and flake checks cover the Rust crates and web/, never
# this package, so the fail-closed routing pins (binding ids are
# minted 32-char lowercase hex, never emails or provider subjects;
# jurisdiction-restricted namespace only, no unrestricted fallback)
# could regress with no signal.
#
# This workflow runs the package's own test script (npm test =
# node --test test/routing.test.ts) on pushes to main that touch
# pkgs/id/hosted-worker/ and on dispatch, following the house
# pattern for test workflows (bin-tests.yml). Main tier only: not
# a merge gate.
#
# The smoke step (#6370) runs smoke/smoke.mjs - the only coverage
# for the UserDO and the worker fail-closed matrix (it boots local
# wrangler dev for both the application worker and the test-only
# UserDO harness). It was previously run by no workflow. The step
# installs the package devDependencies first (wrangler), which the
# routing suite does not need.
#
# The run step first fails if the suite or the package manifest is
# missing, so a green run can never be a silently skipped suite.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pkgs/id/hosted-worker/**"
      - ".github/workflows/id-hosted-worker-tests.yml"

permissions:
  contents: read

concurrency:
  group: id-hosted-worker-tests-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-worker-tests:
    name: "full (main tier): hosted-worker routing suite"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the hosted-worker routing suite
        working-directory: pkgs/id/hosted-worker
        run: |
          if [ ! -f test/routing.test.ts ]; then
            echo "::error::pkgs/id/hosted-worker/test/routing.test.ts is missing — the routing suite was not run."
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "::error::pkgs/id/hosted-worker/package.json is missing — the routing suite was not run."
            exit 1
          fi
          npm test
      # #6370: the smoke suite (smoke/smoke.mjs, 15 checks) is the only
      # coverage for src/user-do.ts and the worker fail-closed matrix in
      # src/worker.ts. It drives two local 
 ⛅️ wrangler 4.147.0
──────────────────── passes, so it
      # needs the package's devDependencies (wrangler) installed first.
      # The guard fails the run if the suite is missing, so a green run
      # can never be a silently skipped suite.
      - name: Run the hosted-worker smoke suite
        working-directory: pkgs/id/hosted-worker
        run: |
          if [ ! -f smoke/smoke.mjs ]; then
            echo "::error::pkgs/id/hosted-worker/smoke/smoke.mjs is missing — the smoke suite was not run."
            exit 1
          fi
          npm install --no-audit --no-fund
          npm run smoke
      - name: Run the hosted-worker smoke (UserDO + fail-closed matrix)
        working-directory: pkgs/id/hosted-worker
        run: |
          if [ ! -f smoke/smoke.mjs ]; then
            echo "::error::pkgs/id/hosted-worker/smoke/smoke.mjs is missing - the smoke was not run."
            exit 1
          fi
          npm install --no-audit --no-fund
          npm run smoke
