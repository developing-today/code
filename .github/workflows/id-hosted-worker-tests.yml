name: id hosted-worker tests (diag scratch — not for merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Run front-door files with TAP output
        working-directory: pkgs/id/hosted-worker
        run: |
          mkdir -p /tmp/tap
          node --version > /tmp/tap/node-version.txt
          for f in front-door.test.ts front-door-auth.test.ts cse-blobs.test.ts routing-boundary.test.ts; do
            node --experimental-transform-types --test --test-reporter=tap "test/$f" > "/tmp/tap/$f.tap" 2>&1 || true
          done
      - name: Upload TAP diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tap-diag
          path: /tmp/tap/
