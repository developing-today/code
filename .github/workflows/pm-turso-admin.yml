name: pm-turso-admin

# Turso management operations for the PM platform's stores (#14257):
# create a database, or mint a token for one. These need the Turso
# organisation's token, which is held ONLY here: the repository secret
# TURSO_PLATFORM_API_TOKEN is read by name in this workflow's runner
# and nowhere else — never in the Worker, never in the console, never
# printed. A minted token goes straight from the Turso CLI's output
# file into the repository's secret store under the name given; it is
# never printed in a log, a run summary, or the app.
#
# Decision (FDR-0013, recorded on #14257): the organisation token is
# placed in the repository's secret store for this one workflow — the
# same pattern #13495 proposes for the Cloudflare token. Until that
# secret is provisioned, every run fails loudly at the first step.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - create-db
          - mint-token
      database:
        description: "Turso database name (lowercase letters, digits, hyphens)"
        required: true
        type: string
      group:
        description: "create-db only: the group the database is born in"
        required: false
        default: "great-star-lord"
        type: string
      expiry:
        description: "mint-token only: token lifetime, e.g. 4w, 30d, never"
        required: false
        default: "4w"
        type: string
      secret_name:
        description: "mint-token only: repository secret name to hold the minted token"
        required: false
        type: string

permissions:
  contents: read

jobs:
  turso-admin:
    name: ${{ inputs.operation }} ${{ inputs.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The organisation token, by name only, in the runner only.
      TURSO_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      # Used only to write a minted token into the secret store.
      GH_TOKEN: ${{ secrets.REPO_AUTOMATION_TOKEN }}
    steps:
      - name: Refuse a malformed request or a missing organisation token
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_DATABASE: ${{ inputs.database }}
          INPUT_GROUP: ${{ inputs.group }}
          INPUT_EXPIRY: ${{ inputs.expiry }}
          INPUT_SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_API_TOKEN:-}" ]; then
            echo "::error::TURSO_PLATFORM_API_TOKEN is not provisioned in the repository secret store; the operation was not attempted."
            exit 1
          fi
          if ! printf '%s' "$INPUT_DATABASE" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::database is not a Turso database name."
            exit 1
          fi
          case "$INPUT_OPERATION" in
            create-db)
              if [ "$INPUT_GROUP" != "great-star-lord" ]; then
                echo "::error::group must be great-star-lord, the fleet's one Turso group."
                exit 1
              fi
              ;;
            mint-token)
              if ! printf '%s' "$INPUT_EXPIRY" | grep -Eq '^([0-9]+[dwmy]|never)$'; then
                echo "::error::expiry must be a span like 4w, 30d or never."
                exit 1
              fi
              if ! printf '%s' "$INPUT_SECRET_NAME" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]{0,254}$'; then
                echo "::error::secret_name is required for mint-token and must be a secret name."
                exit 1
              fi
              secret_name_upper="$(printf '%s' "$INPUT_SECRET_NAME" | tr '[:lower:]' '[:upper:]')"
              if [[ "$secret_name_upper" == GITHUB_* || "$secret_name_upper" == TURSO_PLATFORM_API_TOKEN || "$secret_name_upper" == REPO_AUTOMATION_TOKEN ]]; then
                echo "::error::secret_name cannot replace a protected workflow credential."
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown operation $INPUT_OPERATION"
              exit 1
              ;;
          esac

      - name: Install the Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Create the database (born --tursodb, in the named group)
        if: inputs.operation == 'create-db'
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          INPUT_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail
          # The creation rule in doc/fleet/turso-databases.md: every new
          # fleet database is born --tursodb, in the named group.
          turso db create "$INPUT_DATABASE" --group "$INPUT_GROUP" --tursodb --wait
          echo "Created database $INPUT_DATABASE in group $INPUT_GROUP." >> "$GITHUB_STEP_SUMMARY"

      - name: Mint a token and store it under its secret name
        if: inputs.operation == 'mint-token'
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          INPUT_EXPIRY: ${{ inputs.expiry }}
          INPUT_SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/minted-token"
          # The token value travels CLI -> file -> secret store. It is
          # never echoed, summarised or passed as an argument.
          turso db tokens create "$INPUT_DATABASE" --expiration "$INPUT_EXPIRY" > "$token_file"
          if [ ! -s "$token_file" ]; then
            echo "::error::the Turso CLI minted no token for $INPUT_DATABASE."
            exit 1
          fi
          gh secret set "$INPUT_SECRET_NAME" --repo "$GITHUB_REPOSITORY" < "$token_file"
          rm -f "$token_file"
          echo "Minted a token for $INPUT_DATABASE (expiry $INPUT_EXPIRY) into the repository secret named $INPUT_SECRET_NAME." >> "$GITHUB_STEP_SUMMARY"
