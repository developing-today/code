name: worktree janitor

# CI tier policy: see .github/ci-policy.md
on:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "basic: worktree janitor deletion safety"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run deletion-safety tests
        run: |
          test -f infra/worktree-janitor/tests/test_worktree_janitor.py
          python3 infra/worktree-janitor/tests/test_worktree_janitor.py
