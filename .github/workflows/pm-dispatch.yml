name: pm-dispatch

# pm-dispatch dispatch hub -- fires a tracked OpenCode session on the
# laptop (via pm-dispatch) from any GitHub event. It uses the reusable
# pm-dispatch starter action
# (./.github/actions/pm-dispatch-start, loaded from a checkout of
# this repo), which creates the tracking issue, enqueues the task,
# and launches the session. Each job is independently disable-able by deleting it.
#
# No repository secret is required: each job grants
# `permissions: id-token: write`, and the starter action mints a GitHub
# Actions OIDC token (audience pm-dispatch) to authenticate to
# pm-dispatch.
#
# This file was named jules.yml, and the remediation label below was
# named `jules`, until the 2026-11-11 rename: the hub was previously
# backed by the Jules service (decommissioned, #5098). The label is
# now `dispatch/remediate`; applying it starts remediation via this
# dispatch flow.
#
# Dispatch launches sessions promptly, so the cron schedules below are
# deliberately infrequent to avoid flooding the laptop session pool.

on:
  schedule:
    # Weekly cleanup, Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to the dispatched OpenCode session"
        required: true
        type: string

# No workflow-level concurrency group (#304): for workflow_run events
# github.ref is the default branch, so one shared group let any noise
# completion cancel a pending ci-failure-fix run (queue: single). Each job
# carries its own group below, keyed by its target, so a run whose jobs all
# skip can never displace a run that would act.

permissions:
  contents: read
  issues: read

jobs:
  weekly-cleanup:
    if: github.event_name == 'schedule'
    concurrency:
      group: ${{ github.workflow }}-weekly-cleanup
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      # Loaded from this checkout, not the remote @main form: the remote
      # form makes the runner download the whole repo as an action archive,
      # which fails with Could not find file .../_staging/code-<sha>/archive
      # (issue #5332, #4742 defect class).
      - name: Check out the pm-dispatch actions
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dispatch weekly cleanup via pm-dispatch
        id: dispatch
        uses: ./.github/actions/pm-dispatch-start
        with:
          title: "Weekly housekeeping cleanup"
          prompt: >-
            Review the repository for low-risk housekeeping: dead code,
            unused dependencies, stale TODOs and obvious documentation drift.
            Open a single pull request with the changes, and explain each one.
            Do not make behavioural changes. Batch every instance of the same
            problem into that one PR — update related dependencies together,
            never one PR per dependency. Merging is permitted but never
            required: merge only when checks pass and you are reasonably
            certain the PR is correct and low-risk; otherwise leave it open
            and state your confidence and what a human should check.

  # Triggered by applying the `dispatch/remediate` label to an issue
  # (main-broken.yml applies it under its remediation budget); it starts
  # an OpenCode session via pm-dispatch. The label was named `jules`
  # until the 2026-11-11 rename.
  issue-labeled:
    if: github.event_name == 'issues' && github.event.label.name == 'dispatch/remediate'
    concurrency:
      group: ${{ github.workflow }}-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      # Loaded from this checkout, not the remote @main form: the remote
      # form makes the runner download the whole repo as an action archive,
      # which fails with Could not find file .../_staging/code-<sha>/archive
      # (issue #5332, #4742 defect class).
      - name: Check out the pm-dispatch actions
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dispatch issue fix via pm-dispatch
        id: dispatch
        uses: ./.github/actions/pm-dispatch-start
        with:
          title: ${{ github.event.issue.title }}
          prompt: >-
            Address GitHub issue #${{ github.event.issue.number }}:
            "${{ github.event.issue.title }}".
            ${{ github.event.issue.body }}
            Open a pull request that fixes it. Put "Fixes #${{ github.event.issue.number }}"
            in the pull request description so the issue closes on merge, and
            cover any same-set instances of the problem (including related
            dependency updates) in the same PR rather than separately.

  # ci-failure-fix (the workflow_run-triggered CI-failure fixer) was
  # removed: it is superseded by the ci-fix job inside the main CI
  # workflow (.github/workflows/nix-ci.yml), which dispatches via
  # pm-dispatch-ci-fix from inside the failing run itself -- there is
  # no workflow_run design anymore. The workflow_run trigger above
  # went with it (it existed only for that job).

  manual:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: ${{ github.workflow }}-manual
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      # Loaded from this checkout, not the remote @main form: the remote
      # form makes the runner download the whole repo as an action archive,
      # which fails with Could not find file .../_staging/code-<sha>/archive
      # (issue #5332, #4742 defect class).
      - name: Check out the pm-dispatch actions
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dispatch manual prompt via pm-dispatch
        id: dispatch
        uses: ./.github/actions/pm-dispatch-start
        with:
          title: "Manual pm-dispatch run"
          prompt: ${{ inputs.prompt }}
