name: fleet-queue-backup tests

on:
  push:
    branches: [main]
    paths: [infra/fleet-queue-backup/**, .github/workflows/fleet-queue-backup-tests.yml]
  pull_request:
    paths: [infra/fleet-queue-backup/**, .github/workflows/fleet-queue-backup-tests.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: unit tests
        run: |
          set -e
          for t in infra/fleet-queue-backup/tests/test_*.py; do
            echo "== $t"
            python3 -I "$t"
          done
