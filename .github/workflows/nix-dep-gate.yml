name: nix dep gate

# CI tier policy: see .github/ci-policy.md
#
# Dependency-bump Nix gate (#14195): dependabot bumps lockfiles and
# manifests without regenerating the pinned Nix hashes (vendorHash,
# npmDepsHash, FOD) covering those trees, so the NixOS build breaks on
# main — four instances in one night plus the Cargo-side variant
# (#14315). The companion rule enforced here: a diff touching a
# derivation's dependency inputs must ship the pinned-hash refresh in
# the same diff. See scripts/check-nix-dep-gate.sh for the covered
# derivation table and deliberate exclusions.
#
# Venue is push-to-main path-filtered + nightly + workflow_dispatch, not
# pull_request: repo CI doctrine is nightly-main (ci-policy.md), so
# pre-merge gating is left to local invocation of the script against the
# PR diff (documented in the script header). The push venue catches a
# stale merge at the narrowest change instead of at the next laptop
# rebuild; the nightly run is the backstop.
#
# No merge_group trigger: main has no merge queue (Drew ruling,
# 2026-11-08; see .github/ci-policy.md).
on:
  push:
    branches:
      - main
    paths:
      - "pkgs/**/go.mod"
      - "pkgs/**/go.sum"
      - "pkgs/**/package.json"
      - "pkgs/**/package-lock.json"
      - "pkgs/**/Cargo.toml"
      - "pkgs/**/Cargo.lock"
      - "pkgs/**/flake.nix"
      - "pkgs/**/flake.lock"
      - "pkgs/**/package.nix"
      - "pkgs/**/default.nix"
      - "scripts/check-nix-dep-gate.sh"
      - "scripts/tests/test_check_nix_dep_gate.py"
      - ".github/workflows/nix-dep-gate.yml"
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Same concurrency contract as research-workflow.yml: push-to-main runs
# are keyed by run_id so every merged tree gets its own completed run;
# dispatch/schedule runs share a per-ref group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  nix-dep-gate:
    name: "basic: nix dep gate (#14195)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs base..head; a shallow checkout may not carry
          # the base SHA (push events) or any history at all.
          fetch-depth: 0
      - name: Run Nix dependency-bump gate (#14195)
        run: |
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base='HEAD~1'
          fi
          scripts/check-nix-dep-gate.sh --base "$base" --head HEAD
      - name: Run gate contract tests (#14195)
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_nix_dep_gate.py' -v
