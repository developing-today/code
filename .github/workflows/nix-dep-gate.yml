name: nix dep gate

# CI tier policy: see .github/ci-policy.md
#
# Dependency-bump Nix gate (#14195): dependabot bumps lockfiles and
# manifests without regenerating the pinned Nix hashes (vendorHash,
# npmDepsHash, FOD) covering those trees, so the NixOS build breaks on
# main — four instances in one night plus the Cargo-side variant
# (#14315). The companion rule enforced here: a diff touching a
# derivation's dependency inputs must ship the pinned-hash refresh in
# the same diff. See scripts/check-nix-dep-gate.sh for the covered
# derivation table and deliberate exclusions.
#
# Venue is nightly schedule + workflow_dispatch, not push or
# pull_request: repo CI doctrine is nightly-main (ci-policy.md; Drew
# ruling 2026-11-16 — the only push triggers left are deploys, and the
# agreement checker enforces the canonical inline `branches: [main]`
# form, which a new gate has no reason to carry). Pre-merge gating is
# left to local invocation of the script against the PR diff
# (documented in the script header); the nightly run is the backstop
# that keeps the script and its contract tests green.
#
# No merge_group trigger: main has no merge queue (Drew ruling,
# 2026-11-08; see .github/ci-policy.md).
on:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Diff base ref for the gate (default: HEAD~1)"
        required: false
        default: "HEAD~1"
      head:
        description: "Diff head ref for the gate (default: HEAD)"
        required: false
        default: "HEAD"

permissions:
  contents: read

# Same concurrency contract as research-workflow.yml: nightly runs
# are keyed by run_id so every scheduled tree gets its own completed
# run; dispatch runs share a per-ref group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  nix-dep-gate:
    name: "basic: nix dep gate (#14195)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs base..head; a shallow checkout may not carry
          # the base SHA, and dispatch inputs may name any ref.
          fetch-depth: 0
      - name: Run Nix dependency-bump gate (#14195)
        run: |
          base='${{ inputs.base }}'
          head='${{ inputs.head }}'
          [ -n "$base" ] || base='HEAD~1'
          [ -n "$head" ] || head='HEAD'
          scripts/check-nix-dep-gate.sh --base "$base" --head "$head"
      - name: Run gate contract tests (#14195)
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_nix_dep_gate.py' -v
