name: acpx wrapper tests

# CI tier policy: see .github/ci-policy.md
#
# Test verification for the acpx muse agent wrapper (#14757).
#
# home/openclaw/acpx/muse-agent-acp-wrapper.test.mjs — the regression
# suite for the ACP<->MSP adapter (the #1721 gates: env hygiene, pool
# check, turn budget, ledger, terminal auth error, exec fallback; and
# the #5762 home-resolution contract probes) — was run by no workflow,
# so it executed only when a human remembered to run node --test by
# hand. This workflow runs it on dispatch and nightly, following the
# house pattern for test workflows (bin-tests.yml). Main tier only:
# not a merge gate.
#
# The run step first fails if the suite is missing, so a green run can
# never be a silently skipped suite.

on:
  workflow_dispatch:
  schedule:
    # Nightly instead of on every push to main (Drew, 2026-11-16; see
    # .github/ci-policy.md "Nightly main CI").
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: acpx-wrapper-tests-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  acpx-wrapper-tests:
    name: "full (main tier): acpx muse wrapper suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Run the acpx muse wrapper suite
        run: |
          if [ ! -f home/openclaw/acpx/muse-agent-acp-wrapper.test.mjs ]; then
            echo "::error::home/openclaw/acpx/muse-agent-acp-wrapper.test.mjs is missing — the suite was not run."
            exit 1
          fi
          node --test home/openclaw/acpx/muse-agent-acp-wrapper.test.mjs
