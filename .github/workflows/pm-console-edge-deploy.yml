name: pm-console-edge deploy

# CI tier policy: see .github/ci-policy.md. This is a deploy, not CI,
# so it keeps a push trigger (restricted to main).
#
# Deploys the Worker that serves the PM app from the edge
# (pm-stack/console/edge): every push to main that touches the console,
# or a manual run, runs the console's tests (which drive the Worker's
# routing and state against the host's real handler), bundles the
# Worker, and uploads it with the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets, the ones message-bridge
# deploys with.
#
# The Worker has no secrets from this deploy: the keys it uses it makes
# itself, or are published by the host. Three secrets are optional, put
# there by the host's scripts/expose.py --edge-direct (off by default):
# GITHUB_TOKEN and QUEUE_TOKEN, which let it act itself while the laptop
# is away, and EDGE_DIRECT, the opt-in that must read `on`. It has no
# route here either. The host's pm-stack/console/scripts/expose.py sends
# the hostname through it once it answers its health check, and
# `expose.py --edge off` takes the hostname off it again, which is the
# rollback that needs no deploy. A manual run with rollback_version puts
# an earlier version back.
#
# Until both secrets exist the job says so in its summary and skips the
# upload instead of failing.
on:
  push:
    branches: [main]
    paths:
      - "pm-stack/console/**"
      - "!pm-stack/console/android/**"
      - "pm-stack/aggregator/src/assets/icons/**"
      - ".github/workflows/pm-console-edge-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Existing Worker version id to put back instead of uploading; empty deploys this commit"
        required: false
        default: ""

permissions:
  contents: read

# Deploys run one at a time, in order; a newer push never cancels one
# that is uploading.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy pm-console-edge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipped the upload: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy pm-console-edge from the repo." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the console and its edge
        working-directory: pm-stack/console
        run: bun test
      - name: Install the deploy tool
        working-directory: pm-stack/console/edge
        run: npm ci --no-audit --no-fund
      - name: Bundle the Worker
        working-directory: pm-stack/console/edge
        run: |
          node build.mjs
          npx wrangler deploy --dry-run --outdir .wrangler/dry
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: pm-stack/console/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          # The input goes through the env, never into the script text,
          # and must look like a version id before it is used.
          if [ -n "${ROLLBACK_VERSION:-}" ]; then
            if ! printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
              echo "rollback_version is not a version id" >&2
              exit 2
            fi
            npx wrangler rollback "$ROLLBACK_VERSION" --yes --message "rollback from workflow run ${GITHUB_RUN_ID}"
            echo "Put pm-console-edge back to version ${ROLLBACK_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler deploy --var "VERSION:${GITHUB_SHA::12}" --message "git ${GITHUB_SHA}"
            echo "Deployed pm-console-edge from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the deployed Worker answers
        if: steps.secrets.outputs.ready == 'true' && inputs.rollback_version == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The workers.dev address answers the health check and the
          # public files only. Its subdomain is the account's.
          sub="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
          url="https://pm-console-edge.${sub}.workers.dev/console/health"
          want="${GITHUB_SHA::12}"
          for attempt in $(seq 1 20); do
            got="$(curl -fsS --max-time 10 "$url" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("version") if d.get("ok") and d.get("edge") else "")' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "pm-console-edge answers as ${want}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "the deployed Worker did not answer its health check as ${want} (last answer: ${got:-none})" >&2
          exit 1
