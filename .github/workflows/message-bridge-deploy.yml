name: message-bridge deploy

# CI tier policy: see .github/ci-policy.md. This is a deploy, not CI,
# so it keeps a push trigger (restricted to main).
#
# Deploys the message-bridge Worker (pkgs/message-bridge/worker, the
# Claude custom connector that sends and receives messages) from the
# repo: every push to main that touches the Worker, or a manual run,
# runs its tests (the flake package's checkPhase) and then
#   nix run .#message-bridge-deploy -- --code-only
# which uploads a cf Worker version tagged with the commit, using the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets,
# and deploys it. The version keeps the Worker's ACCESS_TOKEN, so the
# connector URL never changes and no Bitwarden or sops access is
# needed here. A manual run with rollback_version deploys that existing
# version instead (--deploy-version). Rotating the access token stays a
# local full deploy (see the Worker's README).
#
# Until both secrets exist the job says so in its summary and skips
# the upload instead of failing.
on:
  push:
    branches: [main]
    paths:
      - "pkgs/message-bridge/**"
      - ".github/workflows/message-bridge-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Existing Worker version id to deploy instead of uploading (rollback); empty deploys this commit"
        required: false
        default: ""

permissions:
  contents: read

# Deploys run one at a time, in order; a newer push never cancels one
# that is uploading.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy message-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy message-bridge from the repo." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # The deploy app's runtime closure includes bws (unfree), which the
      # laptop allows and a fresh runner refuses (run 44465718979).
      # Allow it here the way nix-ci.yml does; NIXPKGS_ALLOW_UNFREE is
      # only honoured with --impure. --code-only never runs bws.
      - name: Build and test the Worker package
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix build --impure .#messageBridge .#messageBridgeDeploy --print-build-logs
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          # The input goes through the env, never into the script text;
          # deploy.mjs rejects anything that isn't a version id.
          if [ -n "${ROLLBACK_VERSION:-}" ]; then
            nix run --impure .#message-bridge-deploy -- --deploy-version "$ROLLBACK_VERSION"
            echo "Rolled message-bridge back to version ${ROLLBACK_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          else
            nix run --impure .#message-bridge-deploy -- --code-only
            echo "Deployed message-bridge from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          fi
