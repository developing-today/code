# Verification + artifact publishing for the Roc space-invaders game
# (#14939, slice 5 of #14861).
#
# Builds the game to wasm with the pinned Roc toolchain (the pkgs/id
# nix dev shell — the game is never compiled on a seat or the
# laptop), runs the Roc module tests and the game's own expects
# (including the scripted playthrough), drives the built module
# through the plaza ABI with the same script (smoke/drive.mjs), and
# publishes the app bundle — app.toml, program sources, the built
# space-invaders.wasm, and the smoke driver — as a workflow artifact
# other machines pull instead of rebuilding. #14862's three-machine
# chess/checkers demonstration reuses this artifact pattern.
#
# Main tier only (CI policy: pushes to main + manual dispatch).

name: id roc game

# CI tier policy: see .github/ci-policy.md

on:
  push:
    branches: [main]
    paths:
      - "pkgs/id/apps/space-invaders/**"
      - "pkgs/id/examples/roc-world/**"
      - "pkgs/id/examples/roc-cap-demo/**"
      - "pkgs/id/scripts/roc-test.sh"
      - "pkgs/id/scripts/key-parity-test.sh"
      - "pkgs/id/scripts/term-parity-test.sh"
      - ".github/workflows/id-roc-game.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push-to-main runs are keyed by run_id so every merged tree gets its
# own completed run; manual dispatches share a per-ref group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: "build + test + smoke + artifact"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            # Same #774 fallback as id-bench: when the Magic Nix
            # Cache proxy throttles, build from source instead of
            # hard-failing on the narinfo fetch.
            fallback = true

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        continue-on-error: true
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build the game to wasm (pinned Roc toolchain)
        run: nix develop ./pkgs/id --command bash pkgs/id/apps/space-invaders/program/build.sh

      - name: Roc module tests
        run: nix develop ./pkgs/id --command bash pkgs/id/scripts/roc-test.sh

      - name: Game tests (incl. the playthrough smoke expects)
        run: nix develop ./pkgs/id --command roc test pkgs/id/apps/space-invaders/program/main.roc

      - name: Playability smoke — drive the built module
        run: bash pkgs/id/apps/space-invaders/smoke/smoke.sh pkgs/id/apps/space-invaders/program/space-invaders.wasm

      - name: Record the artifact in the job summary
        run: |
          wasm=pkgs/id/apps/space-invaders/program/space-invaders.wasm
          {
            echo "## space-invaders artifact"
            echo ""
            echo "- module: \`$wasm\` ($(stat -c%s "$wasm") bytes, sha256 \`$(sha256sum "$wasm" | cut -d' ' -f1)\`)"
            echo "- bundle: \`pkgs/id/apps/space-invaders\` (app.toml, program sources, built wasm, smoke driver)"
            echo "- artifact name: \`space-invaders-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the game bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: space-invaders-${{ github.sha }}
          path: pkgs/id/apps/space-invaders
          if-no-files-found: error
