version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      - "pkgs/grok-cli/**"
      - "pm-stack/voice-line-worker/**"
  - package-ecosystem: "bun"
    directory: "/pm-stack/voice-line-worker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/pkgs/identity/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/pkgs/id"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/pkgs/fleet"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/pkgs/atlas-search"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/pkgs/note-submission"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/pkgs/dht"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/pkgs/chat"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
