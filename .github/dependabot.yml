version: 2
# One weekly PR per ecosystem (Drew, 2026-11-17). Ungrouped daily/weekly
# bumps piled up as dozens of single-package PRs, and each Go bump on its
# own breaks the nix build (vendorHash) until someone refreshes it. A
# grouped PR collects the week's bumps so the hash is refreshed once.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # dtolnay/rust-toolchain's tag is the Rust version it installs, not an
    # action release, and the repo carries tags for versions that are not
    # out yet (Dependabot proposed 1.120.0 over 1.99.1). The toolchain pin
    # moves deliberately, with the code it builds.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/pkgs/supergateway"
    schedule:
      interval: "weekly"
    # Tarball-built npm packages (#14164): the Nix build pins a fixed
    # registry tarball `src` plus a vendored lockfile, so a Dependabot
    # lockfile-only bump cannot build (tarball-pin skew, stale
    # npmDepsHash). These dirs stay excluded; bump them manually per
    # each default.nix header (version + hash, regenerate lock,
    # refresh npmDepsHash). Must-exclude-if-manifest-vendored:
    # pkgs/wrangler, pkgs/command-code, pkgs/desktop-commander (same
    # tarball + vendored-lock shape, no vendored manifest today, so
    # Dependabot currently skips them).
    exclude-paths:
      - "pkgs/cf/**"
      - "pkgs/grok-cli/**"
      - "pkgs/supergateway/**"
      - "pm-stack/voice-line-worker/**"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/pm-stack/voice-line-worker"
    schedule:
      interval: "weekly"
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/pkgs/identity/web"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directories:
      - "/pkgs/id"
      - "/pkgs/fleet"
      - "/pkgs/atlas-search"
      - "/pkgs/note-submission"
      - "/pkgs/dht"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directories:
      - "/pkgs/chat"
      - "/pkgs/database"
      - "/pkgs/fleet/placement"
      - "/pkgs/graph"
      - "/pkgs/identity"
      - "/pkgs/import"
      - "/pkgs/launcher"
      - "/pkgs/map"
      - "/pkgs/mcpx"
      - "/pkgs/roc/platforms/go-basic-cli"
      - "/pkgs/tea"
    schedule:
      interval: "weekly"
    # charmbracelet/ssh v0.4.x+ declares itself as charm.land/ssh, so
    # Dependabot's gomod update fails the module-path check in chat,
    # identity, launcher and tea (run 45347745147). Ignored until the
    # imports move to charm.land/ssh deliberately.
    ignore:
      - dependency-name: "github.com/charmbracelet/ssh"
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: "terraform"
    directory: "/infra/dns"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/pkgs/grok-cli"
    schedule:
      interval: "weekly"
    groups:
      npm-grok-cli:
        patterns: ["*"]
