# Scoped ignores for pinned-tool lag only (issue #2845).
#
# actionlint 1.7.12 has not picked up the documented `concurrency.queue`
# key: `queue: max` is valid GitHub workflow syntax (up to 100 pending
# runs) whenever `cancel-in-progress` is false, which holds at every use
# in this repo (verified against docs.github.com workflow-syntax,
# 2026-11-03). Ignore ONLY that message, only on the files that use the
# key -- do not widen this to other syntax-check findings.
paths:
  .github/workflows/jules.yml:
    ignore:
      - message: 'unexpected key "queue" for "concurrency" section'
        kind: syntax-check
  .github/workflows/jules-daily-codebase-ideation.yml:
    ignore:
      - message: 'unexpected key "queue" for "concurrency" section'
        kind: syntax-check
