[package]
name = "rust-sketch"
version = "0.1.0"
edition = "2021"
description = "Playable Rust Plaza world: the Sketch guest for sketch/redo-as-new-stroke (#13608), built on the plaza-sdk crate in ../rust-world."
license = "MIT OR Apache-2.0"

# Standalone crate: intentionally not a member of the pkgs/id workspace,
# like the other example guests. It builds for the host (unit tests) and
# for wasm32-unknown-unknown (the guest module).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plaza-sdk = { path = "../rust-world" }
