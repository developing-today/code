[package]
name = "id-import-notion"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Notion importer manifest, inventory, page/block conversion, and database schema-claim primitives (slices 1-3, #8419/#13522/#13523)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
