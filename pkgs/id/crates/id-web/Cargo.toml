[package]
name = "id-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Web layer of the id crate: HTTP/WS server, routes, templates and markdown (pkgs/id crate split step 6c, #4409)"
license = "MIT OR Apache-2.0"

# Step 6c of the pkgs/id crate split (#3447 umbrella, #4409): the web
# layer lives here. It is a pure consumer of the lower crates
# (id-core, id-caps, id-store, id-events, id-groups, id-sync,
# id-directory, id-worlds) and depends on all of them downward; the
# facade re-exports this crate as `id::web` under its `web` feature,
# so existing call sites are unchanged. The web-only dependencies
# (axum, tower, rust-embed, comrak, ...) moved here from the facade
# manifest with the code.

[features]
default = []
sandbox = ["id-worlds/sandbox"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["rand_core"] }
id-caps = { path = "../id-caps", default-features = false }
id-core = { path = "../id-core", default-features = false, features = [
  "web",
  "world",
] }
id-directory = { path = "../id-directory", default-features = false }
id-events = { path = "../id-events", default-features = false }
id-groups = { path = "../id-groups", default-features = false }
id-store = { path = "../id-store", default-features = false }
id-sync = { path = "../id-sync", default-features = false }
id-worlds = { path = "../id-worlds", default-features = false }
iroh-base = "1"
iroh-blobs = "0.103"
redb = "=4.3.0"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc" }
rand = "0.10"
toml = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "compression-gzip"] }
rust-embed = { version = "8" }
mime_guess = { version = "2" }
futures = { version = "0.3.32" }
comrak = { version = "0.56", default-features = false }
urlencoding = { version = "2" }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.13" }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
id-core = { path = "../id-core", default-features = false, features = [
  "test-utils",
] }
# The web tests drive the world hub through its test-support module
# (world_hub::testing), as the facade test build did.
id-worlds = { path = "../id-worlds", default-features = false, features = [
  "test-utils",
  "sandbox",
] }
iroh = "1"
iroh-docs = "0.101"
iroh-gossip = { version = "0.101", features = ["net"] }
proptest = "1.12"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
