[package]
name = "id-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Store layer of the id crate: store traits, blob store, event headers, documents, tags and search (pkgs/id crate split step 2a, #4405)"
license = "MIT OR Apache-2.0"

# Step 2a of the pkgs/id crate split (#3447 umbrella, #4405): the store
# family (store_traits, store, chain, documents, tag_claims, tag_index,
# tags, search) lives here, together with the event-store vocabulary types
# (event_types, range) the traits name and the header-embedded op
# vocabularies chain validates (chat, notes, note_links,
# session_checkpoint, issuer_rotation, policy). It depends on id-core
# only; the event-store implementation that consumes these types follows
# in step 2b (id-events) and must never be depended on from here.

[features]
default = []

[dependencies]
anyhow = "1"
blake3 = "1"
cbor-core = { version = "=0.10.1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures-lite = "2"
id-core = { path = "../id-core", default-features = false }
iroh = "1"
iroh-base = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc" }
# Store traits only. The default features would pull in SQLite.
p2panda-store = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc", default-features = false }
postcard = { version = "1", features = ["alloc"] }
redb = "=4.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
# The store_traits tests run against the real EventStore. Until step 2b
# (id-events) lands it lives in the facade package, so the tests dev-depend
# on it; production code in this crate never names the facade.
dcbor = "=0.25.2"
id = { path = "../.." }
iroh-gossip = { version = "0.101", features = ["net"] }
tempfile = "3"

[lints.rust]
# Rust compiler lints
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
# Treat some warnings as errors in CI
# dead_code = "deny"
# unused_imports = "deny"

[lints.clippy]
# Enable standard lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
# Allow print macros - this is a CLI application
print_stdout = "allow"
print_stderr = "allow"

# Restriction lints - selectively enable valuable checks
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
# string_to_string removed - clippy::implicit_clone covers it
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"

# Allow specific lints - too noisy or conflict with project style
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
# Allow these - they're reasonable for CLI app complexity
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
# TODO(P8.8): Clippy 1.99 fires these on about 50 `assert!(x.is_empty())` sites
# and 2 `chunks_exact` sites. Allowed until the lints review in plan step P8.8
# (doc/2026-10-11T11-08-42Z_design_remaining_work/plan-phases.md).
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
