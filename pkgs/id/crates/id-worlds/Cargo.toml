[package]
name = "id-worlds"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Worlds layer of the id crate: the world runtime, sessions, sandbox and cross-world authority (pkgs/id crate split step 5, #4408)"
license = "MIT OR Apache-2.0"

# Step 5 of the pkgs/id crate split (#3447 umbrella, #4408): the world
# family lives here. Dependencies per the design map: id-core, id-caps,
# id-store, id-events, id-groups, id-sync.
#
# Step 5a brought the leaves, seam 6's cross-world bridge
# (`groups::worlds`) and the blob gate's `FoldedWorlds` adapter.
# Step 5b brought the runtime core, and step 5c the remainder
# (`world_dev`, `world_doctor`, `world_ssh`, `world_replication_net`).
#
# Step 5b brings the runtime core: `world`, `world_session`, the
# sandbox and its compile/fixture/native paths, the hub, net and
# store, `world_records` and `shell_contract` — and, with them, the
# directory cluster (`directory`, `directory_auth`, `directory_view`,
# `directory_mail`). The directory is the world runtime's own state:
# `WorldCore` holds it, the world actor executes directory actions
# against it, and `world_store` persists it beside the journal, so
# the cluster moves as the consumer side of the relationship (the
# seam-6 pattern). Seam 10's remaining half is unchanged by this:
# step 6's `id-directory` extraction must still invert or re-home
# `WorldCore`'s hold on the directory, exactly as it would have had
# to from the facade. The facade re-exports the directory modules at
# their historical `id::` paths until then.
#
# `session_host` also lands here: it implements `id_sync::host::
# SessionHost` for the hub and `id_sync::artifact::ArtifactSink` for
# the directory, and the orphan rule puts those impls in the crate
# that owns the types (they sat in the facade only while the hub and
# directory did).

[features]
default = []
# The wasmtime dependency lives inside id-worlds (design feature
# mapping); the facade's `sandbox` feature forwards here.
sandbox = ["dep:wasmtime", "id-caps/sandbox", "id-core/sandbox"]
# The russh dependency lives inside id-worlds (design feature
# mapping); the facade `ssh` feature forwards here.
ssh = ["dep:russh"]
# Test harnesses used by the facade crate's web tests.
test-utils = []

[dependencies]
anyhow = "1"
blake3 = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures-lite = "2"
id-caps = { path = "../id-caps", default-features = false }
id-core = { path = "../id-core", default-features = false, features = [
  "world",
] }
id-events = { path = "../id-events", default-features = false }
id-groups = { path = "../id-groups", default-features = false }
id-store = { path = "../id-store", default-features = false }
id-sync = { path = "../id-sync", default-features = false }
iroh = "1"
iroh-base = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = { version = "0.101", features = ["net"] }
libc = "0.2"
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc" }
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
russh = { version = "=0.65.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
wasmtime = { version = "=48.0.7", default-features = false, features = [
  "cranelift",
  "runtime",
  "std",
], optional = true }

[dev-dependencies]
id-core = { path = "../id-core", default-features = false, features = [
  "test-utils",
] }
# The directory tests sign artifacts through the id-sync test seam
# (SignedArtifact::sign_unchecked), as the facade dev build did.
id-sync = { path = "../id-sync", default-features = false, features = [
  "test-utils",
] }
proptest = "1.12"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vt100 = "=0.16.2"
wat = "=1.261.0"

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
