[package]
name = "id-native-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Native reference shell for id (F13.6, design #788): a Bevy client speaking the F13.1 shell contract"
license = "MIT OR Apache-2.0"

# F13.6 step 1 (design doc/2026-11-01_design_id788.md §7): this crate is a
# workspace member but deliberately NOT a default member, so the ordinary
# `id` build never acquires Bevy or desktop-platform dependencies.
# Step 1 wired the application/bootstrap and the contract seam only.
# Step 2 (this feature set) adds the window/render plugins
# (bevy_window/bevy_winit/bevy_render) together with their flake
# system-library wiring in pkgs/id/nix-common.nix (wayland, X11,
# libxkbcommon, vulkan-loader).

[dependencies]
anyhow = "1"
bevy = { version = "0.17", default-features = false, features = [
  "std",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "x11",
  "wayland",
] }
id = { path = "../..", default-features = false, features = ["world"] }
iroh = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux `openat2(2)` with RESOLVE_BENEATH for the file-read open (#11420).
libc = "0.2"

[dev-dependencies]
# The live-session tests serve a real host in-process, the same way
# id-web tests do: id-worlds with the sandbox feature, plus the
# in-memory blob store the fixture recorder expects. Dev-only: none of
# this reaches the shipped shell or the default `id` build.
id-worlds = { path = "../id-worlds", default-features = false, features = [
  "sandbox",
] }
iroh-blobs = "0.103"
# The F13.7 end-to-end test observes the host's F12.6 audit trail
# through its public emission surface: every audit record is also
# emitted as a tracing event on the `id::audit` target (the record
# type itself is crate-private to id-worlds). Test-only.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# (mirrors pkgs/id/Cargo.toml so the clippy-native-shell gate, #5582,
# enforces the same standard as the default-member clippy-lint gate).
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
