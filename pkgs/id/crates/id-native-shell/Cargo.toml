[package]
name = "id-native-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Native reference shell for id (F13.6, design #788): a Bevy client speaking the F13.1 shell contract"
license = "MIT OR Apache-2.0"

# F13.6 step 1 (design doc/2026-11-01_design_id788.md §7): this crate is a
# workspace member but deliberately NOT a default member, so the ordinary
# `id` build never acquires Bevy or desktop-platform dependencies.
# Step 1 wires the application/bootstrap and the contract seam only;
# window/render plugins (bevy_window/bevy_winit/bevy_render) land in
# step 2 together with their flake system-library wiring.

[dependencies]
anyhow = "1"
bevy = { version = "0.17", default-features = false, features = ["std"] }
id = { path = "../..", default-features = false, features = ["world"] }
iroh = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# (mirrors pkgs/id/Cargo.toml so the clippy-native-shell gate, #5582,
# enforces the same standard as the default-member clippy-lint gate).
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
