[package]
name = "id-tui-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Terminal (TUI) shell for id (more-shells v2 slice 2, #12818): the text-native world-session client on the F13.1 shell contract, capability statement recorded per decision D3"
license = "MIT OR Apache-2.0"

# TUI shell (#12818, design more-shells v2 §2): a workspace member but
# deliberately NOT a default member, like id-native-shell and
# id-hw-shell, so the ordinary `id` build never acquires this shell's
# dependencies. Per decision D3 of the v2 outline, the crate's first
# recorded content is its capability statement (capability-statement.json),
# recorded before implementation starts; the frame-layer implementation
# (feature completion on #12818) builds on it in this crate.

[dependencies]
id = { path = "../..", default-features = false, features = ["world"] }
# Renderer only: no terminal backend here. The crossterm backend comes
# with the terminal loop, so the drawing code stays testable on
# ratatui's in-memory test backend.
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
serde_json = "1"

[dev-dependencies]
# The behavioral completion tests (tests/behavioral.rs, #12818 slice 2
# item c) serve a real host in-process, the same way the native shell's
# live_session.rs does: id-worlds with the sandbox feature, plus the
# in-memory blob store the fixture recorder expects, over loopback
# iroh. Dev-only: none of this reaches the shipped shell or the
# default `id` build.
id-worlds = { path = "../id-worlds", default-features = false, features = [
  "sandbox",
] }
iroh = "1"
iroh-blobs = "0.103"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# (mirrors pkgs/id/Cargo.toml and the other shell crates).
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
