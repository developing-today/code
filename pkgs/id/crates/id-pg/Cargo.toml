[package]
name = "id-pg"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Postgres-over-HTTP (PostgREST) query translator, collection allowlist, and endpoint registration for the id foreign data-store adapters (#5805; slices #13760, #13758)"
license = "MIT OR Apache-2.0"

# Slice #13760 of the Postgres-over-HTTP adapter design (#5805,
# doc/2026-11-23T20-55-00Z_design_id5805_postgres_http_adapter): the pure
# query translator. It accepts the data-shaped query object, validates it
# against the owner's collection allowlist (design section 3), and either
# produces the PostgREST request to send or refuses the query by stable
# feature name (section 3.2) before any network call. Transport, typed
# mapping (section 5.1), and the grantee error collapse (section 6) are the
# sibling slices #13763, #13761, and #13762; this crate is the allowlist
# layer those slices build on (design section 4, layer 1).

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"
serde_json = "1"

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
