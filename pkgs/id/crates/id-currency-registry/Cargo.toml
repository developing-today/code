[package]
name = "id-currency-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Currency control-plane registry (F1 of #2062, issue #2317; account factory F2, issue #2318): Postgres schema + migrations for ledger_allocation/currency/currency_issuer/account and the monotonic, never-recycled ledger-u32 allocator"
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
blake3 = "1"

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
