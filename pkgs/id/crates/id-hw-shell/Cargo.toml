[package]
name = "id-hw-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "ESP32-class hardware shell spike for id (more-shells v1 slice 3, #10929): the presence + journal-head + confirm/act subset of the F13.1 shell contract"
license = "MIT OR Apache-2.0"

# Hardware-shell spike (#10929, design more-shells v1 §3): a workspace
# member but deliberately NOT a default member, like id-native-shell,
# so the ordinary `id` build never acquires this shell's dependencies.
# The crate is transport-free on purpose: the device build pairs the
# frame builders and fold here with its own iroh (or paired-node)
# transport, and the tests pair them with the in-process host harness.

[dependencies]
id = { path = "../..", default-features = false, features = ["world"] }
serde_json = "1"

[dev-dependencies]
# The live test serves a real host in-process, the same way
# id-native-shell's live-session test does: id-worlds with the
# sandbox feature. Dev-only: none of this reaches the shipped shell.
anyhow = "1"
id-worlds = { path = "../id-worlds", default-features = false, features = [
  "sandbox",
] }
iroh = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# (mirrors pkgs/id/Cargo.toml and id-native-shell).
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
