[package]
name = "id-bevy-presenter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Bevy presenter-client reference app for id worlds, Bevy slice 4 (#13705): a 2D app that joins a world hosted in another process, declares its provider manifest and shows predicted presentation that reconciles or snaps back"
license = "MIT OR Apache-2.0"

# Slice 4 of 5 of the Bevy incorporation design of record
# (doc/2026-11-08_design_id5781.md, §3 first posture, §5, Q4; issue
# #13705). This is the first slice that produces provider surfaces, so it
# is the first to take the full `bevy` engine (design Q1: the engine is
# layered on the bevy_ecs-only bridge, never inside it). The bevy line is
# the 0.19.1 the bridge pins (design Q2) and that id-native-shell already
# locks; every feature below resolves to crates already in Cargo.lock.
# Like id-native-shell and id-bevy-bridge it is a workspace member but
# not a default member, so the ordinary `id` build never acquires Bevy.

[[bin]]
name = "id-bevy-presenter"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
  "std",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_text",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "gamepad",
  "keyboard",
] }
id-bevy-bridge = { path = "../id-bevy-bridge" }
id-caps = { path = "../id-caps", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Same windowing backends as id-native-shell, gated to Linux the same way.
bevy = { version = "0.19", default-features = false, features = [
  "x11",
  "wayland",
] }

[lints.rust]
# Rust compiler lints
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Enable standard lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Deny critical issues - these indicate bugs or serious problems
# Test modules should add: #[allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
# Allow print macros - this is a CLI application
print_stdout = "allow"
print_stderr = "allow"

# Restriction lints - selectively enable valuable checks
clone_on_ref_ptr = "warn"
create_dir = "warn"
deref_by_slicing = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"

# Allow specific lints - too noisy or conflict with project style
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
# Bevy systems take their parameters (Res, Query, Commands) by value by
# design; the lint would flag every system.
needless_pass_by_value = "allow"
