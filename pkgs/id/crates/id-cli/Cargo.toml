[package]
name = "id-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[features]
default = ["sandbox", "world"]
world = ["id-core/world"]
sandbox = ["world", "id-core/sandbox", "id-caps/sandbox", "id-worlds/sandbox"]
ssh = ["world", "id-worlds/ssh"]
web = ["world", "id-core/web", "dep:id-web", "dep:axum"]
dht = ["id-sync/dht"]

[dependencies]
anyhow = "1"
id-caps = { path = "../id-caps", default-features = false }
id-core = { path = "../id-core", default-features = false }
id-directory = { path = "../id-directory", default-features = false }
id-events = { path = "../id-events", default-features = false }
id-groups = { path = "../id-groups", default-features = false }
id-store = { path = "../id-store", default-features = false }
id-sync = { path = "../id-sync", default-features = false }
id-web = { path = "../id-web", default-features = false, optional = true }
axum = { version = "0.8", features = ["ws", "multipart"], optional = true }
id-worlds = { path = "../id-worlds", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
distributed-topic-tracker = "0.3"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures-lite = "2"
iroh = "1"
iroh-base = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = { version = "0.101", features = ["net"] }
iroh-mdns-address-lookup = "0.6"
libc = "0.2"
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc" }
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
rpassword = "7"
rustyline = "18"
tempfile = "3"
thiserror = "2"
toml = "1"
zeroize = "1"

[dev-dependencies]
id-core = { path = "../id-core", default-features = false, features = ["test-utils"] }
id-worlds = { path = "../id-worlds", default-features = false, features = ["test-utils"] }
proptest = "1.12"
