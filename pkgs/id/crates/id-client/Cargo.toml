[package]
name = "id-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Client-only Rust facade for the id native Android client v1 (slice 1 of #7938, child #13403)"
license = "MIT OR Apache-2.0"

# Slice 1 of the native Android client v1 plan (#7938, child issue
# #13403, design doc/2026-11-08T22-06-00Z_design_id_android_client):
# a dedicated client facade along the completed #3447 crate seams.
# This crate depends ONLY downward on client-safe leaves (id-core,
# id-caps, id-config, id-store, id-events, id-groups, id-sync,
# id-directory) and NEVER on id-worlds (wasmtime/russh/serve/listener),
# id-web (axum), id-cli, id-native-shell or id-hw-shell. The
# `android_dependency_boundary` test enforces that exclusion; the
# `authenticated_session` test proves one signed client session
# against an in-memory test world with no hosting surface.

[features]
default = []

[dependencies]
anyhow = "1"
id-caps = { path = "../id-caps", default-features = false }
id-config = { path = "../id-config" }
id-core = { path = "../id-core", default-features = false }
id-directory = { path = "../id-directory", default-features = false }
id-events = { path = "../id-events", default-features = false }
id-groups = { path = "../id-groups", default-features = false }
id-store = { path = "../id-store", default-features = false }
id-sync = { path = "../id-sync", default-features = false }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cognitive_complexity = "allow"
future_not_send = "allow"
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
