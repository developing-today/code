# Drop-in for the vps mode (relay.kit.toml). The relay binds ports 80 and 443, which are below
# 1024, so the User=iroh-relay account needs CAP_NET_BIND_SERVICE. The tunnel mode binds only
# loopback port 3340 and installs no drop-in, so its unit grants no capability.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
