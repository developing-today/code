# Hosted data-plane scaffold (#5199). LOCAL ONLY: this config is for
# wrangler dev / tests. No account-level deployment, production binding,
# or billable resource is authorized by this package — deployment and the
# real-account jurisdiction canary are gated on #2285 / #3403.
name = "id-hosted-worker"
main = "src/worker.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

# The tenancy provisioning state machine (E2 of #9083, #12797):
# one object per tenant, named by binding_id, driven by the tenancy
# Worker — never routed by this front door.
[[durable_objects.bindings]]
name = "TENANT_OPS"
class_name = "TenantOpsDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TenantOpsDO"]

# Slice A of #3811 (#9954) + #3401: content-addressed blob bytes,
# one immutable bucket per supported jurisdiction. Local emulation
# only — no production bucket is provisioned by this config (account
# gates #2285 / #3403 stay untouched). The routing module picks the
# binding strictly from the authoritative jurisdiction; a missing
# binding fails closed.
[[r2_buckets]]
binding = "BLOBS_US"
bucket_name = "id-hosted-blobs-us"

[[r2_buckets]]
binding = "BLOBS_EU"
bucket_name = "id-hosted-blobs-eu"

[[r2_buckets]]
binding = "BLOBS_FEDRAMP"
bucket_name = "id-hosted-blobs-fedramp"
