# --------------------------------------------------- store backends ------
# Store features select the backend BEHIND the existing port traits
# (id-core::port, PORT_CONTRACT_VERSION = 2) — never a second store
# abstraction. store-redb is the unconditional core default today.

[[feature]]
name = "store-redb"
status = "shipped"
adds = "Authoritative record + event backends as shipped: redb file for the event log, iroh-blobs FsStore/MemStore for blobs — behind the port traits, unmodified."
requires = []
roles = ["host", "consume"]
groups = ["store-record", "store-events"]
forwards = ["id-store"]
unconditional = true
note = "Core default for both groups: unconditional code today, so no `tree` name. Becomes a real switchable member in S6."

[[feature]]
name = "store-turso"
status = "designed"
adds = "Turso/libSQL-over-HTTP record-store adapter behind id-core::port (the §0.1 declared profile: declared, not wired), plus hosted-tenancy Turso event use (#9083)."
requires = []
roles = ["host"]
groups = ["store-record", "store-events"]
forwards = ["id-store"]
note = "Wired in S6 (alt-store-node)."

[[feature]]
name = "store-postgres-http"
status = "designed"
adds = "Postgres-over-HTTP record backend (#5805)."
requires = []
roles = ["host"]
groups = ["store-record"]
forwards = ["id-store"]

[[feature]]
name = "store-d1"
status = "designed"
adds = "Hosted D1 record backend (hosted edition)."
requires = []
roles = ["host"]
groups = ["store-record"]
forwards = ["id-store"]
note = "Gated on the hosted-edition slices (#2285/#3403 line); catalogued now so the composition has a name (S13)."

[[feature]]
name = "store-indexeddb"
status = "placeholder"
adds = "Browser-target IndexedDB adapter (the TS adapter in browser/)."
requires = []
roles = ["consume"]
forwards = []
targets = ["wasm32"]
note = "Target-constrained: wasm32 only, never a member of the host-binary groups."

# --------------------------------------------------- exclusivity groups ---
# Each port's authoritative backend: exactly one member per composition.

[groups.store-record]
description = "Authoritative record-store backend behind id-core::port."
members = ["store-redb", "store-turso", "store-postgres-http", "store-d1"]

[groups.store-events]
description = "Authoritative event-log backend."
members = ["store-redb", "store-turso"]

[groups.group-crypto]
description = "Group-encryption scheme. Worlds name their scheme in their manifest."
members = ["group-crypto-p2panda", "group-encryption-keyhive"]

# ------------------------------------------------------------- profiles ---
# The four #5788 levels as the registry's founding profiles, plus the
# served-environment examples Drew named. `headless` is canonical;
# `basement` is its alias (amendment 2) — aliases resolve before
# hashing and never change a composition hash. `extends` names a base
# profile; `features` are additions; `group_select` overrides the base's
# member for a group. Built-ins and user profiles share this format and
# one validation path (open profile sets, amendment 2).

[[profile]]
name = "plain"
description = "The user download: core only — the dumbest client with a basic store (§3). `plain` is the absence of meta-features plus core."
features = []
aliases = []
status = "active"

[[profile]]
name = "full"
description = "Curated all-on backend/server build — a profile, never --all-features (§0.3, §6). Slower boot accepted, measured per §9."
features = [
  "world-state",
  "sandbox-exec",
  "serve",
  "web",
  "ssh-serve",
  "dht",
  "directory",
  "currency",
  "rust",
  "roc-composer",
  "mcp-server",
  "import-notion",
  "import-obsidian",
  "import-evernote",
  "import-logseq",
  "import-joplin",
  "import-onenote",
  "transport-mcp",
  "transport-email",
  "transport-mqtt",
  "transport-irc",
  "transport-overlay",
  "transport-sneakernet",
]
aliases = []
status = "active"
note = "If a future feature is not in `full`, that is a catalogue decision recorded in the registry — never an accident of a flag list. `rust` is listed directly (compile capability of the server build) as well as arriving via `roc-composer`."

[[profile]]
name = "headless"
description = "Headless service (≈ #5788 L2): core + serve + execution + directory + dht. No presenters (no web, no ssh-serve)."
features = ["world-state", "sandbox-exec", "serve", "directory", "dht"]
aliases = ["basement"]
status = "active"

[[profile]]
name = "embedded"
description = "Library composition, no binary: core minus CLI/REPL, provider link only (≈ #5788 L0)."
features = []
aliases = []
library_only = true
status = "active"
note = "Core-minus-CLI is a composition-crate property (S4/S5), not a feature subtraction — features cannot subtract (§2.1)."

[[profile]]
name = "composer-host"
description = "Served example: the platform-composition environment (headless + composer + turso)."
extends = "headless"
features = ["roc-composer", "store-turso"]
aliases = []
status = "example"

[[profile]]
name = "alt-store-node"
description = "Served example: full with the record store switched to Turso."
extends = "full"
features = []
aliases = []
status = "example"

[profile.group_select]
store-record = "store-turso"

[[profile]]
name = "hosted-edge"
description = "Hosted edition shape: web + directory + D1 against the hosted-worker surface."
features = ["world-state", "serve", "web", "directory", "store-d1"]
aliases = []
status = "gated"
note = "Aspirational — gated on the hosted-edition slices (#2285/#3403 line, S13). Catalogued now so the composition has a name."
