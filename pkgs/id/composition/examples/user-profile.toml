# composition manifest — schema v1 (user-defined profile, amendment 2)
# Open profile sets: defining a new profile is a config act, not a code
# act. This served-team profile extends `headless` with the MQTT
# transport for a device-bridge deployment. It is validated, hashed,
# and registered by the same path as built-ins — nothing here required
# a code change. (transports mqtt/irc are `designed` in the catalogue;
# this manifest is valid from S1 and buildable when their seams land.)
name = "field-bridge-team"
target = "x86_64-unknown-linux-musl"
profile = "headless"
features = ["transport-mqtt", "dht"]
