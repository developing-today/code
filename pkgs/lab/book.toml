# mdBook configuration for the Lab Book (#13905).
# The book root is pkgs/lab itself so the sources stay next to the
# subject they document: plain markdown under book/, readable on
# GitHub exactly as written, and rendered as a book via the
# .#lab-docs flake output (pkgs/lab/docs.nix).

[book]
title = "Lab Book"
authors = ["developing-today"]
language = "en"
src = "book"

[build]
build-dir = "rendered"
# Every chapter in SUMMARY.md must exist on disk; never invent stubs.
create-missing = false

[output.html]
git-repository-url = "https://github.com/developing-today/code"
