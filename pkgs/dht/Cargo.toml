[package]
name = "dht"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "dht-rotation", "dht-node"]
resolver = "3"

[dependencies]
anyhow = "1.0.100"
futures-lite = "2"
iroh-gossip = "0.95"
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
dht-node = { path = "dht-node" }
