[package]
name = "idp-provider"
version = "0.1.0"
edition = "2021"
description = "Minimal OIDC provider for the self-hosted identity provider program (Slice 3 of #13658, implements #13409)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "idp-provider"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = "0.2"
der = "0.7"
rsa = "0.9"
pkcs1 = { version = "0.7", features = ["alloc"] }
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
x509-cert = "0.2"
der = "0.7"
rsa = "0.9"
pkcs1 = { version = "0.7", features = ["alloc"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
