[package]
name = "idp-provider"
version = "0.1.0"
edition = "2021"
description = "Minimal OIDC provider for the self-hosted identity provider program (Slice 3 of #13658, implements #13409)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "idp-provider"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
x509-cert = "0.2"
der = "0.7"
rsa = "0.9"
pkcs1 = { version = "0.7", features = ["alloc"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
x509-cert = "0.2"
der = "0.7"
rsa = "0.9"
pkcs1 = { version = "0.7", features = ["alloc"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
