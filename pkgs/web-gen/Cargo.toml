[workspace]
members = [
".", "crates/web-gen-core", "crates/web-gen-ui"]
resolver = "2"

[workspace.dependencies]
futures = "0.3.28"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
rand = "0.9.0"
wasm-bindgen = "0.2.87"
web-sys = "0.3.64"

[package]
name = "web-gen"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.72"
bacon = "2.12.0"
color-eyre = "0.6.2"
irust = "1.70.0"
js-sys = "0.3.64"
leptos = { workspace = true }
serde = { version = "1.0.174", features = ["derive"] }
sqlx = "0.9.0"
tracing = "0.1.37"
web-gen-ui = { path = "crates/web-gen-ui" }
