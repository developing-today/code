# fleet-hosted (#12583; design doc/2026-11-22T14-28-45Z_design_fleet-tool-workers-edition §3.1).
# LOCAL ONLY in this slice: this config is for wrangler dev / tests. No
# account-level deployment or billable resource is authorized by this
# package — the acceptance's "Worker deploys" is a local wrangler dev
# run until a later C issue owns production deployment.
name = "fleet-hosted"
main = "src/worker.ts"
compatibility_date = "2025-06-01"

# Non-secret configuration. RP_ISSUER is the #9077 devtoday OIDC
# provider's issuer URL, set per environment once the provider stands
# up; RP_JWKS_URI overrides its JWKS endpoint when set. TENANCY_FIXTURE_JSON
# is the skeleton's stand-in for component E's tenancy DB (see
# src/tenancy.ts) and is set by tests / local dev only. Secrets never
# live in this file.
[vars]
RP_AUDIENCE = "fleet-hosted"
