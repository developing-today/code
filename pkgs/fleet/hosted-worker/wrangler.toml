# fleet-hosted (#12583; design doc/2026-11-22T14-28-45Z_design_fleet-tool-workers-edition §3.1).
# Deployed by #14870 (the #14866 queue slice) via Cloudflare versions:
# the queue door runs on the QUEUE_D1 binding below. The other doors'
# production wiring (RP issuer, tenancy DB, GitHub App material) is
# still owned elsewhere — absent that config they fail closed, which
# is the posture this first deployment ships with.
name = "fleet-hosted"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# Non-secret configuration. RP_ISSUER is the #9077 devtoday OIDC
# provider's issuer URL, set per environment once the provider stands
# up; RP_JWKS_URI overrides its JWKS endpoint when set. TENANCY_FIXTURE_JSON
# is the skeleton's stand-in for component E's tenancy DB (see
# src/tenancy.ts) and is set by tests / local dev only. Secrets never
# live in this file.
[vars]
RP_AUDIENCE = "fleet-hosted"

# The message bridge, by service binding (#14373): the bridge door
# calls it presenting the PM stack's bridge credential
# (BRIDGE_PM_TOKEN — a secret, set by name at deployment, never in
# this file). Declared here so the deployed shape carries it.
[[services]]
binding = "BRIDGE"
service = "message-bridge"

# The fleet-queue D1 database (#14866): the queue door's
# Cloudflare-first home — when this binding is present, buildDeps
# runs the queue verbs against D1QueueStore over the shared
# fleet-queue schema. database_id assigned by #14870, the
# deployment slice: the database pre-existed in the account
# (created 2026-11-25T03:14:57Z, empty); #14870 provisioned the
# shared schema on it explicitly.
[[d1_databases]]
binding = "QUEUE_D1"
database_name = "fleet-queue"
database_id = "c17186b0-e27f-4b0b-9429-54c1ecf2f4fb"

# The ingestion sweeper's standing scope (#12590): the in-scope
# repos the scheduled run re-scans (#9060 §16). Set per environment
# at deployment; empty here (local only) means the scheduled sweep
# has nothing to scan.
# INGESTION_REPOS = "developing-today/code"

# The ingestion sweeper (#12590; design §7.3): the scheduled Worker
# half of dual ingestion, running the webhook route's check over
# the configured scope to catch listener misses. Declared here so
# the deployed shape carries it; the sweep stays inert while
# INGESTION_REPOS above is empty.
[triggers]
crons = ["*/15 * * * *"]
