# Rust toolchain configuration for fleet.
#
# IMPORTANT: DO NOT DELETE THIS FILE - it is required for Nix builds.
# Mirrors the pkgs/atlas-search / pkgs/id pin discipline.
#
# Components:
# - rustfmt: Code formatting
# - clippy: Linting

[toolchain]
# WARNING: this may cause rustc to build, ensure nixpkg has cached before committing this change.
channel = "1.99.0"                 # WARNING: this may cause rustc to build, ensure nixpkg has cached before committing this change.
components = ["rustfmt", "clippy"]
profile = "default"
