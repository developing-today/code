[package]
name = "fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One multicall binary for the fleet's tools: search, queue, dispatch, proxy — with compile-time capability-selected variants (epic developing-today/code#5412)."

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
fleet-registry = { workspace = true }
fleet-config = { workspace = true }
fleet-proxy-proto = { workspace = true }
fleet-queue = { workspace = true, optional = true }
fleet-dispatch = { workspace = true, optional = true }
fleet-dispatch-test = { workspace = true, optional = true }
fleet-search = { workspace = true, optional = true }
# The proxy CLIENT is part of every variant's registry (the
# connect capability ships in all three builds); only the broker
# half (fleet-proxy's `serve` feature) is variant-gated, through
# the proxy-serve feature below.
fleet-proxy = { workspace = true, default-features = false }
# fleet-secrets is linked only by builds whose domains resolve secrets;
# the connect variant must not carry it (§2: "nothing else").
fleet-secrets = { workspace = true, optional = true }
serde_json = { workspace = true }
# The gh domain (code#8887) mints App installation tokens over the
# GitHub API; same ureq pin as fleet-queue/fleet-search (rustls, no
# native-tls). Only the JSON-free surface is needed: bodies are read
# as strings and parsed with serde_json.
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
], optional = true }
# Direct dep for the SIGPIPE disposition reset in main (#5569);
# already in the workspace lockfile as a transitive dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Capability features (§2). The shipped variants are feature sets:
#   fleet         = default (full)
#   fleet-serve   = --no-default-features --features serve
#   fleet-connect = --no-default-features (base only: proxy-connect)
# proxy-connect is not a feature: it is compiled into every variant.
[features]
default = ["full"]
full = [
  "proxy-serve",
  "queue",
  "queue-broker",
  "secrets-broker",
  "search",
  "search-serve",
  "dispatch",
  "dispatch-test",
  "laptop-agent",
  "secrets",
  "gh",
]
# The serve variant's set, as one feature for the nix build.
serve = [
  "proxy-serve",
  "queue-broker",
  "secrets-broker",
  "search-serve",
  "secrets",
]
proxy-serve = ["fleet-proxy/serve"]
queue = ["dep:fleet-secrets", "dep:fleet-queue", "fleet-queue/client"]
queue-broker = [
  "dep:fleet-secrets",
  "dep:fleet-queue",
  "fleet-queue/queue-broker",
]
secrets-broker = [
  "dep:fleet-secrets",
  "dep:fleet-queue",
  "fleet-queue/secrets-broker",
]
# The search domain (step 5, #5433): the client crate carries its
# own token chain (atlas's client.json), so no fleet-secrets link.
search = ["dep:fleet-search", "fleet-search/client"]
# The search serve role (#5604): the Atlas service, from
# fleet-search's `serve` feature (atlas-core/embed/proto by path). Its
# Turso token chain is atlas-core's own read-only one, so no fleet-secrets.
search-serve = ["dep:fleet-search", "fleet-search/serve"]
dispatch = ["dep:fleet-dispatch"]
dispatch-test = ["dep:fleet-dispatch-test"]
# The secrets verb (step 6, #5554): in full and serve (§2 puts the
# secrets platform in both), never in connect ("nothing else").
secrets = ["dep:fleet-secrets"]
# The gh passthrough (code#8887): a working-seat client tool, so
# full only — the serve build's daemons shell out to it externally
# if ever needed, it is not a daemon role.
gh = ["dep:fleet-secrets", "dep:ureq"]
laptop-agent = ["dep:fleet-secrets"]
