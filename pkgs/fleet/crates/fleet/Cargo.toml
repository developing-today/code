[package]
name = "fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One multicall binary for the fleet's tools: search, queue, dispatch, proxy — with compile-time capability-selected variants (epic developing-today/code#5412)."

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
fleet-registry = { workspace = true }
fleet-config = { workspace = true }
fleet-proxy-proto = { workspace = true }
fleet-queue = { workspace = true, optional = true }
fleet-dispatch = { workspace = true, optional = true }
fleet-dispatch-test = { workspace = true, optional = true }
fleet-search = { workspace = true, optional = true }
# The proxy CLIENT is part of every variant's registry (the
# connect capability ships in all three builds); only the broker
# half (fleet-proxy's `serve` feature) is variant-gated, through
# the proxy-serve feature below.
fleet-proxy = { workspace = true, default-features = false }
# fleet-secrets is linked only by builds whose domains resolve secrets;
# the connect variant must not carry it (§2: "nothing else").
fleet-secrets = { workspace = true, optional = true }
# The laptop-agent client (developing-today/code#10796): the transport ladder
# and the verbs over the laptop daemon; laptop builds only.
fleet-laptop-agent = { workspace = true, optional = true }
# The bridge domain: fleet mailboxes on the message bridge (send/receive
# for central and agents); a working-seat client, so full only.
fleet-bridge = { workspace = true, optional = true }
# The agent domain: the front door that composes the other domains'
# verbs (enroll, doctor, next, shortlist) and `fleet shell`; a
# working-seat client, so full only.
fleet-agent = { workspace = true, optional = true }
# The cert domain (code#9157): PKI/X.509 roots, issuers, leaves,
# chains and bundles over the fleet-cert library crate.
fleet-cert = { workspace = true, optional = true }
serde_json = { workspace = true }
# The OpenCode session liveness probe (session_state.rs) only;
# optional so the connect variant stays under the D7 size gate.
base64 = { version = "0.23", optional = true }
# The actions domain's R2 egress helper (#13774): SigV4 signing
# over the workspace SHA-256.
sha2 = { workspace = true, optional = true }
# The gh domain (code#8887) mints App installation tokens over the
# GitHub API; same ureq pin as fleet-queue/fleet-search (rustls, no
# native-tls). Only the JSON-free surface is needed: bodies are read
# as strings and parsed with serde_json.
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
], optional = true }
# The gh domain's Metadata create path (code#9073): Ed25519 stamp
# signatures over the canonical provenance form. Deterministic
# RFC 8032 signing is the conformance surface — the hosted edition's
# golden vectors (pkgs/fleet/hosted-worker/test/stamp-sig.test.ts)
# must reproduce byte-exact — so signing is a library call, not a
# subprocess. Same major version as pkgs/id's id-worlds.
ed25519-dalek = { version = "3", optional = true }
# The gh domain's Metadata store (code#9073): #9074's pm_metadata
# schema over SQLite. Same pin as fleet-queue.
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
# Direct dep for the SIGPIPE disposition reset in main (#5569);
# already in the workspace lockfile as a transitive dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Capability features (§2). The shipped variants are feature sets:
#   fleet         = default (full)
#   fleet-serve   = --no-default-features --features serve
#   fleet-connect = --no-default-features (base only: proxy-connect)
# proxy-connect is not a feature: it is compiled into every variant.
[features]
default = ["full"]
full = [
  "proxy-serve",
  "queue",
  "queue-broker",
  "secrets-broker",
  "search",
  "search-serve",
  "dispatch",
  "dispatch-test",
  "laptop-agent",
  "commander",
  "http",
  "ssh",
  "laptop",
  "secrets",
  "gh",
  "bridge",
  "agent",
  "cert",
  "actions",
  "opencode-probe",
]
# The serve variant's set, as one feature for the nix build.
serve = [
  "proxy-serve",
  "queue-broker",
  "secrets-broker",
  "search-serve",
  "secrets",
  "opencode-probe",
]
proxy-serve = ["fleet-proxy/serve"]
queue = ["dep:fleet-secrets", "dep:fleet-queue", "fleet-queue/client"]
queue-broker = [
  "dep:fleet-secrets",
  "dep:fleet-queue",
  "fleet-queue/queue-broker",
]
secrets-broker = [
  "dep:fleet-secrets",
  "dep:fleet-queue",
  "fleet-queue/secrets-broker",
]
# The search domain (step 5, #5433): the client crate carries its
# own token chain (atlas's client.json), so no fleet-secrets link.
search = ["dep:fleet-search", "fleet-search/client"]
# The search serve role (#5604): the Atlas service, from
# fleet-search's `serve` feature (atlas-core/embed/proto by path). Its
# Turso token chain is atlas-core's own read-only one, so no fleet-secrets.
search-serve = ["dep:fleet-search", "fleet-search/serve"]
dispatch = ["dep:fleet-dispatch"]
dispatch-test = ["dep:fleet-dispatch-test"]
# The secrets verb (step 6, #5554): in full and serve (§2 puts the
# secrets platform in both), never in connect ("nothing else").
secrets = ["dep:fleet-secrets"]
# The gh passthrough (code#8887): a working-seat client tool, so
# full only — the serve build's daemons shell out to it externally
# if ever needed, it is not a daemon role.
gh = [
  "dep:fleet-secrets",
  "dep:ureq",
  "dep:base64",
  "dep:ed25519-dalek",
  "dep:rusqlite",
]
laptop-agent = ["dep:fleet-secrets", "dep:fleet-laptop-agent"]
# The laptop route forms (developing-today/code#13717): T1 commander
# (an MCP client over ureq; the bearer comes from fleet-secrets), T2
# http (the daemon client, HTTP legs only), T3 ssh (no deps: the
# binary owns the ssh argv), T0 the tiered walker composing T1-T3.
commander = ["dep:fleet-secrets", "dep:ureq"]
http = ["dep:fleet-laptop-agent"]
ssh = []
laptop = ["commander", "http", "ssh"]
# The actions domain (#13774): live exec sessions inside Actions
# runners — seat verbs over the queue client, the runner-side
# agent, and the R2 egress helper (SigV4 over sha2). Full only.
actions = [
  "dep:fleet-secrets",
  "dep:fleet-queue",
  "fleet-queue/client",
  "dep:ureq",
  "dep:sha2",
]
# Ask the local OpenCode server whether a worktree's recorded session
# is live before reusing it (session_state.rs). In full and serve;
# never in connect, where ureq+rustls would break the D7 2 MiB gate
# and no local OpenCode server is expected. Without it a recorded
# session is treated as not live, the same answer as an unreachable
# server.
opencode-probe = ["dep:ureq", "dep:base64"]
# Fleet messaging through the message bridge: central sends messages or
# commands; agents read, answer and ack. Full only (a client, not a role).
bridge = ["dep:fleet-bridge"]
# The agent's front door: enrolment, the intake ladder and `fleet shell`.
# It runs the other domains' verbs through this same binary, so it links
# only fleet-config. Full only.
agent = ["dep:fleet-agent"]
# The cert domain: a working-seat PKI client surface, so full only —
# never in serve (no daemon role) or connect (size gate).
cert = ["dep:fleet-cert"]

[dev-dependencies]
# Property tests for the gh read classifier (AGENTS.md testing
# doctrine), the same proptest version the other fleet crates use.
proptest = "1.12"
