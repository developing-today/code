[package]
name = "fleet-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The fleet search domain: the atlas-search client surface over the live Atlas service (job protocol), with the Q3 host defaults — via-service with loud standalone fallback on the sandbox seat, standalone on the laptop seat (epic developing-today/code#5412, step 5 #5433)."

[dependencies]
fleet-config = { workspace = true }
serde = { workspace = true }
# preserve_order, as in fleet-dispatch: the service envelope's key
# order is part of the printed output shape.
serde_json = { version = "1", features = ["preserve_order"] }
# The atlas via-service client's own HTTP stack (atlas-search's
# service.rs builds on ureq 3); same pin as fleet-queue.
ureq = { version = "3", features = ["rustls", "json"] }
