[package]
name = "fleet-kv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Identity-scoped local SQLite storage for fleet-kv."

[dependencies]
fleet-config = { workspace = true }
rusqlite = { version = "0.43", features = ["bundled"] }

# geteuid for the launch-identity ownership check; already in the
# workspace lockfile through the fleet binary.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12"
