[package]
name = "fleet-orgs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `fleet orgs` domain: the Turso-backed org/App registry, synced from each GitHub App's own JWT (developing-today/code#8884)."

[dependencies]
fleet-config = { workspace = true }
fleet-secrets = { workspace = true }
serde_json = { workspace = true }
# Pipe fd and fcntl for the App-key handoff to openssl (jwt.rs).
libc = "0.2"
# The GitHub API and Turso pipeline clients; the same ureq pin the
# fleet binary uses (rustls, no native-tls).
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }

[dev-dependencies]
# The offline store: the same SQL runs against SQLite in tests, so the
# schema, upserts and sync run are exercised without a network.
rusqlite = { version = "0.43", features = ["bundled"] }
proptest = "1.12"
