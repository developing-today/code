# mdBook configuration for the fleet book (#13165).
# The book root is pkgs/fleet itself so the sources stay next to the
# binary they document: plain markdown under book/, readable on GitHub
# exactly as written, and rendered as a book via the .#fleet-docs
# flake output (pkgs/fleet/docs.nix).
[book]
title = "fleet"
authors = ["developing-today"]
language = "en"
src = "book"

[build]
build-dir = "rendered"
# Every chapter in SUMMARY.md must exist on disk; never invent stubs.
create-missing = false

[output.html]
git-repository-url = "https://github.com/developing-today/code"
