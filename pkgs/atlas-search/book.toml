# mdBook configuration for the atlas book (#13251).
# The book root is pkgs/atlas-search itself so the sources stay next to
# the system they document: plain markdown under book/, readable on
# GitHub exactly as written, and rendered as a book via the
# .#atlas-docs flake output (pkgs/atlas-search/docs.nix).
[book]
title = "atlas"
authors = ["developing-today"]
language = "en"
src = "book"

[build]
build-dir = "rendered"
# Every chapter in SUMMARY.md must exist on disk; never invent stubs.
create-missing = false

[output.html]
git-repository-url = "https://github.com/developing-today/code"
