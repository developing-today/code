# atlas-search Worker (#6788). Deployed to the fleet Cloudflare
# account's workers.dev subdomain; the inbound gate is the
# GATE_TOKEN secret checked in src/index.ts (not public-open).
# The same gate covers the MCP endpoint (POST /mcp, #8625).
#
# Secrets (wrangler secret put; values never in this file):
#   GATE_TOKEN          inbound bearer gate for /v1/* and POST /mcp
#   SERVICE_TOKEN       the `cf-worker` client token of the fleet
#                       search service (ceiling_cap: personal)
#   ACCESS_CLIENT_ID    Cloudflare Access service token for
#   ACCESS_CLIENT_SECRET  atlas-search.security.cab
name = "atlas-search"
main = "src/index.ts"
compatibility_date = "2025-09-15"
workers_dev = true

[vars]
SERVICE_BASE = "https://atlas-search.security.cab"
# D1 tenant hot cache master flag (#9134 §8 item 1, #13100).
# Default off: with the flag off the Worker keeps the pre-cache
# read path exactly; src/hot_cache.ts is the only consumer.
HOT_CACHE_ENABLED = "false"

# Retention cycle (#9140 slice 7): every six hours, store a scheduled
# retention report and retire what it lists in classes an admin promoted
# to live-cold. With no RETAINED binding the handler does nothing.
[triggers]
crons = ["17 */6 * * *"]

[durable_objects]
bindings = [{ name = "QUERY_CACHE", class_name = "QueryCache" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QueryCache"]

# D1 tenant hot cache (#9134 design §5; store in src/hot_cache.ts,
# schema in migrations/). The database is created at deploy time;
# the id below is the local placeholder (miniflare and wrangler
# --local ignore it), replaced with the real id when the database
# is created -- same convention as pkgs/id/worker-poc/d1-journal-poc.
[[d1_databases]]
binding = "HOT_CACHE"
database_name = "atlas-hot-cache"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
