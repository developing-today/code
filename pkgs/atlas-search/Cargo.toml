# Atlas search — Rust binary + multi-client service (epic: developing-today/code#5350).
# Design of record: doc/2026-11-04T08-07-13Z_design_atlas_binary_service/ (§4 layout).
#
# Self-contained workspace on the pkgs/id pattern. Crates land one step at
# a time; step 1 (#5351) is atlas-embed only.
[workspace]
members = [
  "crates/atlas-embed",
  "crates/atlas-core",
  "crates/atlas-proto",
  "crates/atlas-search",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[profile.release]
# The embedder's numerics are part of a parity contract (Gate A): the
# release profile must not trade float exactness for speed.
# (No fast-math style flags exist in rustc, but keep this explicit so a
# future profile edit has to argue with the comment.)
