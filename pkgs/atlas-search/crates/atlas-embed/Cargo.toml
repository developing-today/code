[package]
name = "atlas-embed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Snowflake arctic-embed-m-v2.0 embedder for Atlas — ONNX Runtime (dynamically loaded) + the model's own Unigram tokenizer. Gate A parity crate for developing-today/code#5351."

[dependencies]
# Dynamic loading only: the ort crate must never download a prebuilt
# onnxruntime at build time (forbidden in the nix sandbox and a
# reproducibility hole — design §4). The runtime library is resolved
# from the deployment closure and handed to Embedder::load.
ort = { version = "2.0.0-rc.15", default-features = false, features = [
  "std",
  "load-dynamic",
  "ndarray",
] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same proptest version the fleet-queue / pkgs-id crates use.
proptest = "1.12"
