<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Bedside &amp; Away</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="seed.js"></script>
    <script defer src="catalog.js"></script>
    <script defer src="evidence.js"></script>
    <script defer src="summary.js"></script>
    <script defer src="decision.js"></script>
    <script defer src="steering.js"></script>
    <script defer src="variants.js"></script>
    <script defer src="reporting.js"></script>
    <script defer src="reporting-ui.js"></script>
    <script defer src="access-ui.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="mast">
        <span>THE HOUSEHOLD FIELD GUIDE</span
        ><button type="button" data-act="steering-general">
          Ask or request a change</button
        ><button data-view="settings">⚙ Settings</button>
      </div>
      <div class="hero">
        <p>01 / SLEEP, TRAVEL & SHARED GEAR</p>
        <h1>Bedside <i>&amp; Away</i></h1>
        <p>Compare what’s worth buying. Keep the decisions, not the clutter.</p>
      </div>
    </header>
    <main>
      <nav aria-label="Views">
        <button data-view="guide">Buying guide</button
        ><button data-view="items">Tracker</button
        ><button data-view="decision">Decision room</button
        ><button data-view="search">Search stores</button
        ><button data-view="intake">Quick submit</button
        ><button data-view="research">Market research</button
        ><button data-view="steering">Requests</button
        ><button data-view="history">History</button
        ><button data-view="report">Inventory & spend</button>
      </nav>
      <div id="storebar" class="panel"></div>
      <section id="app" aria-live="polite"></section>
    </main>
    <footer>
      Private site · Tracker data lives in a dedicated database. This browser
      keeps only its random device ID.
    </footer>
    <dialog id="modal"><form id="dialogform"></form></dialog>
  </body>
</html>
