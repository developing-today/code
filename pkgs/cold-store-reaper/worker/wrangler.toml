# Configuration for the cold-store rehydrator Worker — issue #5767,
# phase 2. Formerly wrangler.toml.example, when deployment was a manual
# REST PUT of the committed bundle; the deploy app
# (nix run .#cold-store-rehydrator-deploy) now stages this file with
# the flake-built bundle (package.nix) and drives the wrangler
# versions flow. The values below are the live ones (database ids are
# not secrets).
name = "cold-store-rehydrator"
main = "dist/worker.js"
compatibility_date = "2026-10-25"

# D1 manifest: objects -> members -> bundles lookups.
[[d1_databases]]
binding = "MANIFEST"
database_name = "cold-store-manifest"
database_id = "15d5f460-835c-4f24-b229-222908a5b30c"

# Single-flight per bundle id.
[[durable_objects.bindings]]
name = "BUNDLE_FLIGHT"
class_name = "BundleFlight"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BundleFlight"]

# Secrets — set out-of-band by the deploy app from Bitwarden by name
# (deploy.mjs WORKER_SECRETS), never committed:
#   REHYDRATOR_API_KEY    bearer token callers must present on /fetch/<sha>
#   GOOGLE_CLIENT_ID      OAuth client of the "Cold Store Reaper" app
#   GOOGLE_CLIENT_SECRET  ditto
#   GOOGLE_REFRESH_TOKEN  the one-time grant's refresh token
