[package]
name = "start-axum-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
cfg-if = "1"
hyper = "0.14.27"
leptos = "=0.4.10"
leptos_axum = { version = "=0.4.10", optional = true }
leptos_meta = "=0.4.10"
leptos_router = "=0.4.10"
libsql = { version = "=0.1.8", optional = true }
log = "0.4"
once_cell = "1.18.0"
start-axum-error = { path = "../start-axum-error" }
wasm-bindgen = "0.2.87"
web-sys = { version = "0.3.64", features = ["HtmlDocument"] }

[features]
hydrate = [
    "start-axum-error/hydrate",
    "leptos/hydrate",
    "leptos_meta/hydrate",
    "leptos_router/hydrate",
]
ssr = [
    "start-axum-error/ssr",
    "dep:leptos_axum",
    "dep:libsql",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
