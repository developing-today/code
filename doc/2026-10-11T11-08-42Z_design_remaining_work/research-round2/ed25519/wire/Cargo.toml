[package]
name = "ed25519-wire-compat"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone research crate for the round 2 ed25519 question. Not part of pkgs/id or the spikes workspace.
[workspace]

[dependencies]
# Same major/minor pins as the trees: 2.2.0 is what p2panda-core 0.7.1 (rev 3e84cac) uses;
# 3.0.0 is what pkgs/id/Cargo.lock and iroh-base 1.3.0 use. Feature sets mirror those dependents.
ed25519-dalek-v2 = { package = "ed25519-dalek", version = "=2.2.0", features = ["rand_core", "hazmat", "pkcs8", "digest"] }
ed25519-dalek-v3 = { package = "ed25519-dalek", version = "=3.0.0", features = ["rand_core", "hazmat", "serde", "zeroize", "pkcs8", "pem", "digest"] }
# Only used for EIGHT_TORSION and ED25519_BASEPOINT_POINT (small-order points for the forgery tests).
curve25519-dalek-v4 = { package = "curve25519-dalek", version = "=4.1.3" }
# rand_core 0.6 for ed25519-dalek 2.x generate(); getrandom 0.4 (re-exports rand_core 0.10) for 3.x generate().
rand_core-v06 = { package = "rand_core", version = "=0.6.4", features = ["getrandom"] }
getrandom-v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
# SHA-512 seed expansion done by hand in the test, so the expanded-key path does not depend on either crate's helpers.
sha2 = "0.10"
hex = "0.4"
