query($owner:String!,$name:String!,$cursor:String){repository(owner:$owner,name:$name){pullRequests(states:[OPEN,CLOSED,MERGED],first:50,after:$cursor,orderBy:{field:CREATED_AT,direction:ASC}){pageInfo{hasNextPage endCursor} nodes{number title bodyText isDraft mergeable mergeStateStatus createdAt updatedAt changedFiles additions deletions author{login} comments(first:20){totalCount nodes{author{login} bodyText createdAt}} files(first:100){nodes{path}}}}}}
