[package]
name = "s7-range-real"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Standalone crate. Not a member of /home/user/work/spikes.
[workspace]

# Pins copied from /home/user/work/spikes/Cargo.toml.
# Not enabled: p2panda-core's test_utils feature (it turns on the signature check in Header::verify).
[dependencies]
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c" }
iroh = "1.3.0"
redb = "=4.3.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"
