[workspace]
resolver = "3"
members = [
  "s1-transport",
  "s2-auth",
  "s3-history",
  "s4-blobs",
  "s5-cbor",
  "s6-index",
  "c1-connect",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c" }
p2panda-auth = { git = "https://github.com/p2panda/p2panda", rev = "da80c05b95269926bf58121cf6a2d3dd5ca41dfc" }
p2panda-encryption = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c", features = [
  "data_scheme",
  "message_scheme",
  "test_utils",
] }
p2panda-sync = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c" }
p2panda-store = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c" }
p2panda-stream = { git = "https://github.com/p2panda/p2panda", rev = "3e84cac48bba05c6857cce2ec433862b97f8d53c" }
iroh = "1.3.0"
iroh-blobs = "=0.103.1"
iroh-tickets = "1.0.0"
iroh-relay = "1.3.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake3 = "1"
ed25519-dalek = "2"
cbor-core = "=0.10.1"
dcbor = "=0.25.2"
redb = "=4.3.0"
unicode-normalization = "0.1"
tempfile = "3"
