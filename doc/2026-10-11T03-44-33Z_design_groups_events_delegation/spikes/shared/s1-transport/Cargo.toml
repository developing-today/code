[package]
name = "s1-transport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Trimmed from the scaffold. p2panda-encryption, p2panda-auth and p2panda-stream
# are dropped: p2panda-encryption's test_utils feature would enable
# p2panda-core/test_utils, which turns on the signature check in Header::verify.
# The spike must run against the non-test build of p2panda-core.
#
# Added beyond the workspace list:
#   postcard 1 (use-std): second wire-size measurement for LogSync messages.
#                         1.1.3 is already in the lock through iroh-tickets.
#   iroh-relay features = ["server"]: runs a local relay for spike part (f).

[dependencies]
p2panda-core = { workspace = true }
p2panda-sync = { workspace = true }
p2panda-store = { workspace = true }
iroh = { workspace = true }
iroh-tickets = { workspace = true }
iroh-relay = { workspace = true, features = ["server"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
cbor-core = { workspace = true, features = ["serde"] }
postcard = { version = "1", features = ["use-std"] }
