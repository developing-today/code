[package]
name = "beekem-spike"
version = "0.0.0"
edition = "2024"
publish = false

# `test_utils` exposes Cgka::secret, used to derive earlier epoch keys in the secrecy checks.
[dependencies]
beekem = { version = "=0.4.0", features = ["test_utils"] }
bincode = "1.3.3"
future_form = "=0.3.1"
futures = "0.3"
keyhive_crypto = "=0.2.1"
rand = { version = "0.9.0", features = ["std", "std_rng"] }

[workspace]
