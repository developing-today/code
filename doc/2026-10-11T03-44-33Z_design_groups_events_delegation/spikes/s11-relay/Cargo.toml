[package]
name = "s11-relay"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

# Standalone crate. Pins match /home/user/work/spikes/Cargo.toml, and Cargo.lock is copied from there.
[workspace]

[[bin]]
name = "s11"
path = "src/main.rs"

[dependencies]
iroh = "1.3.0"
# Not used in code. Enabled as c1-connect enables it, so the shared build cache is reused.
iroh-relay = { version = "1.3.0", features = ["server"] }
rustls-pki-types = "1.15.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
