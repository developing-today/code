[package]
name = "seitan-v2"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
ed25519-dalek = "3"
getrandom = "0.3"
hmac = "0.13"
rmp-serde = "1"
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[dev-dependencies]
base64 = "0.22"
crypto_secretbox = "0.1"
proptest = "1"
serde_bytes = "0.11"

# scrypt runs once per proptest case, so unoptimised dependencies make the suite slow.
[profile.dev.package."*"]
opt-level = 3

[workspace]
