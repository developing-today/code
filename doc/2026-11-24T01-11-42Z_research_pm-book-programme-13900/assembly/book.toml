# mdBook configuration for the Project Management book (#13900).
# The book root is pm-stack itself so the sources stay next to the
# stack they document: plain markdown under book/, readable on GitHub
# exactly as written, and rendered as a book via the .#pm-docs
# flake output (pm-stack/docs.nix).
[book]
title = "Project Management"
authors = ["developing-today"]
language = "en"
src = "book"

[build]
build-dir = "rendered"
# Every chapter in SUMMARY.md must exist on disk; never invent stubs.
create-missing = false

[output.html]
git-repository-url = "https://github.com/developing-today/code"
